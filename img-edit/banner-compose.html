<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  .canvas {
    position:relative;
    width:1422px;
    height:752px;
    font-family:'Heebo', sans-serif;
    overflow:hidden;
  }
  .canvas img.bg {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  /* Cover the Hebrew text area on the ticket (right side, to the right of BENEFIT badge) */
  .cover {
    position:absolute;
    top:257px;
    right:375px;
    width:495px;
    height:102px;
    background:
      linear-gradient(135deg, #0d1f3c 0%, #1a2a4a 50%, #0d1f3c 100%);
    z-index:2;
    border-radius:4px;
    box-shadow:inset 0 0 30px rgba(124,231,255,0.15);
  }
  /* New text */
  .new-text {
    position:absolute;
    top:257px;
    right:375px;
    width:495px;
    height:102px;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#ffffff;
    font-weight:900;
    line-height:1.15;
    padding:6px 8px;
  }
  .new-text .l1 {
    font-size:32px;
    color:#ffffff;
    text-shadow:0 0 8px rgba(124,231,255,0.6), 0 0 2px rgba(0,0,0,0.7);
    letter-spacing:-0.5px;
  }
  .new-text .l2 {
    font-size:28px;
    color:#ffffff;
    text-shadow:0 0 8px rgba(124,231,255,0.6), 0 0 2px rgba(0,0,0,0.7);
    letter-spacing:-0.5px;
    margin-top:4px;
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="bg" src="banner.jpg" alt="">
  <div class="cover"></div>
  <div class="new-text">
    <div class="l1">משתתפי הוובינר מקבלים</div>
    <div class="l2">הטבה של 100 ש״ח</div>
  </div>
</div>
</body>
</html>
