<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  .canvas {
    position:relative;
    width:1408px;
    height:768px;
    font-family:'Heebo', sans-serif;
    overflow:hidden;
  }
  .canvas img.bg {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  /* Cover the old title area (top strip) */
  .cover-top {
    position:absolute;
    top:0; left:0; right:0;
    height:180px;
    background: linear-gradient(180deg,
      rgba(8, 12, 30, 0.96) 0%,
      rgba(8, 12, 30, 0.92) 55%,
      rgba(8, 12, 30, 0.55) 85%,
      rgba(8, 12, 30, 0) 100%);
  }

  /* New title block */
  .title-block {
    position:absolute;
    top:28px; left:40px; right:40px;
    text-align:center;
    z-index:2;
  }
  .title-badge {
    display:inline-block;
    background:#E2B93B;
    color:#0a0a1f;
    padding:6px 18px;
    border-radius:999px;
    font-size:22px;
    font-weight:800;
    letter-spacing:0.5px;
    margin-bottom:12px;
    box-shadow:0 4px 16px rgba(226,185,59,0.5);
  }
  h1 {
    font-size:72px;
    font-weight:900;
    line-height:1.05;
    color:#fff;
    letter-spacing:-1.5px;
    text-shadow:0 4px 24px rgba(0,0,0,0.7);
  }
  h1 .hl {
    background:linear-gradient(135deg, #F5C842 0%, #00D4AA 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  /* Bottom bar with logo + CTA */
  .bottom-bar {
    position:absolute;
    bottom:0; left:0; right:0;
    height:120px;
    background: linear-gradient(0deg,
      rgba(8, 12, 30, 0.97) 0%,
      rgba(8, 12, 30, 0.88) 70%,
      rgba(8, 12, 30, 0) 100%);
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:0 50px 24px;
  }
  .brand {
    font-size:30px;
    font-weight:900;
    color:#fff;
  }
  .brand .logo {
    background:linear-gradient(135deg, #00D4AA, #8B5CF6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .brand .sub {
    display:block;
    font-size:15px;
    color:#b8b0d0;
    font-weight:500;
    margin-top:2px;
  }
  .cta-pill {
    background:linear-gradient(135deg, #25D366, #1DA851);
    color:#fff;
    padding:14px 28px;
    border-radius:999px;
    font-size:22px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:10px;
    box-shadow:0 8px 28px rgba(37,211,102,0.5);
  }
</style>
</head>
<body>
<div class="canvas">
  <img class="bg" src="original.png" alt="">
  <div class="cover-top"></div>
  <div class="title-block">
    <span class="title-badge">הורים · ילדים · בינה מלאכותית</span>
    <h1>הילדים שלכם משתמשים ב-AI<br><span class="hl">על ניוטרל 🏎️</span></h1>
  </div>
  <div class="bottom-bar">
    <div class="brand">
      <span class="logo">AI Lab</span>
      <span class="sub">ai-lab.co.il · הקבוצה השקטה להורים</span>
    </div>
    <div class="cta-pill">
      📲 הצטרפו לקבוצה — חינם
    </div>
  </div>
</div>
</body>
</html>
