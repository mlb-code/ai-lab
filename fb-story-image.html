<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    font-family: 'Heebo', sans-serif;
    direction: rtl;
  }

  .card {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    color: #fff;
    background: radial-gradient(ellipse at top, #1a0d3e 0%, #0a0717 45%, #03020b 100%);
    padding: 70px 60px 80px;
    display: flex;
    flex-direction: column;
  }

  /* Cosmic stars background */
  .stars {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(1.5px 1.5px at 80px 200px, #fff, transparent),
      radial-gradient(1px 1px at 240px 380px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.2px 1.2px at 420px 120px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 600px 270px, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 780px 90px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 920px 410px, #fff, transparent),
      radial-gradient(1px 1px at 130px 580px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 280px 720px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 480px 670px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 670px 820px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 870px 760px, #fff, transparent),
      radial-gradient(1px 1px at 1000px 950px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.2px 1.2px at 90px 1080px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 320px 1180px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 540px 1130px, #fff, transparent),
      radial-gradient(1px 1px at 770px 1240px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 950px 1180px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 110px 1370px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 350px 1480px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.5px 1.5px at 580px 1410px, #fff, transparent),
      radial-gradient(1px 1px at 800px 1520px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 970px 1450px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 200px 1690px, #fff, transparent),
      radial-gradient(1px 1px at 460px 1750px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.2px 1.2px at 720px 1810px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 920px 1700px, #fff, transparent);
  }

  /* Nebula */
  .nebula {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 18% 18%, rgba(108,60,225,.4), transparent 65%),
      radial-gradient(ellipse 55% 35% at 82% 70%, rgba(0,212,170,.30), transparent 65%),
      radial-gradient(ellipse 40% 25% at 50% 95%, rgba(255,179,71,.15), transparent 65%);
  }

  .container {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* TOP BAR */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 70px;
  }
  .logo {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: .5px;
    direction: ltr;
    text-shadow: 0 2px 14px rgba(0,0,0,.6);
  }
  .logo .lab { color: #00D4AA; }
  .badge-free {
    background: rgba(0,212,170,.18);
    border: 1.5px solid rgba(0,212,170,.5);
    color: #00D4AA;
    padding: 12px 22px;
    border-radius: 40px;
    font-size: 22px;
    font-weight: 800;
  }

  /* BIG TITLE */
  h1 {
    font-size: 130px;
    font-weight: 900;
    line-height: 0.96;
    letter-spacing: -3px;
    text-align: center;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, #fff 35%, #00D4AA 70%, #8B5CF6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 6px 30px rgba(108,60,225,.4);
  }
  .subtitle {
    font-size: 36px;
    font-weight: 700;
    color: rgba(255,255,255,.85);
    text-align: center;
    margin-bottom: 40px;
  }
  .subtitle .date { color: #00D4AA; font-weight: 900; }
  .subtitle .age  { color: #b89ffa; font-weight: 900; }

  /* IMAGE */
  .img-wrap {
    width: 100%;
    height: 540px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    margin-bottom: 50px;
    position: relative;
  }
  .img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 35%;
  }
  .img-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 70%, rgba(10,7,23,.4) 100%);
    pointer-events: none;
  }

  /* TOGETHER TAG */
  .together-tag {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, rgba(0,212,170,.22), rgba(108,60,225,.22));
    border: 1.5px solid rgba(0,212,170,.55);
    padding: 18px 28px;
    border-radius: 50px;
    margin: 0 auto 38px;
    width: max-content;
    max-width: 100%;
    box-shadow: 0 10px 32px rgba(0,212,170,.20);
  }
  .together-tag strong { color: #00D4AA; font-weight: 900; }
  .together-tag .t-icon { font-size: 40px; }

  /* INFO PILLS */
  .pills {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 50px;
  }
  .pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 26px;
    border-radius: 50px;
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.18);
  }
  .pill .icon { font-size: 32px; }
  .pill-bonus { background: rgba(255,179,71,.18); border-color: rgba(255,179,71,.55); }
  .pill-bonus strong { color: #ffb347; font-weight: 900; }
  .pill-date  { background: rgba(0,212,170,.18); border-color: rgba(0,212,170,.55); }
  .pill-date strong { color: #00D4AA; font-weight: 900; }
  .pill-age   { background: rgba(139,92,246,.18); border-color: rgba(139,92,246,.55); }
  .pill-age strong { color: #b89ffa; font-weight: 900; }

  /* CTA */
  .cta {
    margin-top: auto;
    text-align: center;
  }
  .cta-btn {
    display: inline-block;
    background: linear-gradient(135deg, #6C3CE1, #8B5CF6);
    color: #fff;
    font-weight: 900;
    font-size: 38px;
    padding: 22px 60px;
    border-radius: 60px;
    box-shadow: 0 12px 38px rgba(108,60,225,.55);
    margin-bottom: 18px;
  }
  .url {
    font-size: 24px;
    font-weight: 700;
    color: rgba(255,255,255,.7);
    direction: ltr;
    letter-spacing: .5px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="stars"></div>
  <div class="nebula"></div>

  <div class="container">
    <!-- Top -->
    <div class="top-bar">
      <div class="logo">AI <span class="lab">Lab</span></div>
      <div class="badge-free">🆓 וובינר חינם</div>
    </div>

    <!-- Title -->
    <h1>וובינר<br>להורים וילדים</h1>
    <div class="subtitle">
      <span class="date">📅 28.4 · 20:30</span> &nbsp;·&nbsp;
      <span class="age">גילאי 9-17</span>
    </div>

    <!-- Image -->
    <div class="img-wrap">
      <img src="webinar-bg.png" alt="">
    </div>

    <!-- Together tag -->
    <div class="together-tag">
      <span class="t-icon">👨‍👩‍👧</span>
      <span><strong>צפייה משותפת</strong> להורים וילדים</span>
    </div>

    <!-- Info pills -->
    <div class="pills">
      <div class="pill pill-date"><span class="icon">📅</span> יום ג׳ <strong>28.4</strong> · <strong>20:30</strong></div>
      <div class="pill pill-age"><span class="icon">👶</span> גילאי <strong>9-17</strong></div>
      <div class="pill pill-bonus"><span class="icon">🎁</span> הטבה <strong>₪100</strong> למשתתפים</div>
    </div>

    <!-- CTA -->
    <div class="cta">
      <div class="cta-btn">הירשמו חינם 🚀</div>
      <div class="url">ai-lab.co.il/webinar</div>
    </div>
  </div>
</div>

</body>
</html>
