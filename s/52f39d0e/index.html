<script>
(function(){
  "use strict";
  var HASHES = ["79ad3601e31eeb97935c60cb5aee0bdf185de6cd5029edc5077e8d1df924963d", "9d36cde44e382cb931fde85dc4c4a13c8b8acec09b2dd6a015830f9a6da32f3d"]; // sha256: student's phone (last 10 digits) + Meir's preview phone (Israeli, normalized to 0XXXXXXXXX)
  var K_AUTH = "ailab_s52_ok", K_LANG = "ailab_s52_lang";
  var TZ_IL = "Asia/Jerusalem";
  var ZOOM_EARLY_MIN = 60, DURATION_MIN = 60;

  var LESSONS = {"en": [{"title": "Welcome to the World of AI", "subtitle": "Getting started", "goal": "Get to know artificial intelligence, understand what it is and why it matters, and have your first hands-on experience", "html": "<div class=\"session-discussion\"><div class=\"disc-label\">Warm-up question (5 min)</div><p>Why did you join this course? What do you want to learn? Did you come to explore the tools and have fun, or do you have a specific goal? &bull; What have you already heard about artificial intelligence?</p></div><ul class=\"content-list\"><li><strong>What is AI?</strong> Artificial intelligence is when computers learn to do tasks that normally need human thinking &mdash; understanding language, recognizing images, making decisions. Unlike regular programs that follow strict rules, AI learns from data</li><li><strong>Types of AI:</strong> text (ChatGPT, Claude), images (DALL-E, NanoBanana), video (Sora, Novo), code (Claude, Claude Code), music (Suno). Each type works with a different kind of information</li><li><strong>AI in everyday life:</strong> Siri and Google Assistant (voice), Netflix (recommendations), Google Translate (language), Waze (navigation), Face ID (recognition), spam filters (email)</li><li><strong>Meet ChatGPT and Claude:</strong> two of the most powerful tools. You open both, ask them the same question, and compare the answers &mdash; each tool is strong at different things</li><li><strong>A short history:</strong> the idea of AI has been around since 1950 (Alan Turing), but the big breakthrough came in 2022 with ChatGPT. Israel is one of the world leaders in this field!</li><li><strong>What is Claude Desktop?</strong> Claude Desktop is the Claude app for your computer. You chat with Claude in plain language &mdash; and Claude can also create whole files for you: a web page, a document, a piece of code. It shows them right away as an <strong>Artifact</strong> &mdash; a live preview next to the chat. Instead of learning programming languages, you simply write what you want &mdash; and Claude writes the code for you! Think of it as a &quot;smart building assistant&quot; that knows how to build whole websites</li><li><strong>Installing Claude Desktop &mdash; step by step:</strong> (1) Go to <strong>claude.ai/download</strong> and download the version for your computer. (2) Run the file you downloaded &mdash; a DMG on Mac, an EXE on Windows. (3) Open Claude and sign in with your Claude account. (4) Create a folder on your computer for your project, with an English name and no spaces, for example: <code>my-project</code> &mdash; this is where your website files will live</li><li><strong>How do you build with Claude Desktop?</strong> Start a <strong>New chat</strong> and write what you want to build. For example: &quot;Build me a nice landing page with a title, an image and a button&quot; &mdash; within seconds Claude writes the code and shows you the page as an artifact! You can also ask for changes: &quot;Make the color blue&quot; or &quot;Add another button&quot; &mdash; and the preview updates</li><li><strong>From the chat to your computer:</strong> every artifact can be downloaded or copied. Save the page as <code>index.html</code> in your <code>my-project</code> folder and double-click it &mdash; it opens in Chrome. Later in the course we turn on file access (Connectors), so Claude can create and edit the website files in your folder directly</li></ul><div class=\"session-exercise glossary\"><div class=\"exercise-label\">Basic glossary</div><p><strong>AI &mdash; Artificial Intelligence</strong> &mdash; a computer that learns to do smart things on its own<br><strong>Prompt</strong> &mdash; the instruction or question you write to the AI, like &quot;write me a story&quot;<br><strong>Language Model</strong> &mdash; an AI that understands and creates text (like ChatGPT and Claude)<br><strong>Claude Desktop</strong> &mdash; the Claude app for your computer: you chat, and Claude builds files for you<br><strong>Artifact</strong> &mdash; a file Claude creates in the chat (a page, a document, code) that you can see and use right away<br><strong>Connector</strong> &mdash; a connection that lets Claude work with your files and your other accounts (like GitHub)<br><strong>HTML</strong> &mdash; the skeleton language of websites (like the bricks of a house)<br><strong>CSS</strong> &mdash; the design language of websites (like the paint, wallpaper and furniture)<br><strong>JavaScript</strong> &mdash; the language that makes a website work (buttons, animations)<br><strong>Startup</strong> &mdash; a young company that solves a problem in a new way<br><strong>MVP &mdash; Minimum Viable Product</strong> &mdash; the simplest version of a product that still works</p></div><div class=\"session-concepts\"><span class=\"concept-tag\">Artificial intelligence</span><span class=\"concept-tag\">Language model</span><span class=\"concept-tag\">Prompt</span><span class=\"concept-tag\">Machine learning</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>Which AI tools are you already using without knowing it? &bull; What&rsquo;s the difference between smart software and artificial intelligence?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (20 min)</div><p><strong>Part 1:</strong> You ask ChatGPT and Claude the same question &mdash; and compare the answers. Ask about something that interests you!</p><p><strong>Part 2:</strong> We open Claude Desktop together! Check that you&rsquo;re signed in, start a new chat and ask Claude to build something simple &mdash; for example &quot;Build me a page with a title and a button&quot; &mdash; and watch the artifact appear</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. Ask an AI (ChatGPT or Claude) <strong>5 questions</strong> about a topic that interests you &mdash; and write down what new things you learned!</p><p>2. Make sure <strong>Claude Desktop</strong> is installed and you&rsquo;re signed in. Start a new chat and type &quot;Hi, build me a simple page that says Hello World&quot; &mdash; see what happens! Save the page in your <code>my-project</code> folder.</p><p>3. Create free accounts on ChatGPT and Gemini too (if you haven&rsquo;t yet), so you can compare them with Claude. Ask your parents for help if you need it!</p><p>4. Think of 3 things in your life that you&rsquo;d like AI to help you with.</p><div class=\"hw-connection\">Next time we&rsquo;ll learn to write perfect prompts (instructions for the AI) to get exactly the results you want!</div></div>"}, {"title": "The Art of the Prompt", "subtitle": "AI", "goal": "Learn to talk to AI effectively + get to know Claude Desktop in depth", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We explored the world of AI, tried ChatGPT and Claude, and installed Claude Desktop. &bull; <strong>Home challenge check:</strong> Show Meir your 5 questions &mdash; what new things did you learn? Did Claude Desktop build your Hello World page? Which 3 things would you like AI to help you with?</p></div><ul class=\"content-list\"><li><strong>What is a prompt?</strong> The instruction or question you give the AI. Think of it like talking to a very smart assistant &mdash; the clearer you are, the better the result</li><li><strong>Technique 1 &mdash; be specific:</strong> instead of &quot;write about dogs&quot;, write &quot;write a 200-word post about 5 dog breeds that are great for families with young children&quot;</li><li><strong>Technique 2 &mdash; give context:</strong> &quot;I&rsquo;m building my first startup and I&rsquo;m new to this. Help me write...&quot; &mdash; the AI needs to know who you are and why you need it</li><li><strong>Technique 3 &mdash; set the format:</strong> &quot;Give me a numbered list / a table / 3 paragraphs / bullet points&quot; &mdash; tell the AI exactly how you want the answer</li><li><strong>Technique 4 &mdash; give an example:</strong> &quot;Write in a style similar to X, but with Y&quot; &mdash; examples help the AI understand what you&rsquo;re looking for</li><li><strong>Technique 5 &mdash; improve step by step:</strong> start simple, then ask for changes: &quot;make it shorter&quot;, &quot;add some humor&quot;, &quot;now translate it into Spanish&quot;. Every round gives you a better result!</li><li><strong>Claude Desktop in depth:</strong> in the second half of the lesson we explore Claude Desktop together, step by step: starting a new chat, attaching files and images (the + button), viewing and downloading Artifacts, and creating a <strong>Project</strong> for your startup &mdash; a space that keeps your files and instructions, so Claude remembers what you&rsquo;re building</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Prompt</span><span class=\"concept-tag\">Context</span><span class=\"concept-tag\">Iteration &mdash; improving in steps</span><span class=\"concept-tag\">Prompt Chaining</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>Why does the same prompt give different results in different tools? &bull; What&rsquo;s the difference between a good prompt and a bad prompt?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (15 min)</div><p><strong>Prompt challenge!</strong> Your task: &quot;Get the AI to create a logo (a symbol of a company) for an ice-cream shop&quot;. Write a few different prompts. Which one gives the best result? You and Meir compare them and learn from each one!</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. Write <strong>5 different prompts</strong> for the same task &mdash; notice how small changes affect the result. Try the techniques we learned!</p><p>2. Create a <strong>logo</strong> for a future project of yours using DALL-E or another AI image tool. Save the result!</p><p>3. Think of <strong>3 problems from your own life</strong> (school / hobbies / friends / family) &mdash; bring them ready to the next lesson! They will become your startup idea.</p><div class=\"hw-connection\">The logo you create will be used when we build your website! And the problems &mdash; they are the foundation of your startup (a young company).</div></div>"}, {"title": "Thinking Like an Entrepreneur — Finding Problems", "subtitle": "Entrepreneurship", "goal": "Learn to think like an entrepreneur, spot real problems and understand the formula of a successful startup", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We learned to write perfect prompts and explored Claude Desktop in depth. &bull; <strong>Home challenge check:</strong> Did you manage to create a logo with AI? Which of your 5 prompts worked best? Show Meir your results &mdash; and the 3 problems you brought!</p></div><ul class=\"content-list\"><li><strong>What is a startup?</strong> A young company that solves a real problem in a new or better way. The difference from a regular business: a startup aims to grow fast and reach lots of people</li><li><strong>Israeli startup stories:</strong> Waze (solved traffic jams), Wix (made building websites easy), Monday (organized the chaos of managing projects), Iron Dome (security). Israel is called the &quot;Startup Nation&quot; &mdash; it has more startups per person than any other country!</li><li><strong>The formula:</strong> Problem &rarr; Solution &rarr; Product &rarr; Business. Everything starts with a real problem that people want solved!</li><li><strong>Design Thinking:</strong> a method with 5 steps &mdash; Empathize (understand the user), Define (what exactly is the problem), Ideate (brainstorm), Prototype (build a quick first version), Test (get feedback)</li><li><strong>How do you find good problems?</strong> What annoys you in everyday life? What do your friends complain about? What do you wish were easier? The best problems are the ones you experience yourself!</li><li><strong>Good problem vs bad problem:</strong> good = lots of people have it, they&rsquo;d pay for a solution, it&rsquo;s specific. Bad = too vague, only you have it, it&rsquo;s already completely solved</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Startup</span><span class=\"concept-tag\">Design Thinking</span><span class=\"concept-tag\">Validation &mdash; checking the problem</span><span class=\"concept-tag\">Problem &rarr; Solution</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>What annoys you most at school? &bull; Which app do you wish existed?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (15 min)</div><p><strong>Brainstorming:</strong> You find 3 problems from your own life (school, hobbies, friends, family) and present them to Meir. Then you decide together: which problem is the most interesting and worth solving?</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. Choose <strong>the best problem</strong> of the 3 &mdash; the one you&rsquo;re most excited about.</p><p>2. Do <strong>Validation</strong>: ask 5 people (friends, family) if they have this problem too. Write down their answers!</p><p>3. <strong>Research the competitors:</strong> search on Google &mdash; is there already a solution to this problem? What does it do well and what is it missing?</p><div class=\"hw-connection\">Next time we&rsquo;ll turn the problem into a real product with a Value Proposition and a plan! Bring your research.</div></div>"}, {"title": "From Idea to Product", "subtitle": "Strategy", "goal": "Choose the best idea, define a target audience, build a value proposition and plan an MVP", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We learned to think like entrepreneurs and found 3 problems from your life. &bull; <strong>Home challenge check:</strong> Which problem did you choose? Did you ask 5 people? Which competitors did you find? Show Meir!</p></div><ul class=\"content-list\"><li><strong>Choosing the idea:</strong> out of the 3 problems from last time, you choose the best one. The criteria: Is the problem real? Do I understand it? Can I build a solution? Will people want to use it?</li><li><strong>Target Audience:</strong> who exactly suffers from this problem? Not &quot;everyone&quot; but &quot;high-school students who struggle with math&quot;. You build a Persona (an imaginary character) who represents your ideal user</li><li><strong>Value Proposition:</strong> what&rsquo;s special about your solution? The formula: &quot;We help [audience] solve [the problem] by [the solution]. Unlike [competitors], we [unique advantage]&quot;</li><li><strong>Competitor analysis:</strong> what already exists? Search on Google, download similar apps. What&rsquo;s good about them? What&rsquo;s missing? Your opportunity is in the gaps!</li><li><strong>MVP (Minimum Viable Product):</strong> the simplest version that is still useful. Not the full product &mdash; just enough to test whether people want it</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Target Audience</span><span class=\"concept-tag\">Value Proposition</span><span class=\"concept-tag\">Competitors</span><span class=\"concept-tag\">MVP &mdash; Minimum Viable Product</span><span class=\"concept-tag\">Persona &mdash; user character</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>Who is your user? Describe them in detail. &bull; What is the one thing your product does better than anything else?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (15 min)</div><p><strong>Project Builder:</strong> open the &quot;My project&quot; tab on this page and answer the 10 guiding questions together with Meir &mdash; the project name, the problem, the solution, the Target Audience and the Value Proposition. This becomes the Spec (specification) of your product!</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. Finish all 10 questions of the &quot;Project Builder&quot; &mdash; this is your Specification!</p><p>2. Think about the <strong>design of your website:</strong> which colors fit your product? Which Sections should your Landing Page have?</p><p>3. Get the logo you created in lesson 2 ready &mdash; you&rsquo;ll attach it in Claude Desktop while building!</p><div class=\"hw-connection\">Next time we start building the website for real with Claude Desktop! Make sure it&rsquo;s installed and you&rsquo;re signed in.</div></div>"}, {"title": "Building a Website — Part 1", "subtitle": "Building", "goal": "Understand how a website is built (HTML/CSS/JS), get to know servers and domains, and build your first Landing Page with AI", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We chose an idea, defined a target audience and filled in the &quot;Project Builder&quot;. &bull; <strong>Home challenge check:</strong> Did you finish the 10 questions? Did you think about design and colors? Show Meir your spec!</p></div><ul class=\"content-list\"><li><strong>Quick review &mdash; Claude Desktop:</strong> you already know Claude Desktop. Today we use it to build your website! Reminder: open your startup Project, start a new chat and write what you want to build &mdash; Claude writes the code and shows the page as an artifact</li><li><strong>How a website is built &mdash; 3 layers:</strong> every website on the internet is made of 3 languages that work together: <strong>HTML</strong> = the skeleton &mdash; defines what&rsquo;s on the page (titles, text, images, buttons). Like the bricks of a house. <strong>CSS</strong> = the design &mdash; decides how the page looks (colors, sizes, fonts). Like the paint and wallpaper. <strong>JavaScript</strong> = the brain &mdash; makes things happen (what happens when you click a button, animations). Like the electricity in the house.</li><li><strong>What is a server? How does a website work?</strong> When you type a website address in your browser (a program for browsing, like Chrome), your computer (<strong>the Client</strong>) sends a request to a <strong>Server</strong> &mdash; a powerful computer sitting in a Data Center that holds the website&rsquo;s files. The server sends the files back and the browser shows them. <strong>Domain</strong> = the readable address (like google.com). <strong>Hosting</strong> = the server that stores the files. Right now we build <strong>locally</strong> &mdash; the file is only on your computer. In lesson 7 we put it on the internet!</li><li><strong>Building with AI &mdash; your first prompt:</strong> in a new chat, attach your logo and your project spec (the + button), then write a detailed prompt. For example: <code>&quot;Build me a landing page for my startup with a catchy headline, an About section, 3 feature cards, testimonials and a contact form. Modern design, blue and purple colors&quot;</code> &mdash; the more detailed the prompt, the better the result!</li><li><strong>Preview:</strong> the artifact shows your website right next to the chat. To keep it, download the file and save it as <code>index.html</code> in your <code>my-project</code> folder, then double-click it to open it in Chrome. Once we turn on file access in Claude Desktop (a Connector to your project folder), Claude saves and edits <code>index.html</code> in the folder by itself &mdash; after every change, go back to Chrome and press Refresh (F5). Check: Is the text readable? Are the colors right? Are the buttons in place?</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">HTML &mdash; the skeleton</span><span class=\"concept-tag\">CSS &mdash; design</span><span class=\"concept-tag\">JavaScript &mdash; action</span><span class=\"concept-tag\">Server</span><span class=\"concept-tag\">Domain</span><span class=\"concept-tag\">Landing Page</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>Which sections should your landing page have? &bull; Which colors represent your brand? &bull; What&rsquo;s the difference between a website that&rsquo;s only on your computer and a website that lives on the internet?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (25 min)</div><p><strong>Let&rsquo;s build a Landing Page!</strong> You open Claude Desktop, start a new chat in your startup Project, and write a detailed prompt for your product. The result: a complete website with a headline, a description, Features and a button! How beautiful can you make it?</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. <strong>Improve your landing page</strong> &mdash; add the logo you created in lesson 2! Attach it in Claude Desktop and ask: &quot;Add my logo to the top of the page&quot;</p><p>2. <strong>Mobile check:</strong> see how the website looks on a phone &mdash; in Chrome, right-click &rarr; Inspect &rarr; click the phone icon. Doesn&rsquo;t look good? Ask Claude: &quot;Make the website responsive (fits every screen)&quot;</p><p>3. Add another Section &mdash; for example: About, Features, or FAQ (frequently asked questions)</p><div class=\"hw-connection\">Next time we&rsquo;ll upgrade your website with Animation, Forms and a Navigation menu!</div></div>"}, {"title": "Building a Website — Part 2", "subtitle": "Development", "goal": "Upgrade the website with animations, mobile responsiveness, forms and advanced features", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We built your first landing page! &bull; <strong>Home challenge check:</strong> Did you add the logo? Did you check it in the phone view? Show Meir your website!</p></div><ul class=\"content-list\"><li><strong>Animation &mdash; what it is and why it matters:</strong> animations make a website feel professional and &quot;alive&quot;. Types: (1) <strong>Hover</strong> &mdash; a button changes color when you move the mouse over it. (2) <strong>Fade-in</strong> &mdash; elements appear gently as you scroll down. (3) <strong>Slide</strong> &mdash; images or text slide in from the side. Example prompt for Claude: &quot;Add smooth animations when sections appear on scroll, and a hover effect on buttons&quot;</li><li><strong>Responsive Design &mdash; the website must work on phones!</strong> More than 60% of people browse on their phones! <strong>Responsive</strong> = the website changes automatically to fit the screen size. On a computer: 3 columns side by side. On a phone: one column, bigger buttons, readable text. Example prompt: &quot;Make the website responsive &mdash; it should work on phones with one column and big buttons&quot;</li><li><strong>Professional Navigation:</strong> every serious website needs a fixed Header at the top with: a Logo, Links to parts of the site (About, Features, Contact), and a bold CTA button (Call To Action). On mobile &mdash; a Hamburger Menu (3 lines) that opens when you tap it. Example prompt: &quot;Add a fixed navigation menu at the top with a logo, links, and a hamburger menu on mobile&quot;</li><li><strong>Form:</strong> a &quot;Contact us&quot; form is a must on every business website. Fields: Name, Email, Message. Add Validation (checking that the fields are filled in and the email is valid). Example prompt: &quot;Add a contact form with name, email and message, with validation and a styled send button&quot;</li><li><strong>Working smart with Claude:</strong> ask for one change at a time, then check the result in the artifact or in Chrome. Something broke? Tell Claude exactly what you see (or attach a screenshot) and ask it to fix it &mdash; or to go back to the previous version. Keep all the website work in the same Project, so Claude remembers your design and your files</li><li><strong>Next step &mdash; taking it live:</strong> until now your website lives only on your computer (locally). For the whole world to see it, it needs to be <strong>Deployed (uploaded to a server)</strong>. That&rsquo;s exactly what we do in the next lesson: Claude Desktop connects to GitHub through Connectors, and you get a real public link. Today&rsquo;s job is to get the website ready: it looks good, works on a phone, and everything you can click actually works</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Animation</span><span class=\"concept-tag\">Responsive</span><span class=\"concept-tag\">Navigation</span><span class=\"concept-tag\">Form</span><span class=\"concept-tag\">Iteration &mdash; one change at a time</span><span class=\"concept-tag\">Deploy &mdash; next lesson</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>Check your website in the phone view &mdash; what needs to change? &bull; Which animation will make your website feel professional?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (25 min)</div><p><strong>Website upgrade!</strong> Add at least 3 things to your website with Claude Desktop, one request at a time: (1) a contact Form, (2) at least one Animation, (3) a Navigation menu with your logo and links. How professional can you make it?</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. <strong>Mobile check:</strong> look at your website in Chrome&rsquo;s phone view (right-click &rarr; Inspect &rarr; phone icon). Ask Claude to fix anything that doesn&rsquo;t fit.</p><p>2. <strong>User Testing:</strong> show your website to 3 people (family or friends) and ask for Feedback: What did they like? What wasn&rsquo;t clear? What would they change? Write down the answers.</p><p>3. Think: how will your startup make money? Subscription (monthly plan)? Freemium (free + premium)? E-commerce (online shop)?</p><div class=\"hw-connection\">Next time we take your website live on the internet &mdash; with a real link you can share!</div></div>"}, {"title": "Taking Your Website Live", "subtitle": "Launch", "goal": "Put your website on the internet with Claude Desktop and Connectors, get a real public link, and understand how domains work", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We upgraded your website with animations, a form and a navigation menu! &bull; <strong>Home challenge check:</strong> Did you check it on your phone? Did you get feedback? Did you think about how your startup will make money? Today we take the website live.</p></div><ul class=\"content-list\"><li><strong>What is a server?</strong> A server is a computer that is always on and connected to the internet. Its job is to &quot;serve&quot; your website to anyone who asks for it. <strong>Hosting</strong> = renting space on such a computer. Right now your website lives only on your computer &mdash; like a cake in your own kitchen that only your family can taste. Hosting puts it in a bakery window on a busy street, open day and night</li><li><strong>Claude Desktop Connectors:</strong> a Connector lets Claude work directly with your other accounts &mdash; for example, create a repository in GitHub for you. Where to find them: <strong>Claude Desktop &rarr; Settings &rarr; Connectors</strong>. Each connection asks for your permission: read what it wants to do, then approve. You stay in control &mdash; Claude explains before it acts, and you can disconnect at any time</li><li><strong>GitHub &mdash; your website&rsquo;s home in the cloud:</strong> (1) Open a free account at <code>github.com</code> together with a parent. (2) In Claude Desktop: Settings &rarr; Connectors &rarr; GitHub &rarr; Connect &rarr; sign in &rarr; Approve. (3) Attach your website files to the chat and ask Claude: &quot;Create a new repository called my-startup-site and upload my website files to it&quot;. A <strong>Repository</strong> = a folder in the cloud that keeps every version of your files</li><li><strong>Supabase (only if you need it):</strong> if your website saves information &mdash; sign-ups, contact-form messages &mdash; it needs a database. Connect Supabase the same way (Settings &rarr; Connectors &rarr; Supabase), and Claude can create a table, show you the data and explain it. A site that only shows information doesn&rsquo;t need it</li><li><strong>Deploy with Railway:</strong> Railway reads your repository on GitHub and turns it into a live website. Steps: <code>railway.com</code> &rarr; Login with GitHub &rarr; New Project &rarr; Deploy from GitHub repo &rarr; choose your repository &rarr; Settings &rarr; Networking &rarr; Generate Domain. You get a real address like <code>my-startup-site.up.railway.app</code>. From now on, every change Claude uploads to GitHub updates the website by itself. <strong>The simplest free option:</strong> if your site is only HTML, CSS and JS, GitHub Pages can host it too (repository Settings &rarr; Pages)</li><li><strong>A domain &mdash; your own name:</strong> instead of a long address, a name like <code>mystartup.com</code>. Choosing: short, easy to say and spell, no hyphens if possible. <code>.com</code> for the whole world, <code>.co.il</code> for Israel. Where to buy: Namecheap or Cloudflare for <code>.com</code>, an Israeli registrar for <code>.co.il</code>. A <code>.com</code> usually costs about $10&ndash;15 a year. Buying is done together with a parent. Tip: check the renewal price and skip extras you don&rsquo;t need</li><li><strong>Connecting the domain:</strong> <strong>DNS</strong> = the internet&rsquo;s phone book &mdash; it tells the world which server your name points to. In Railway: Settings &rarr; Networking &rarr; Custom Domain &rarr; type your domain, and Railway shows a DNS record. Where you bought the domain: DNS settings &rarr; add that record exactly. It can take from a few minutes up to 24&ndash;48 hours. Railway adds the <strong>HTTPS padlock</strong> (a free security certificate) automatically. Stuck? Send Claude a screenshot and ask what to type</li><li><strong>Speed &amp; launch checklist:</strong> open <code>pagespeed.web.dev</code>, paste your link and check the mobile score. Slow? Ask Claude to compress the images and make the site load faster. Before you share: looks good on phone and computer &bull; every button and link works &bull; page title and tab icon &bull; the form sends &bull; padlock in the address bar &bull; no spelling mistakes</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Server &mdash; always-on computer</span><span class=\"concept-tag\">Hosting</span><span class=\"concept-tag\">Connector</span><span class=\"concept-tag\">Repository</span><span class=\"concept-tag\">Deploy</span><span class=\"concept-tag\">Domain</span><span class=\"concept-tag\">DNS &mdash; the address book</span><span class=\"concept-tag\">HTTPS &mdash; the padlock</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>If you could choose any domain for your startup, what would it be? &bull; What should a visitor understand in the first 5 seconds after opening your link?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Practice together (25 min)</div><p><strong>Taking it live!</strong> (1) Connect GitHub in Claude Desktop &rarr; Settings &rarr; Connectors. (2) Ask Claude to create a repository and upload your website. (3) Deploy on Railway and generate a public address. (4) Open the live link on your phone and go through the launch checklist.</p></div><div class=\"session-homework\"><div class=\"homework-label\">Home challenge</div><p>1. <strong>Send your live link to Meir</strong> on WhatsApp.</p><p>2. <strong>Feedback from 3 people:</strong> send the link to 3 family members or friends and ask: What did you understand in 5 seconds? What did you like? What would you change? Write down the answers.</p><p>3. <strong>Improve 1&ndash;2 things</strong> from the feedback &mdash; ask Claude to make the changes, and the website updates by itself.</p><p>4. <strong>Start your Pitch Deck:</strong> 5 slides &mdash; the problem, the solution, a demo (your live link!), the business model, and a summary. Practice the pitch once out loud.</p><p>5. <strong>Domain (optional, with a parent):</strong> look for a name you like. If you buy one, we&rsquo;ll connect it together.</p><div class=\"hw-connection\">Next time &mdash; Pitch Day! Your live link will be the star of your demo, and the feedback you collected will make your pitch stronger.</div></div>"}, {"title": "Pitch Day", "subtitle": "Presenting", "goal": "Present your project — 3 minutes: problem, solution, live demo!", "html": "<div class=\"session-recap\"><div class=\"recap-label\">Last time</div><p>We took your website live: we connected GitHub in Claude Desktop through Connectors, deployed on Railway, got a public link and went through the launch checklist. &bull; <strong>Home challenge check:</strong> Did you send Meir your live link? What did your 3 people say &mdash; and what did you improve? Show Meir your Pitch Deck draft &mdash; let&rsquo;s see!</p></div><ul class=\"content-list\"><li><strong>The structure of a Pitch (3 minutes):</strong> Hook (a catchy opening &mdash; 10 seconds) &mdash; a surprising fact or a question. Problem (30 seconds). Solution (30 seconds). Live Demo (90 seconds) &mdash; show the product with your live link! Business Model (20 seconds). CTA / Call To Action (10 seconds)</li><li><strong>Tips for a great presentation:</strong> speak slowly and clearly. Look at your audience or the camera. Be excited &mdash; if you&rsquo;re not excited, your audience won&rsquo;t be either! Practice &mdash; rehearse at least twice. It&rsquo;s okay to make mistakes &mdash; just keep going</li><li><strong>Slide Design:</strong> big text, few words on each Slide, use images, consistent colors, and your logo</li><li><strong>Live Demo:</strong> prepare a Plan B in case something breaks (for example, screenshots of the website). Show your most impressive Feature first. Keep it simple!</li><li><strong>Celebration!</strong> Every project is an achievement! You learned AI and Entrepreneurship, and built a real product that lives on the internet. That&rsquo;s more than most adults know how to do!</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Pitch &mdash; presentation</span><span class=\"concept-tag\">Hook &mdash; catchy opening</span><span class=\"concept-tag\">Demo &mdash; live demonstration</span><span class=\"concept-tag\">CTA &mdash; Call To Action</span></div><div class=\"session-discussion\"><div class=\"disc-label\">Let&rsquo;s talk about it</div><p>What&rsquo;s the most impressive thing about your project? &bull; Practice your Hook &mdash; the first 10 seconds!</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Pitch Day! (35 min)</div><p><strong>It&rsquo;s Pitch Day!</strong> You present a 3-minute Pitch to Meir: the Problem, the Solution, and a Live Demo of your website! Then you get Feedback from Meir &mdash; and if you like, invite your family to watch too. Will it be your Best Pitch ever?</p></div><div class=\"session-homework\"><div class=\"homework-label\">Congratulations!</div><p>You finished the course! You have a real Live Website on the internet, a Business Plan for your startup, and AI tools that will stay with you always.</p><p><strong>A challenge for life:</strong> keep building, improving, and trying new tools. Share your website with friends and family! The world belongs to young entrepreneurs!</p></div>"}], "he": [{"title": "ברוכה הבאה לעולם ה-AI", "subtitle": "היכרות", "goal": "הכרות עם בינה מלאכותית, הבנה מה זה ולמה זה חשוב, חוויה ראשונה", "html": "<div class=\"session-discussion\"><div class=\"disc-label\">שאלת פתיחה (5 דקות)</div><p>למה הצטרפת לקורס? מה את רוצה ללמוד? באת להכיר את הכלים וליהנות, או שיש לך מטרה ספציפית? &bull; מה כבר שמעת על בינה מלאכותית?</p></div><ul class=\"content-list\"><li><strong>מה זה AI?</strong> בינה מלאכותית היא כשמחשבים לומדים לבצע משימות שדורשות חשיבה אנושית &mdash; הבנת שפה, זיהוי תמונות, קבלת החלטות. בניגוד לתוכנות רגילות שעובדות לפי כללים קשיחים, AI לומד מנתונים</li><li><strong>סוגי AI:</strong> טקסט (ChatGPT, Claude), תמונות (DALL-E, NanoBanana), וידאו (Sora, Novo), קוד (Claude, Claude Code), מוזיקה (Suno). כל סוג מעבד סוג אחר של מידע</li><li><strong>AI בחיי היומיום:</strong> Siri ו-Google Assistant (קול), נטפליקס (המלצות), Google Translate (שפה), Waze (ניווט), Face ID (זיהוי), פילטרי ספאם (אימייל)</li><li><strong>הכרות עם ChatGPT ו-Claude:</strong> שני הכלים החזקים ביותר. נכנסים, שואלים את אותה שאלה בשניהם, ורואים את ההבדלים &mdash; כל כלי חזק בדברים שונים</li><li><strong>היסטוריה קצרה:</strong> הרעיון של AI קיים מ-1950 (אלן טיורינג), אבל הפריצה הגדולה הגיעה ב-2022 עם ChatGPT. ישראל מובילה עולמית בתחום!</li><li><strong>מה זה Claude Desktop (קלוד דסקטופ)?</strong> Claude Desktop היא האפליקציה של Claude למחשב. מדברים עם Claude בשפה רגילה &mdash; ו-Claude יודע גם ליצור בשבילך קבצים שלמים: דף אינטרנט, מסמך, קוד. הוא מציג אותם מיד כ-<strong>Artifact (ארטיפקט)</strong> &mdash; תצוגה חיה ליד השיחה. במקום ללמוד שפות תכנות &mdash; את פשוט כותבת מה את רוצה, ו-Claude כותב את הקוד בשבילך! חשבי על זה כמו &quot;עוזר בנייה חכם&quot; שיודע לבנות אתרים שלמים</li><li><strong>התקנת Claude Desktop &mdash; צעד אחר צעד:</strong> (1) היכנסי ל-<strong>claude.ai/download</strong> והורידי את הגרסה למחשב שלך. (2) הריצי את הקובץ שירד &mdash; DMG במק, EXE בווינדוס. (3) פתחי את Claude והתחברי עם חשבון ה-Claude שלך. (4) צרי במחשב תיקייה לפרויקט, עם שם באנגלית ובלי רווחים, למשל: <code>my-project</code> &mdash; כאן יישמרו קבצי האתר שלך</li><li><strong>איך בונים עם Claude Desktop?</strong> פותחים <strong>New chat</strong> (שיחה חדשה) וכותבים מה רוצים לבנות. לדוגמה: &quot;תבנה לי דף נחיתה יפה עם כותרת, תמונה וכפתור&quot; &mdash; ותוך שניות Claude כותב את הקוד ומציג לך את הדף כארטיפקט! אפשר גם לבקש שינויים: &quot;תחליף צבע לכחול&quot; או &quot;תוסיף עוד כפתור&quot; &mdash; והתצוגה מתעדכנת</li><li><strong>מהשיחה אל המחשב:</strong> כל ארטיפקט אפשר להוריד או להעתיק. שומרים את הדף בשם <code>index.html</code> בתיקייה <code>my-project</code> ולוחצים עליו לחיצה כפולה &mdash; הוא נפתח ב-Chrome. בהמשך הקורס נפעיל גישה לקבצים (Connectors &mdash; מחברים), כדי ש-Claude יוכל ליצור ולערוך את קבצי האתר ישירות בתיקייה שלך</li></ul><div class=\"session-exercise glossary\"><div class=\"exercise-label\">מילון מושגים בסיסי</div><p><strong>AI &mdash; בינה מלאכותית (אי.איי)</strong> &mdash; מחשב שלומד לעשות דברים חכמים לבד<br><strong>Prompt &mdash; פרומפט</strong> &mdash; ההוראה או השאלה שכותבים ל-AI, כמו &quot;תכתוב לי סיפור&quot;<br><strong>Language Model &mdash; מודל שפה</strong> &mdash; AI שמבין ויוצר טקסט (כמו ChatGPT ו-Claude)<br><strong>Claude Desktop &mdash; קלוד דסקטופ</strong> &mdash; האפליקציה של Claude למחשב: מדברים איתו, והוא בונה בשבילך קבצים<br><strong>Artifact &mdash; ארטיפקט</strong> &mdash; קובץ ש-Claude יוצר בשיחה (דף, מסמך, קוד) שאפשר לראות ולהשתמש בו מיד<br><strong>Connector &mdash; מחבר</strong> &mdash; חיבור שמאפשר ל-Claude לעבוד עם הקבצים שלך ועם חשבונות אחרים (כמו GitHub)<br><strong>HTML &mdash; אייצ׳.טי.אם.אל</strong> &mdash; שפת השלד של אתרים (כמו הלבנים של בית)<br><strong>CSS &mdash; סי.אס.אס</strong> &mdash; שפת העיצוב של אתרים (כמו צבע, טפט ורהיטים)<br><strong>JavaScript &mdash; ג׳אווה-סקריפט</strong> &mdash; השפה שגורמת לאתר לעבוד (כפתורים, אנימציות)<br><strong>Startup &mdash; סטארטאפ</strong> &mdash; חברה צעירה שפותרת בעיה בדרך חדשה<br><strong>MVP &mdash; מוצר מינימלי</strong> &mdash; הגרסה הכי פשוטה של המוצר שעדיין עובדת</p></div><div class=\"session-concepts\"><span class=\"concept-tag\">בינה מלאכותית</span><span class=\"concept-tag\">מודל שפה</span><span class=\"concept-tag\">פרומפט</span><span class=\"concept-tag\">למידת מכונה</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>באילו כלי AI את כבר משתמשת בלי לדעת? &bull; מה ההבדל בין תוכנה חכמה לבינה מלאכותית?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (20 דקות)</div><p><strong>חלק 1:</strong> את שואלת את ChatGPT ואת Claude את אותה שאלה &mdash; ומשווה תשובות. שאלי על נושא שמעניין אותך!</p><p><strong>חלק 2:</strong> פותחים ביחד את Claude Desktop! בודקים שאת מחוברת, פותחים שיחה חדשה ומבקשים מ-Claude לבנות משהו פשוט &mdash; למשל &quot;תבנה לי דף עם כותרת וכפתור&quot; &mdash; ורואים את הארטיפקט מופיע</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. שאלי AI (ChatGPT או Claude) <strong>5 שאלות</strong> על נושא שמעניין אותך &mdash; ורשמי מה למדת חדש!</p><p>2. ודאי ש-<strong>Claude Desktop</strong> מותקן ושאת מחוברת. פתחי שיחה חדשה וכתבי &quot;Hi, build me a simple page that says Hello World&quot; &mdash; ראי מה קורה! שמרי את הדף בתיקייה <code>my-project</code>.</p><p>3. פתחי חשבונות חינמיים גם ב-ChatGPT וב-Gemini (אם עוד לא), כדי להשוות אותם ל-Claude. בקשי עזרה מההורים אם צריך!</p><p>4. חשבי על 3 דברים מהחיים שלך שהיית רוצה ש-AI יעזור לך בהם.</p><div class=\"hw-connection\">בשיעור הבא נלמד לכתוב פרומפטים (Prompt &mdash; הוראות ל-AI) מושלמים כדי לקבל בדיוק את התוצאות שאת רוצה!</div></div>"}, {"title": "אמנות הפרומפט", "subtitle": "AI", "goal": "ללמוד לדבר עם AI בצורה אפקטיבית + להכיר לעומק את Claude Desktop", "html": "<div class=\"session-recap\"><div class=\"recap-label\">בשיעור הקודם</div><p>הכרנו את עולם ה-AI, ניסינו ChatGPT ו-Claude, והתקנו את Claude Desktop. &bull; <strong>בדיקת משימת בית:</strong> הראי למאיר את 5 השאלות &mdash; מה למדת חדש? Claude Desktop בנה לך את דף ה-Hello World? באילו 3 דברים היית רוצה ש-AI יעזור לך?</p></div><ul class=\"content-list\"><li><strong>מה זה פרומפט?</strong> ההוראה או השאלה שנותנים ל-AI. חשבי על זה כמו לדבר עם עוזר חכם מאוד &mdash; ככל שתהיי ברורה יותר, כך התוצאה תהיה טובה יותר</li><li><strong>טכניקה 1 &mdash; היי ספציפית:</strong> במקום \"כתוב על כלבים\" כתבי \"כתוב פוסט של 200 מילים על 5 גזעי כלבים מומלצים למשפחות עם ילדים קטנים\"</li><li><strong>טכניקה 2 &mdash; תני הקשר:</strong> \"אני בונה את הסטארטאפ הראשון שלי ואני חדשה בתחום. עזור לי לכתוב...\" &mdash; ה-AI צריך לדעת מי את ולמה את צריכה את זה</li><li><strong>טכניקה 3 &mdash; הגדירי פורמט:</strong> \"תן לי רשימה ממוספרת / טבלה / 3 פסקאות / נקודות\" &mdash; אמרי ל-AI בדיוק איך את רוצה את התשובה</li><li><strong>טכניקה 4 &mdash; תני דוגמה:</strong> \"כתוב בסגנון דומה ל-X, אבל עם Y\" &mdash; דוגמאות עוזרות ל-AI להבין מה את מחפשת</li><li><strong>טכניקה 5 &mdash; שפרי צעד אחר צעד:</strong> התחילי פשוט, ואז בקשי שינויים: \"תקצר\", \"תוסיף הומור\", \"עכשיו תרגם לספרדית\". כל סבב נותן תוצאה טובה יותר!</li><li><strong>Claude Desktop לעומק:</strong> בחצי השני של השיעור נכיר ביחד את Claude Desktop, צעד אחר צעד: פתיחת שיחה חדשה, צירוף קבצים ותמונות (כפתור ה-+), צפייה בארטיפקטים והורדה שלהם, ויצירת <strong>Project (פרויקט)</strong> לסטארטאפ שלך &mdash; מרחב ששומר את הקבצים וההוראות שלך, כך ש-Claude זוכר מה את בונה</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Prompt &mdash; פרומפט</span><span class=\"concept-tag\">Context &mdash; הקשר</span><span class=\"concept-tag\">Iteration &mdash; שיפור בשלבים</span><span class=\"concept-tag\">Prompt Chaining &mdash; שרשור פרומפטים</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>למה אותו פרומפט נותן תוצאות שונות בכלים שונים? &bull; מה ההבדל בין פרומפט טוב לפרומפט רע?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (15 דקות)</div><p><strong>אתגר פרומפטים!</strong> המשימה שלך: &quot;גרמי ל-AI ליצור לוגו (Logo &mdash; סמל/סימן של חברה) לחנות גלידה&quot;. כתבי כמה פרומפטים שונים. איזה מהם נותן את התוצאה הכי טובה? נשווה יחד עם מאיר ונלמד מכל אחד מהם!</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. כתבי <strong>5 פרומפטים שונים</strong> לאותה משימה &mdash; שימי לב איך שינויים קטנים משפיעים על התוצאה. התנסי בטכניקות שלמדנו!</p><p>2. צרי <strong>לוגו (Logo)</strong> לפרויקט עתידי שלך באמצעות DALL-E או כלי AI אחר ליצירת תמונות. שמרי את התוצאה!</p><p>3. חשבי על <strong>3 בעיות מהחיים שלך</strong> (בית ספר / תחביבים / חברים / משפחה) &mdash; הביאי אותן מוכנות לשיעור הבא! הן יהפכו לרעיון הסטארטאפ שלך.</p><div class=\"hw-connection\">הלוגו שתיצרי ישמש אותך כשנבנה את האתר! והבעיות &mdash; הן הבסיס לסטארטאפ (Startup &mdash; חברה צעירה) שלך.</div></div>"}, {"title": "חשיבה יזמית — מוצאים בעיות", "subtitle": "יזמות", "goal": "ללמוד לחשוב כמו יזמים, לזהות בעיות אמיתיות ולהבין את הנוסחה של סטארטאפ מצליח", "html": "<div class=\"session-recap\"><div class=\"recap-label\">בשיעור הקודם</div><p>למדנו לכתוב פרומפטים מושלמים והכרנו לעומק את Claude Desktop. &bull; <strong>בדיקת משימת בית:</strong> הצלחת ליצור לוגו עם AI? איזה מ-5 הפרומפטים עבד הכי טוב? הראי למאיר את התוצאות &mdash; ואת 3 הבעיות שהבאת!</p></div><ul class=\"content-list\"><li><strong>מה זה סטארטאפ?</strong> חברה צעירה שפותרת בעיה אמיתית בדרך חדשה או טובה יותר. ההבדל מעסק רגיל: סטארטאפ שואף לצמוח מהר ולהגיע להרבה אנשים</li><li><strong>סיפורי יזמים ישראליים:</strong> Waze (פתרו את בעיית הפקקים), Wix (הקלו על בניית אתרים), Monday (סידרו כאוס בניהול פרויקטים), Iron Dome (ביטחון). ישראל = \"אומת הסטארטאפ\" &mdash; יותר סטארטאפים לנפש מכל מדינה!</li><li><strong>הנוסחה:</strong> בעיה &#x2190; פתרון &#x2190; מוצר &#x2190; עסק. הכל מתחיל מבעיה אמיתית שאנשים רוצים לפתור!</li><li><strong>Design Thinking (חשיבה עיצובית):</strong> שיטה בת 5 שלבים &mdash; Empathize/הזדהי (הביני את המשתמש), Define/הגדירי (מה הבעיה בדיוק), Ideate/חשבי (סיעור מוחות), Prototype/בני (אב-טיפוס מהיר), Test/בדקי (קבלי פידבק &mdash; Feedback, משוב)</li><li><strong>איך מוצאים בעיות טובות?</strong> מה מעצבן אותך ביומיום? על מה חברים מתלוננים? מה היית רוצה שיהיה קל יותר? הבעיות הכי טובות הן אלה שאת חווה בעצמך!</li><li><strong>בעיה טובה vs בעיה רעה:</strong> טובה = הרבה אנשים חווים אותה, מוכנים לשלם על פתרון, ספציפית. רעה = עמומה מדי, רק את חווה אותה, כבר נפתרה לגמרי</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Startup &mdash; סטארטאפ</span><span class=\"concept-tag\">Design Thinking &mdash; חשיבה עיצובית</span><span class=\"concept-tag\">Validation &mdash; אימות בעיה</span><span class=\"concept-tag\">Problem &rarr; Solution</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>מה הדבר שהכי מעצבן אותך בבית הספר? &bull; איזו אפליקציה היית רוצה שתהיה קיימת?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (15 דקות)</div><p><strong>סיעור מוחות (Brainstorming):</strong> את מזהה 3 בעיות מהחיים שלך (בית ספר, תחביבים, חברים, משפחה) ומציגה אותן למאיר. אחר כך מחליטים יחד: איזו בעיה הכי מעניינת ושווה לפתור?</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. בחרי את <strong>הבעיה הכי טובה</strong> מתוך ה-3 &mdash; זו שאת הכי מתלהבת ממנה.</p><p>2. עשי <strong>Validation (אימות)</strong>: שאלי 5 אנשים (חברים, משפחה) אם גם הם חווים את הבעיה. רשמי את התשובות!</p><p>3. <strong>מחקר מתחרים (Competitors):</strong> חפשי בגוגל &mdash; האם כבר קיים פתרון לבעיה? מה הוא עושה טוב ומה חסר בו?</p><div class=\"hw-connection\">בשיעור הבא נהפוך את הבעיה למוצר אמיתי עם הצעת ערך (Value Proposition) ותוכנית! הביאי את המחקר שלך.</div></div>"}, {"title": "מרעיון למוצר", "subtitle": "אסטרטגיה", "goal": "לבחור את הרעיון הטוב ביותר, להגדיר קהל יעד, לבנות הצעת ערך ולתכנן MVP", "html": "<div class=\"session-recap\"><div class=\"recap-label\">בשיעור הקודם</div><p>למדנו חשיבה יזמית ומצאנו 3 בעיות מהחיים שלך. &bull; <strong>בדיקת משימת בית:</strong> איזו בעיה בחרת? שאלת 5 אנשים? אילו מתחרים מצאת? הראי למאיר!</p></div><ul class=\"content-list\"><li><strong>בחירת הרעיון:</strong> מתוך 3 הבעיות מהשיעור הקודם, בוחרים את הטובה ביותר. הקריטריונים: האם הבעיה אמיתית? האם אני מבינה אותה? האם אפשר לבנות פתרון? האם אנשים ירצו להשתמש?</li><li><strong>קהל יעד (Target Audience):</strong> מי בדיוק סובל מהבעיה? לא &quot;כולם&quot; אלא &quot;תלמידי תיכון בישראל שמתקשים במתמטיקה&quot;. בונים Persona (פרסונה &mdash; דמות בדיונית) שמייצגת את המשתמש האידיאלי</li><li><strong>הצעת ערך (Value Proposition):</strong> מה מיוחד בפתרון שלך? הנוסחה: &quot;אנחנו עוזרים ל-[קהל] לפתור את [הבעיה] על ידי [הפתרון], בניגוד ל-[מתחרים (Competitors)] אנחנו [יתרון ייחודי]&quot;</li><li><strong>ניתוח מתחרים:</strong> מה כבר קיים? חפשי בגוגל, הורידי אפליקציות דומות. מה טוב בהן? מה חסר? ההזדמנות שלך נמצאת בפערים!</li><li><strong>MVP (Minimum Viable Product &mdash; מוצר מינימלי):</strong> הגרסה הכי פשוטה שעדיין שימושית. לא המוצר המלא, רק מספיק כדי לבדוק אם אנשים רוצים את זה</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Target Audience &mdash; קהל יעד</span><span class=\"concept-tag\">Value Proposition &mdash; הצעת ערך</span><span class=\"concept-tag\">Competitors &mdash; מתחרים</span><span class=\"concept-tag\">MVP &mdash; מוצר מינימלי</span><span class=\"concept-tag\">Persona &mdash; דמות משתמש</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>מי המשתמש שלך? תארי אותו בפירוט. &bull; מה הדבר האחד שהמוצר שלך עושה טוב יותר מכל דבר אחר?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (15 דקות)</div><p><strong>בונה הפרויקט (Project Builder):</strong> פותחים את הלשונית &quot;הפרויקט שלי&quot; בדף הזה ועונים יחד עם מאיר על 10 השאלות המנחות &mdash; שם הפרויקט, הבעיה, הפתרון, קהל היעד (Target Audience), והצעת הערך (Value Proposition). זה יהפוך לאפיון (Spec &mdash; מפרט) המוצר שלך!</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. השלימי את כל 10 השאלות ב&quot;בונה הפרויקט&quot; &mdash; זה האפיון (Specification &mdash; מפרט) שלך!</p><p>2. חשבי על <strong>עיצוב (Design) האתר:</strong> אילו צבעים מתאימים למוצר שלך? אילו חלקים (Sections &mdash; מקטעים) צריכים להיות בדף הנחיתה (Landing Page)?</p><p>3. הכיני את הלוגו שיצרת בשיעור 2 &mdash; תצרפי אותו ב-Claude Desktop בזמן הבנייה!</p><div class=\"hw-connection\">בשיעור הבא נתחיל לבנות את האתר באמת עם Claude Desktop! ודאי שהוא מותקן ושאת מחוברת.</div></div>"}, {"title": "בונים אתר — חלק 1", "subtitle": "בנייה", "goal": "הבנת מבנה אתר (HTML/CSS/JS), הכרת שרתים ודומיינים, ובנייה ראשונה של דף נחיתה (Landing Page) עם AI", "html": "<div class=\"session-recap\"><div class=\"recap-label\">בשיעור הקודם</div><p>בחרנו רעיון, הגדרנו קהל יעד ומילאנו את \"בונה הפרויקט\". &bull; <strong>בדיקת משימת בית:</strong> השלמת את 10 השאלות? חשבת על עיצוב וצבעים? הראי למאיר את האפיון שלך!</p></div><ul class=\"content-list\"><li><strong>חזרה מהירה &mdash; Claude Desktop:</strong> את כבר מכירה את Claude Desktop. היום נשתמש בו כדי לבנות את האתר שלך! תזכורת: פותחים את ה-Project של הסטארטאפ, פותחים שיחה חדשה וכותבים מה רוצים לבנות &mdash; Claude כותב את הקוד ומציג את הדף כארטיפקט</li><li><strong>מבנה אתר &mdash; 3 שכבות (Layers):</strong> כל אתר באינטרנט בנוי מ-3 שפות שעובדות ביחד: <strong>HTML (אייצ׳.טי.אם.אל)</strong> = השלד &mdash; מגדיר מה יש בדף (כותרות, טקסטים, תמונות, כפתורים). כמו הלבנים של בית. <strong>CSS (סי.אס.אס)</strong> = העיצוב &mdash; קובע איך הדף נראה (צבעים, גדלים, פונטים). כמו הצבע והטפט. <strong>JavaScript (ג׳אווה-סקריפט)</strong> = המוח &mdash; מפעיל דברים (מה קורה כשלוחצים כפתור, אנימציות). כמו החשמל של הבית.</li><li><strong>מה זה שרת (Server)? איך אתר עובד?</strong> כשאת כותבת כתובת אתר בדפדפן (Browser &mdash; תוכנת גלישה כמו Chrome), המחשב שלך (<strong>Client &mdash; לקוח</strong>) שולח בקשה ל<strong>Server (שרת)</strong> &mdash; מחשב חזק שיושב במרכז נתונים (Data Center) ומחזיק את קבצי האתר. השרת שולח חזרה את הקבצים והדפדפן מציג אותם. <strong>Domain (דומיין)</strong> = הכתובת הקריאה (כמו google.com). <strong>Hosting (אחסון)</strong> = השרת שמאחסן את הקבצים. כרגע בונים <strong>מקומית (Locally)</strong> &mdash; הקובץ נמצא רק על המחשב שלך. בשיעור 7 נעלה אותו לאינטרנט!</li><li><strong>בנייה עם AI &mdash; הפרומפט הראשון:</strong> בשיחה חדשה, צרפי את הלוגו ואת האפיון של הפרויקט (כפתור ה-+), ואז כתבי Prompt (פרומפט &mdash; הוראה) מפורט. אפשר בעברית! לדוגמה: <code>&quot;תבנה לי דף נחיתה (Landing Page) לסטארטאפ שלי עם כותרת מושכת, חלק אודות, 3 כרטיסיות של פיצ׳רים, חוות דעת, וטופס יצירת קשר. עיצוב מודרני, צבעים כחול וסגול, עברית RTL&quot;</code> &mdash; ככל שהפרומפט מפורט יותר, התוצאה טובה יותר!</li><li><strong>תצוגה מקדימה (Preview):</strong> הארטיפקט מציג את האתר שלך ממש ליד השיחה. כדי לשמור אותו, מורידים את הקובץ ושומרים אותו בשם <code>index.html</code> בתיקייה <code>my-project</code>, ואז לחיצה כפולה פותחת אותו ב-Chrome. אחרי שנפעיל ב-Claude Desktop גישה לקבצים (Connector לתיקיית הפרויקט), Claude ישמור ויערוך את <code>index.html</code> בתיקייה בעצמו &mdash; אחרי כל שינוי חוזרים ל-Chrome ולוחצים רענון (Refresh &mdash; F5). בדקי: האם הטקסט קריא? הצבעים נכונים? הכפתורים במקום?</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">HTML &mdash; שלד האתר</span><span class=\"concept-tag\">CSS &mdash; עיצוב</span><span class=\"concept-tag\">JavaScript &mdash; הפעלה</span><span class=\"concept-tag\">Server &mdash; שרת</span><span class=\"concept-tag\">Domain &mdash; דומיין</span><span class=\"concept-tag\">Landing Page &mdash; דף נחיתה</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>אילו חלקים צריכים להיות בדף הנחיתה שלך? &bull; אילו צבעים מייצגים את המותג שלך? &bull; מה ההבדל בין אתר שנמצא רק על המחשב שלך לבין אתר שחי באינטרנט?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (25 דקות)</div><p><strong>בונים דף נחיתה (Landing Page)!</strong> את פותחת את Claude Desktop, מתחילה שיחה חדשה ב-Project של הסטארטאפ, וכותבת פרומפט (Prompt) מפורט למוצר שלך. התוצאה: אתר שלם עם כותרת, תיאור, פיצ׳רים (Features &mdash; יכולות) וכפתור! כמה יפה תצליחי להפוך אותו?</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. <strong>שפרי את דף הנחיתה</strong> &mdash; הוסיפי את הלוגו (Logo) שיצרת בשיעור 2! צרפי אותו ב-Claude Desktop ובקשי: &quot;תוסיף את הלוגו שלי לראש הדף&quot;</p><p>2. <strong>בדיקת מובייל (Mobile):</strong> בדקי איך האתר נראה בטלפון &mdash; ב-Chrome: קליק ימני &larr; Inspect (בדיקה) &larr; לחיצה על אייקון הטלפון. לא נראה טוב? בקשי מ-Claude: &quot;תעשה את האתר רספונסיבי (Responsive &mdash; מתאים לכל מסך)&quot;</p><p>3. הוסיפי עוד Section (מקטע) &mdash; למשל: About (אודות), Features (יכולות), או FAQ (שאלות נפוצות)</p><div class=\"hw-connection\">בשיעור הבא נשדרג את האתר עם Animation (אנימציה), טפסים (Forms) ותפריט ניווט (Navigation)!</div></div>"}, {"title": "בונים אתר — חלק 2", "subtitle": "פיתוח", "goal": "לשדרג את האתר עם אנימציות, רספונסיביות למובייל, טפסים ופיצ'רים מתקדמים", "html": "<div class=\"session-recap\"><div class=\"recap-label\">בשיעור הקודם</div><p>בנינו את דף הנחיתה הראשון שלך! &bull; <strong>בדיקת משימת בית:</strong> הוספת את הלוגו? בדקת בתצוגת הטלפון? הראי למאיר את האתר שלך!</p></div><ul class=\"content-list\"><li><strong>Animation (אנימציה) &mdash; מה זה ולמה זה חשוב:</strong> אנימציות גורמות לאתר להרגיש מקצועי ו&quot;חי&quot;. סוגים: (1) <strong>Hover (ריחוף)</strong> &mdash; כפתור משנה צבע כשמרחפים עליו עם העכבר. (2) <strong>Fade-in (הופעה עדינה)</strong> &mdash; אלמנטים נכנסים בעדינות כשגוללים למטה. (3) <strong>Slide (החלקה)</strong> &mdash; תמונות או טקסטים נכנסים מהצד. דוגמת פרומפט ל-Claude: &quot;תוסיף אנימציות חלקות כשהמקטעים מופיעים בגלילה, ואפקט ריחוף על כפתורים&quot;</li><li><strong>Responsive Design (עיצוב רספונסיבי) &mdash; האתר חייב לעבוד בטלפון!</strong> יותר מ-60% מהגולשים גולשים מהטלפון! <strong>רספונסיבי</strong> = האתר משתנה אוטומטית בהתאם לגודל המסך. במחשב: 3 עמודות זו ליד זו. בטלפון: עמודה אחת, כפתורים גדולים יותר, טקסט קריא. דוגמת פרומפט: &quot;תעשה את האתר רספונסיבי &mdash; שיעבוד גם בטלפון עם עמודה אחת וכפתורים גדולים&quot;</li><li><strong>Navigation (ניווט) מקצועי:</strong> כל אתר רציני צריך Header (כותרת עליונה) קבוע למעלה עם: Logo (לוגו), Links (קישורים) לחלקי האתר (אודות, יכולות, צור קשר), וכפתור CTA (Call To Action &mdash; קריאה לפעולה) בולט. במובייל &mdash; תפריט Hamburger Menu (&quot;המבורגר&quot; &mdash; 3 פסים) שנפתח בלחיצה. דוגמת פרומפט: &quot;תוסיף תפריט ניווט קבוע למעלה עם לוגו, קישורים, ותפריט המבורגר במובייל&quot;</li><li><strong>Form (טופס):</strong> טופס &quot;צור קשר&quot; הוא חובה בכל אתר עסקי. שדות (Fields): שם, אימייל (Email), הודעה (Message). הוסיפי Validation (ולידציה &mdash; בדיקה שהשדות מלאים ושהאימייל תקין). דוגמת פרומפט: &quot;תוסיף טופס יצירת קשר עם שם, אימייל והודעה, עם בדיקת תקינות וכפתור שליחה מעוצב&quot;</li><li><strong>עובדים חכם עם Claude:</strong> מבקשים שינוי אחד בכל פעם, ובודקים את התוצאה בארטיפקט או ב-Chrome. משהו נשבר? ספרי ל-Claude בדיוק מה את רואה (או צרפי צילום מסך) ובקשי שיתקן &mdash; או שיחזור לגרסה הקודמת. שמרי את כל העבודה על האתר באותו Project, כדי ש-Claude יזכור את העיצוב והקבצים שלך</li><li><strong>השלב הבא &mdash; האתר עולה לאוויר:</strong> עד עכשיו האתר חי רק על המחשב שלך (Locally &mdash; מקומית). כדי שכל העולם יוכל לראות אותו, צריך <strong>Deploy (להעלות אותו לשרת)</strong>. זה בדיוק מה שנעשה בשיעור הבא: Claude Desktop יתחבר ל-GitHub דרך Connectors (מחברים), ותקבלי לינק ציבורי אמיתי. המשימה של היום היא להכין את האתר: שייראה טוב, יעבוד בטלפון, וכל מה שלוחצים עליו באמת יעבוד</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Animation &mdash; אנימציה</span><span class=\"concept-tag\">Responsive &mdash; רספונסיבי</span><span class=\"concept-tag\">Navigation &mdash; ניווט</span><span class=\"concept-tag\">Form &mdash; טופס</span><span class=\"concept-tag\">Iteration &mdash; שינוי אחד בכל פעם</span><span class=\"concept-tag\">Deploy &mdash; בשיעור הבא</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>בדקי את האתר שלך בתצוגת הטלפון &mdash; מה צריך להשתנות? &bull; איזו אנימציה תגרום לאתר שלך להרגיש מקצועי?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (25 דקות)</div><p><strong>שדרוג האתר!</strong> הוסיפי לאתר שלך לפחות 3 דברים בעזרת Claude Desktop, בקשה אחת בכל פעם: (1) Form (טופס) יצירת קשר, (2) Animation (אנימציה) אחת לפחות, (3) Navigation (תפריט ניווט) עם לוגו וקישורים. כמה מקצועי תצליחי להפוך אותו?</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. <strong>בדיקת מובייל (Mobile):</strong> בדקי את האתר בתצוגת הטלפון של Chrome (קליק ימני &larr; Inspect &larr; אייקון הטלפון). בקשי מ-Claude לתקן כל מה שלא מתאים.</p><p>2. <strong>User Testing (בדיקת משתמשים):</strong> הראי את האתר ל-3 אנשים (משפחה או חברים) ובקשי Feedback (פידבק &mdash; משוב): מה אהבו? מה לא היה ברור? מה היו משנים? רשמי את התשובות.</p><p>3. חשבי: איך הסטארטאפ שלך ירוויח כסף? Subscription (מנוי חודשי)? Freemium (חינם + פרימיום)? E-commerce (חנות)?</p><div class=\"hw-connection\">בשיעור הבא האתר שלך עולה לאוויר &mdash; עם לינק אמיתי שאפשר לשתף!</div></div>"}, {"title": "מעלים את האתר לאוויר", "subtitle": "השקה", "goal": "להעלות את האתר לאינטרנט עם Claude Desktop ו-Connectors, לקבל לינק ציבורי אמיתי, ולהבין איך דומיינים עובדים", "html": "<div class=\"session-recap\"><div class=\"recap-label\">במפגש הקודם</div><p>שדרגנו את האתר עם אנימציות, טופס ותפריט ניווט! &bull; <strong>בדיקת משימת בית:</strong> בדקת בטלפון? קיבלת פידבק? חשבת איך הסטארטאפ שלך ירוויח כסף? היום האתר עולה לאוויר.</p></div><ul class=\"content-list\"><li><strong>מה זה שרת?</strong> שרת (Server) הוא מחשב שדולק תמיד ומחובר לאינטרנט. התפקיד שלו הוא &quot;להגיש&quot; את האתר לכל מי שמבקש. <strong>אחסון (Hosting)</strong> = שוכרים מקום על מחשב כזה. כרגע האתר שלך חי רק במחשב שלך &mdash; כמו עוגה במטבח שרק המשפחה יכולה לטעום. אחסון שם אותה בחלון ראווה של מאפייה ברחוב סואן, פתוח יומם ולילה</li><li><strong>Connectors (מחברים) ב-Claude Desktop:</strong> מחבר מאפשר ל-Claude לעבוד ישירות עם החשבונות האחרים שלך &mdash; למשל ליצור בשבילך מאגר ב-GitHub. איפה מוצאים: <strong>Claude Desktop &larr; Settings &larr; Connectors</strong>. כל חיבור מבקש את האישור שלך: קוראים מה הוא רוצה לעשות, ואז מאשרים. השליטה אצלך &mdash; Claude מסביר לפני שהוא פועל, ואפשר לנתק בכל רגע</li><li><strong>GitHub &mdash; הבית של האתר בענן:</strong> (1) פותחים חשבון חינמי ב-<code>github.com</code> יחד עם הורה. (2) ב-Claude Desktop: Settings &larr; Connectors &larr; GitHub &larr; Connect &larr; מתחברים &larr; Approve. (3) מצרפים לצ׳אט את קבצי האתר ומבקשים מ-Claude: &quot;צור מאגר חדש בשם my-startup-site והעלה אליו את קבצי האתר שלי&quot;. <strong>Repository (מאגר)</strong> = תיקייה בענן ששומרת כל גרסה של הקבצים שלך</li><li><strong>Supabase (רק אם צריך):</strong> אם האתר שומר מידע &mdash; הרשמות, הודעות מטופס &mdash; הוא צריך מסד נתונים. מחברים את Supabase באותה דרך (Settings &larr; Connectors &larr; Supabase), ו-Claude יכול ליצור טבלה, להראות לך את הנתונים ולהסביר אותם. אתר שרק מציג מידע לא צריך את זה</li><li><strong>Deploy (העלאה) עם Railway:</strong> Railway קורא את המאגר שלך ב-GitHub והופך אותו לאתר חי. שלבים: <code>railway.com</code> &larr; Login with GitHub &larr; New Project &larr; Deploy from GitHub repo &larr; בוחרים את המאגר &larr; Settings &larr; Networking &larr; Generate Domain. מקבלים כתובת אמיתית כמו <code>my-startup-site.up.railway.app</code>. מעכשיו כל שינוי ש-Claude מעלה ל-GitHub מעדכן את האתר לבד. <strong>האפשרות החינמית הפשוטה ביותר:</strong> אם האתר הוא רק HTML, CSS ו-JS, אפשר לארח אותו גם ב-GitHub Pages (בהגדרות המאגר &larr; Pages)</li><li><strong>דומיין (Domain) &mdash; שם משלך:</strong> במקום כתובת ארוכה, שם כמו <code>mystartup.com</code>. איך בוחרים: קצר, קל להגייה ולאיות, בלי מקפים אם אפשר. <code>.com</code> לכל העולם, <code>.co.il</code> לישראל. איפה קונים: Namecheap או Cloudflare ל-<code>.com</code>, רשם דומיינים ישראלי ל-<code>.co.il</code>. דומיין <code>.com</code> עולה בדרך כלל בערך 10&ndash;15 דולר לשנה. את הקנייה עושים יחד עם הורה. טיפ: לבדוק את מחיר החידוש ולוותר על תוספות שלא צריך</li><li><strong>מחברים את הדומיין:</strong> <strong>DNS</strong> = ספר הטלפונים של האינטרנט &mdash; הוא אומר לעולם לאיזה שרת השם שלך מפנה. ב-Railway: Settings &larr; Networking &larr; Custom Domain &larr; מקלידים את הדומיין, ו-Railway מציג רשומת DNS. באתר שבו קנית את הדומיין: הגדרות DNS &larr; מוסיפים את הרשומה בדיוק. זה יכול לקחת מכמה דקות ועד 24&ndash;48 שעות. Railway מוסיף את <strong>המנעול של HTTPS</strong> (תעודת אבטחה חינמית) אוטומטית. נתקעת? שלחי ל-Claude צילום מסך ושאלי מה להקליד</li><li><strong>מהירות ורשימת השקה:</strong> פתחי את <code>pagespeed.web.dev</code>, הדביקי את הלינק ובדקי את הציון במובייל. איטי? בקשי מ-Claude לדחוס את התמונות ולגרום לאתר להיטען מהר יותר. לפני ששולחים: נראה טוב בטלפון ובמחשב &bull; כל כפתור וקישור עובדים &bull; כותרת לדף ואייקון בלשונית &bull; הטופס נשלח &bull; מנעול בשורת הכתובת &bull; בלי שגיאות כתיב</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Server &mdash; שרת</span><span class=\"concept-tag\">Hosting &mdash; אחסון</span><span class=\"concept-tag\">Connector &mdash; מחבר</span><span class=\"concept-tag\">Repository &mdash; מאגר</span><span class=\"concept-tag\">Deploy &mdash; העלאה</span><span class=\"concept-tag\">Domain &mdash; דומיין</span><span class=\"concept-tag\">DNS &mdash; ספר הכתובות</span><span class=\"concept-tag\">HTTPS &mdash; המנעול</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לדיון</div><p>אם היית יכולה לבחור כל דומיין לסטארטאפ שלך, מה הוא היה? &bull; מה גולש צריך להבין ב-5 השניות הראשונות אחרי שהוא פותח את הלינק שלך?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">תרגול משותף (25 דקות)</div><p><strong>מעלות לאוויר!</strong> (1) מחברים את GitHub ב-Claude Desktop &larr; Settings &larr; Connectors. (2) מבקשים מ-Claude ליצור מאגר ולהעלות את האתר. (3) Deploy ב-Railway ויצירת כתובת ציבורית. (4) פותחים את הלינק החי בטלפון ועוברים על רשימת ההשקה.</p></div><div class=\"session-homework\"><div class=\"homework-label\">אתגר בית</div><p>1. <strong>שלחי את הלינק החי למאיר</strong> בוואטסאפ.</p><p>2. <strong>משוב מ-3 אנשים:</strong> שלחי את הלינק ל-3 בני משפחה או חברים ושאלי: מה הבנת תוך 5 שניות? מה אהבת? מה היית משנה? רשמי את התשובות.</p><p>3. <strong>שפרי דבר או שניים</strong> מהמשוב &mdash; בקשי מ-Claude לבצע את השינויים, והאתר מתעדכן לבד.</p><p>4. <strong>התחילי את מצגת הפיץ׳ (Pitch Deck):</strong> 5 שקפים &mdash; הבעיה, הפתרון, הדגמה (הלינק החי!), מודל עסקי וסיכום. תתאמני על הפיץ׳ פעם אחת בקול.</p><p>5. <strong>דומיין (לא חובה, עם הורה):</strong> חפשי שם שמוצא חן בעינייך. אם תקנו, נחבר אותו ביחד.</p><div class=\"hw-connection\">במפגש הבא &mdash; יום הפיץ׳ (Pitch Day)! הלינק החי יהיה כוכב ההדגמה, והמשוב שאספת יחזק את הפיץ׳ שלך.</div></div>"}, {"title": "יום הפיץ'", "subtitle": "הצגה", "goal": "להציג את הפרויקט שלך — 3 דקות: בעיה, פתרון, דמו חי!", "html": "<div class=\"session-recap\"><div class=\"recap-label\">בשיעור הקודם</div><p>העלינו את האתר שלך לאוויר: חיברנו את GitHub ב-Claude Desktop דרך Connectors, העלינו ל-Railway, קיבלנו לינק ציבורי ועברנו על רשימת הבדיקות לפני השקה. &bull; <strong>בדיקת משימת בית:</strong> שלחת למאיר את הלינק החי? מה אמרו 3 האנשים &mdash; ומה שיפרת? הראי למאיר את טיוטת מצגת הפיץ׳ (Pitch Deck) &mdash; בואי נראה!</p></div><ul class=\"content-list\"><li><strong>מבנה ה-Pitch (פיץ׳ &mdash; הצגה, 3 דקות):</strong> Hook (פתיח מושך &mdash; 10 שניות) &mdash; עובדה מפתיעה או שאלה. Problem (הבעיה &mdash; 30 שניות). Solution (הפתרון &mdash; 30 שניות). Live Demo (הדגמה חיה &mdash; 90 שניות) &mdash; הראי את המוצר עם הלינק החי שלך! Business Model (מודל עסקי &mdash; 20 שניות). CTA / Call To Action (קריאה לפעולה &mdash; 10 שניות)</li><li><strong>Tips (טיפים) להצגה מעולה:</strong> דברי לאט וברור. הסתכלי אל הקהל או אל המצלמה. תתלהבי &mdash; אם את לא מתלהבת, גם הקהל לא יתלהב! Practice (תרגול) &mdash; תתאמני לפחות פעמיים. זה בסדר לטעות &mdash; פשוט תמשיכי</li><li><strong>Slide Design (עיצוב שקפים):</strong> טקסט גדול, מעט מילים בכל Slide (שקף), השתמשי בתמונות, צבעים עקביים, והלוגו שלך</li><li><strong>Live Demo (הדגמה חיה):</strong> הכיני Plan B (תוכנית ב׳) למקרה שמשהו נשבר (למשל צילומי מסך של האתר). הראי קודם את ה-Feature (יכולת) הכי מרשימה. שמרי על פשטות!</li><li><strong>חגיגה!</strong> כל פרויקט הוא הישג! למדת AI ו-Entrepreneurship (יזמות), ובנית מוצר אמיתי שחי באינטרנט. זה יותר ממה שרוב המבוגרים יודעים לעשות!</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Pitch &mdash; הצגה</span><span class=\"concept-tag\">Hook &mdash; פתיח מושך</span><span class=\"concept-tag\">Demo &mdash; הדגמה חיה</span><span class=\"concept-tag\">CTA &mdash; קריאה לפעולה</span></div><div class=\"session-discussion\"><div class=\"disc-label\">שאלות לשיחה</div><p>מה הדבר הכי מרשים בפרויקט שלך? &bull; תתאמני על ה-Hook &mdash; 10 השניות הראשונות!</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">Pitch Day &mdash; יום הפיץ׳! (35 דקות)</div><p><strong>יום הפיץ׳!</strong> את מציגה למאיר Pitch (הצגה) של 3 דקות: Problem (הבעיה), Solution (הפתרון), Live Demo (הדגמה חיה של האתר)! אחר כך מקבלים Feedback (משוב) ממאיר &mdash; ואם תרצי, אפשר להזמין גם את המשפחה לצפות. זה יהיה ה-Best Pitch (הפיץ׳ הטוב ביותר) שלך?</p></div><div class=\"session-homework\"><div class=\"homework-label\">Congratulations &mdash; מזל טוב!</div><p>סיימת את הקורס! יש לך אתר אמיתי (Live Website) באינטרנט, Business Plan (תוכנית עסקית) לסטארטאפ, וכלי AI שתמיד ילוו אותך.</p><p><strong>אתגר לחיים:</strong> המשיכי לבנות, לשפר, ולנסות כלים חדשים. שתפי את האתר שלך עם חברים ומשפחה! העולם שייך ליזמים הצעירים!</p></div>"}]};

        '- שם המיזם: '+v(0)+'\n- הבעיה שאנחנו פותרים: '+v(1)+'\n- קהל היעד: '+v(2)+'\n- איך פותרים את זה היום (ולמה זה לא מספיק): '+v(3)+'\n- הפתרון שלנו: '+v(4)+'\n- היכולות המרכזיות: '+v(5)+'\n- איך נרוויח כסף: '+v(6)+'\n- הדבר הראשון שנבנה (MVP): '+v(7)+'\n- איך נגיע ללקוחות: '+v(8)+'\n- איך נראית הצלחה: '+v(9)+'\n- שפה וסגנון האתר: '+v(10)+'\n\n'+
        '# הוראות בנייה\nבני אתר נחיתה שלם למיזם, בקובץ index.html אחד:\n'+
        '1. שפה וסגנון: לפי מה שכתבתי בסעיף "שפה וסגנון האתר". אם האתר בעברית — כיוון RTL (dir="rtl").\n'+
        '2. הסקשנים: פתיח עם שם המיזם, משפט מכירה אחד וכפתור קריאה לפעולה גדול · הבעיה · הפתרון · היכולות ככרטיסים · איך זה עובד ב-3 צעדים · מחירים לפי המודל העסקי · טופס הרשמה או יצירת קשר (עיצובי בלבד, בלי שרת) · פוטר עם השורה "נבנה בקורס בינה מלאכותית ויזמות של AI Lab".\n'+
        '3. מותאם קודם כל למובייל ורספונסיבי מלא. בלי ספריות חיצוניות — כל ה-CSS בתוך הקובץ. נגיעות נעימות: אפקטי ריחוף, כרטיסים מעוגלים, פלטת צבעים שמתאימה לאופי המיזם.\n'+
        '4. השתמשי בתשובות מהאפיון כלשונן איפה שמתאים — זה המיזם שלי, שמרי על המילים שלי.\n'+
        '5. אחרי שתבני — הציעי לי שדרוג אחד שאוכל לבקש ממך בהמשך.';
    }
    return 'I\'m a student in AI Lab\'s private "AI & Entrepreneurship" course. I\'ve finished the brief for my startup idea — please build me a website based on it. If an important detail is missing, ask me before you build.\n\n'+
      '# Project brief — '+(ans(0)||"My project")+'\n'+
      '- Project name: '+v(0)+'\n- The problem we solve: '+v(1)+'\n- Target audience: '+v(2)+'\n- How people solve it today (and why that\'s not enough): '+v(3)+'\n- Our solution: '+v(4)+'\n- Main features: '+v(5)+'\n- How we\'ll make money: '+v(6)+'\n- First thing to build (MVP): '+v(7)+'\n- How we\'ll reach customers: '+v(8)+'\n- What success looks like: '+v(9)+'\n- Website language and look: '+v(10)+'\n\n'+
      '# Build instructions\nBuild a complete landing page for the project in a single index.html file:\n'+
      '1. Language and style: follow what I wrote under "Website language and look". If the site is in Hebrew, use right-to-left (dir="rtl").\n'+
      '2. Sections: a hero with the project name, one selling sentence and a big call-to-action button · the problem · our solution · the features as cards · how it works in 3 simple steps · pricing based on the business model · a sign-up or contact form (design only, no server) · a footer with the line "Built in the AI & Entrepreneurship course at AI Lab".\n'+
      '3. Mobile-first and fully responsive. No external libraries — all CSS inside the file. Add pleasant touches: hover effects, rounded cards, and a color palette that fits the project.\n'+
      '4. Use my answers word for word where it fits — it\'s my project, keep my words.\n'+
      '5. After you build it, suggest one upgrade I could ask you for next.';
  }
  function copyText(txt, okKey){
    var out = document.getElementById("wzCopied");
    function ok(){ if(out) out.textContent = t(okKey); }
    function fail(){
      var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.insetInlineStart = "0"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var done = false; try{ done = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      if(out) out.textContent = done ? t(okKey) : t("wzCopyFail");
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fail); else fail();
  }
  function renderProject(){
    var box = document.getElementById("wz"); if(!box) return;
    var Q = WZ[lang], n = Q.length, step = Math.min(proj.step, n);
    var back = lang === "he" ? "→ " : "← ", fwd = lang === "he" ? " ←" : " →";
    var pct = Math.round(step / n * 100);
    if(step < n){
      var q = Q[step];
      box.innerHTML = '<div class="wz-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="wz-step">'+esc(T[lang].wzStep(step+1, n))+'</div>'+
        '<h3 class="wz-q"><label for="wzArea">'+esc(q.q)+'</label></h3>'+
        '<p class="wz-hint">'+esc(q.h)+'</p>'+
        '<textarea class="wz-area" id="wzArea" placeholder="'+esc(q.ph)+'"></textarea>'+
        '<div class="wz-nav">'+
          '<button type="button" class="btn wz-ghost" data-wz="prev"'+(step===0?' disabled':'')+'>'+back+esc(t("wzPrev"))+'</button>'+
          '<span class="wz-saved" id="wzSaved">'+esc(t("wzSaved"))+'</span><span class="wz-grow"></span>'+
          '<button type="button" class="btn" data-wz="next">'+esc(step === n-1 ? t("wzFinish") : t("wzNext"))+(step === n-1 ? '' : fwd)+'</button>'+
        '</div>';
      var area = document.getElementById("wzArea");
      area.value = proj.a[step] || "";
      area.addEventListener("input", function(){ proj.a[step] = area.value; projSave(true); });
    } else {
      var filled = 0, items = "";
      for(var i=0;i<n;i++){ if(ans(i)) filled++;
        items += '<button type="button" data-wz-edit="'+i+'"><b>'+esc(Q[i].q)+'</b><span class="'+(ans(i)?'':'empty')+'">'+esc(ans(i) || t("wzEmpty"))+'</span></button>'; }
      box.innerHTML = '<div class="wz-bar"><i style="width:100%"></i></div>'+
        '<h3 class="wz-q">'+esc(t("wzDoneTitle"))+'</h3>'+
        '<p class="wz-hint">'+esc(T[lang].wzDoneSub(filled, n))+'</p>'+
        '<div class="wz-sum">'+items+'</div>'+
        '<div class="wz-nav">'+
          '<button type="button" class="btn wz-ghost" data-wz="restart">'+esc(t("wzRestart"))+'</button><span class="wz-grow"></span>'+
          '<button type="button" class="btn wz-ghost" data-wz="brief">'+esc(t("wzCopyBrief"))+'</button>'+
          '<button type="button" class="btn" data-wz="prompt">'+esc(t("wzCopyPrompt"))+'</button>'+
        '</div><div class="wz-copied" id="wzCopied" aria-live="polite"></div>';
    }
  }
  document.getElementById("wz").addEventListener("click", function(e){
    var b = e.target.closest("[data-wz],[data-wz-edit]"); if(!b) return;
    var n = WZ[lang].length, act = b.getAttribute("data-wz");
    if(b.hasAttribute("data-wz-edit")){ proj.step = +b.getAttribute("data-wz-edit"); }
    else if(act === "prev"){ proj.step = Math.max(0, proj.step-1); }
    else if(act === "next"){ proj.step = Math.min(n, proj.step+1); }
    else if(act === "restart"){ proj.step = 0; }
    else if(act === "prompt"){ copyText(buildPrompt(), "wzCopiedPrompt"); return; }
    else if(act === "brief"){
      var Q = WZ[lang], lines = [lang === "he" ? "תיק הפרויקט שלי — AI Lab" : "My project brief — AI Lab", ""];
      for(var i=0;i<n;i++){ lines.push(Q[i].q); lines.push(ans(i) || "-"); lines.push(""); }
      copyText(lines.join("\n"), "wzCopiedBrief"); return;
    }
    projSave(false); renderProject();
    var a = document.getElementById("wzArea"); if(a) a.focus({preventScroll:true});
    document.getElementById("project").scrollIntoView({block:"start", behavior:"smooth"});
  });

  // ---------- init ----------
  applyLang();
  showPortal(sget(K_AUTH) === "1");
  setInterval(tick, 1000);
})();
</script>
