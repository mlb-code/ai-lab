\u05e8\u05d5\u05de\u05e4\u05d8 \u05e0\u05d5\u05ea\u05df \u05ea\u05d5\u05e6\u05d0\u05d5\u05ea \u05e9\u05d5\u05e0\u05d5\u05ea \u05d1\u05db\u05dc\u05d9\u05dd \u05e9\u05d5\u05e0\u05d9\u05dd? &bull; \u05de\u05d4 \u05d4\u05d4\u05d1\u05d3\u05dc \u05d1\u05d9\u05df \u05e4\u05e8\u05d5\u05de\u05e4\u05d8 \u05d8\u05d5\u05d1 \u05dc\u05e4\u05e8\u05d5\u05de\u05e4\u05d8 \u05e8\u05e2?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">\u05ea\u05e8\u05d2\u05d5\u05dc \u05db\u05d9\u05ea\u05d4 (15 \u05d3\u05e7\u05d5\u05ea)</div><p><strong>\u05d0\u05ea\u05d2\u05e8 \u05e4\u05e8\u05d5\u05de\u05e4\u05d8\u05d9\u05dd!</strong> \u05db\u05d5\u05dc\u05dd \u05de\u05e7\u05d1\u05dc\u05d9\u05dd \u05d0\u05ea \u05d0\u05d5\u05ea\u05d4 \u05de\u05e9\u05d9\u05de\u05d4: &quot;\u05d2\u05e8\u05de\u05d5 \u05dc-AI \u05dc\u05d9\u05e6\u05d5\u05e8 \u05dc\u05d5\u05d2\u05d5 (Logo &mdash; \u05e1\u05de\u05dc/\u05e1\u05d9\u05de\u05df \u05e9\u05dc \u05d7\u05d1\u05e8\u05d4) \u05dc\u05d7\u05e0\u05d5\u05ea \u05d2\u05dc\u05d9\u05d3\u05d4&quot;. \u05db\u05dc \u05d0\u05d7\u05d3 \u05db\u05d5\u05ea\u05d1 \u05e4\u05e8\u05d5\u05de\u05e4\u05d8 \u05e9\u05d5\u05e0\u05d4. \u05de\u05d9 \u05de\u05e7\u05d1\u05dc \u05d0\u05ea \u05d4\u05ea\u05d5\u05e6\u05d0\u05d4 \u05d4\u05db\u05d9 \u05d8\u05d5\u05d1\u05d4? \u05e0\u05e9\u05d5\u05d5\u05d4 \u05d5\u05e0\u05dc\u05de\u05d3 \u05de\u05d4\u05e4\u05e8\u05d5\u05de\u05e4\u05d8\u05d9\u05dd \u05e9\u05dc \u05db\u05d5\u05dc\u05dd!</p></div><div class=\"session-homework\"><div class=\"homework-label\">\u05d0\u05ea\u05d2\u05e8 \u05d1\u05d9\u05ea</div><p>1. \u05db\u05ea\u05d1\u05d5 <strong>5 \u05e4\u05e8\u05d5\u05de\u05e4\u05d8\u05d9\u05dd \u05e9\u05d5\u05e0\u05d9\u05dd</strong> \u05dc\u05d0\u05d5\u05ea\u05d4 \u05de\u05e9\u05d9\u05de\u05d4 &mdash; \u05e9\u05d9\u05de\u05d5 \u05dc\u05d1 \u05d0\u05d9\u05da \u05e9\u05d9\u05e0\u05d5\u05d9\u05d9\u05dd \u05e7\u05d8\u05e0\u05d9\u05dd \u05de\u05e9\u05e4\u05d9\u05e2\u05d9\u05dd \u05e2\u05dc \u05d4\u05ea\u05d5\u05e6\u05d0\u05d4. \u05ea\u05ea\u05e0\u05e1\u05d5 \u05d1\u05d8\u05db\u05e0\u05d9\u05e7\u05d5\u05ea \u05e9\u05dc\u05de\u05d3\u05e0\u05d5!</p><p>2. \u05e6\u05e8\u05d5 <strong>\u05dc\u05d5\u05d2\u05d5 (Logo)</strong> \u05dc\u05e4\u05e8\u05d5\u05d9\u05e7\u05d8 \u05e2\u05ea\u05d9\u05d3\u05d9 \u05e9\u05dc\u05db\u05dd \u05d1\u05d0\u05de\u05e6\u05e2\u05d5\u05ea DALL-E \u05d0\u05d5 \u05db\u05dc\u05d9 AI \u05dc\u05d9\u05e6\u05d9\u05e8\u05ea \u05ea\u05de\u05d5\u05e0\u05d5\u05ea. \u05e9\u05de\u05e8\u05d5 \u05d0\u05ea \u05d4\u05ea\u05d5\u05e6\u05d0\u05d4!</p><p>3. \u05d7\u05e9\u05d1\u05d5 \u05e2\u05dc <strong>3 \u05d1\u05e2\u05d9\u05d5\u05ea \u05de\u05d4\u05d7\u05d9\u05d9\u05dd \u05e9\u05dc\u05db\u05dd</strong> (\u05d1\u05d9\u05ea \u05e1\u05e4\u05e8 / \u05ea\u05d7\u05d1\u05d9\u05d1\u05d9\u05dd / \u05d7\u05d1\u05e8\u05d9\u05dd / \u05de\u05e9\u05e4\u05d7\u05d4) &mdash; \u05ea\u05d1\u05d9\u05d0\u05d5 \u05d0\u05d5\u05ea\u05df \u05de\u05d5\u05db\u05e0\u05d5\u05ea \u05dc\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0! \u05d0\u05dc\u05d4 \u05d9\u05d4\u05e4\u05db\u05d5 \u05dc\u05e8\u05e2\u05d9\u05d5\u05df \u05d4\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05e9\u05dc\u05db\u05dd.</p><div class=\"hw-connection\">\u05d4\u05dc\u05d5\u05d2\u05d5 \u05e9\u05ea\u05d9\u05e6\u05e8\u05d5 \u05d9\u05e9\u05de\u05e9 \u05d0\u05ea\u05db\u05dd \u05db\u05e9\u05e0\u05d1\u05e0\u05d4 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8! \u05d5\u05d4\u05d1\u05e2\u05d9\u05d5\u05ea &mdash; \u05d4\u05df \u05d4\u05d1\u05e1\u05d9\u05e1 \u05dc\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 (Startup &mdash; \u05d7\u05d1\u05e8\u05d4 \u05e6\u05e2\u05d9\u05e8\u05d4) \u05e9\u05dc\u05db\u05dd.</div></div>"}, {"title": "\u05d7\u05e9\u05d9\u05d1\u05d4 \u05d9\u05d6\u05de\u05d9\u05ea \u2014 \u05de\u05d5\u05e6\u05d0\u05d9\u05dd \u05d1\u05e2\u05d9\u05d5\u05ea", "subtitle": "\u05d9\u05d6\u05de\u05d5\u05ea", "goal": "\u05dc\u05dc\u05de\u05d5\u05d3 \u05dc\u05d7\u05e9\u05d5\u05d1 \u05db\u05de\u05d5 \u05d9\u05d6\u05de\u05d9\u05dd, \u05dc\u05d6\u05d4\u05d5\u05ea \u05d1\u05e2\u05d9\u05d5\u05ea \u05d0\u05de\u05d9\u05ea\u05d9\u05d5\u05ea \u05d5\u05dc\u05d4\u05d1\u05d9\u05df \u05d0\u05ea \u05d4\u05e0\u05d5\u05e1\u05d7\u05d4 \u05e9\u05dc \u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05de\u05e6\u05dc\u05d9\u05d7", "html": "<div class=\"session-recap\"><div class=\"recap-label\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd</div><p>\u05dc\u05de\u05d3\u05e0\u05d5 \u05dc\u05db\u05ea\u05d5\u05d1 \u05e4\u05e8\u05d5\u05de\u05e4\u05d8\u05d9\u05dd \u05de\u05d5\u05e9\u05dc\u05de\u05d9\u05dd \u05d5\u05d4\u05ea\u05e7\u05e0\u05d5 Cursor \u05d5-Claude Code. &bull; <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05d9\u05de\u05ea \u05d1\u05d9\u05ea:</strong> \u05de\u05d9 \u05d4\u05e6\u05dc\u05d9\u05d7 \u05dc\u05d9\u05e6\u05d5\u05e8 \u05dc\u05d5\u05d2\u05d5 \u05e2\u05dd AI? \u05de\u05d9 \u05e0\u05e8\u05e9\u05dd \u05dc-Claude Code? \u05d4\u05e8\u05d0\u05d5 \u05d0\u05ea \u05d4\u05ea\u05d5\u05e6\u05d0\u05d5\u05ea!</p></div><ul class=\"content-list\"><li><strong>\u05de\u05d4 \u05d6\u05d4 \u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4?</strong> \u05d7\u05d1\u05e8\u05d4 \u05e6\u05e2\u05d9\u05e8\u05d4 \u05e9\u05e4\u05d5\u05ea\u05e8\u05ea \u05d1\u05e2\u05d9\u05d4 \u05d0\u05de\u05d9\u05ea\u05d9\u05ea \u05d1\u05d3\u05e8\u05da \u05d7\u05d3\u05e9\u05d4 \u05d0\u05d5 \u05d8\u05d5\u05d1\u05d4 \u05d9\u05d5\u05ea\u05e8. \u05d4\u05d4\u05d1\u05d3\u05dc \u05de\u05e2\u05e1\u05e7 \u05e8\u05d2\u05d9\u05dc: \u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05e9\u05d5\u05d0\u05e3 \u05dc\u05e6\u05de\u05d5\u05d7 \u05de\u05d4\u05e8 \u05d5\u05dc\u05d4\u05d2\u05d9\u05e2 \u05dc\u05d4\u05e8\u05d1\u05d4 \u05d0\u05e0\u05e9\u05d9\u05dd</li><li><strong>\u05e1\u05d9\u05e4\u05d5\u05e8\u05d9 \u05d9\u05d6\u05de\u05d9\u05dd \u05d9\u05e9\u05e8\u05d0\u05dc\u05d9\u05d9\u05dd:</strong> Waze (\u05e4\u05ea\u05e8\u05d5 \u05d0\u05ea \u05d1\u05e2\u05d9\u05d9\u05ea \u05d4\u05e4\u05e7\u05e7\u05d9\u05dd), Wix (\u05d4\u05e7\u05dc\u05d5 \u05e2\u05dc \u05d1\u05e0\u05d9\u05d9\u05ea \u05d0\u05ea\u05e8\u05d9\u05dd), Monday (\u05e1\u05d9\u05d3\u05e8\u05d5 \u05db\u05d0\u05d5\u05e1 \u05d1\u05e0\u05d9\u05d4\u05d5\u05dc \u05e4\u05e8\u05d5\u05d9\u05e7\u05d8\u05d9\u05dd), Iron Dome (\u05d1\u05d9\u05d8\u05d7\u05d5\u05df). \u05d9\u05e9\u05e8\u05d0\u05dc = \"\u05d0\u05d5\u05de\u05ea \u05d4\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4\" &mdash; \u05d9\u05d5\u05ea\u05e8 \u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4\u05d9\u05dd \u05dc\u05e0\u05e4\u05e9 \u05de\u05db\u05dc \u05de\u05d3\u05d9\u05e0\u05d4!</li><li><strong>\u05d4\u05e0\u05d5\u05e1\u05d7\u05d4:</strong> \u05d1\u05e2\u05d9\u05d4 &#x2190; \u05e4\u05ea\u05e8\u05d5\u05df &#x2190; \u05de\u05d5\u05e6\u05e8 &#x2190; \u05e2\u05e1\u05e7. \u05d4\u05db\u05dc \u05de\u05ea\u05d7\u05d9\u05dc \u05de\u05d1\u05e2\u05d9\u05d4 \u05d0\u05de\u05d9\u05ea\u05d9\u05ea \u05e9\u05d0\u05e0\u05e9\u05d9\u05dd \u05e8\u05d5\u05e6\u05d9\u05dd \u05dc\u05e4\u05ea\u05d5\u05e8!</li><li><strong>Design Thinking (\u05d7\u05e9\u05d9\u05d1\u05d4 \u05e2\u05d9\u05e6\u05d5\u05d1\u05d9\u05ea):</strong> \u05e9\u05d9\u05d8\u05d4 \u05d1\u05ea 5 \u05e9\u05dc\u05d1\u05d9\u05dd &mdash; Empathize/\u05d4\u05d6\u05d3\u05d4\u05d5 (\u05d4\u05d1\u05d9\u05e0\u05d5 \u05d0\u05ea \u05d4\u05de\u05e9\u05ea\u05de\u05e9), Define/\u05d4\u05d2\u05d3\u05d9\u05e8\u05d5 (\u05de\u05d4 \u05d4\u05d1\u05e2\u05d9\u05d4 \u05d1\u05d3\u05d9\u05d5\u05e7), Ideate/\u05d7\u05e9\u05d1\u05d5 (\u05e1\u05d9\u05e2\u05d5\u05e8 \u05de\u05d5\u05d7\u05d5\u05ea), Prototype/\u05d1\u05e0\u05d5 (\u05d0\u05d1-\u05d8\u05d9\u05e4\u05d5\u05e1 \u05de\u05d4\u05d9\u05e8), Test/\u05d1\u05d3\u05e7\u05d5 (\u05e7\u05d1\u05dc\u05d5 \u05e4\u05d9\u05d3\u05d1\u05e7 &mdash; Feedback, \u05de\u05e9\u05d5\u05d1)</li><li><strong>\u05d0\u05d9\u05da \u05de\u05d5\u05e6\u05d0\u05d9\u05dd \u05d1\u05e2\u05d9\u05d5\u05ea \u05d8\u05d5\u05d1\u05d5\u05ea?</strong> \u05de\u05d4 \u05de\u05e2\u05e6\u05d1\u05df \u05d0\u05ea\u05db\u05dd \u05d1\u05d9\u05d5\u05de\u05d9\u05d5\u05dd? \u05e2\u05dc \u05de\u05d4 \u05d7\u05d1\u05e8\u05d9\u05dd \u05de\u05ea\u05dc\u05d5\u05e0\u05e0\u05d9\u05dd? \u05de\u05d4 \u05d4\u05d9\u05d9\u05ea\u05dd \u05e8\u05d5\u05e6\u05d9\u05dd \u05e9\u05d9\u05d4\u05d9\u05d4 \u05e7\u05dc \u05d9\u05d5\u05ea\u05e8? \u05d4\u05d1\u05e2\u05d9\u05d5\u05ea \u05d4\u05db\u05d9 \u05d8\u05d5\u05d1\u05d5\u05ea \u05d4\u05df \u05d0\u05dc\u05d4 \u05e9\u05d0\u05ea\u05dd \u05d7\u05d5\u05d5\u05d9\u05dd \u05d1\u05e2\u05e6\u05de\u05db\u05dd!</li><li><strong>\u05d1\u05e2\u05d9\u05d4 \u05d8\u05d5\u05d1\u05d4 vs \u05d1\u05e2\u05d9\u05d4 \u05e8\u05e2\u05d4:</strong> \u05d8\u05d5\u05d1\u05d4 = \u05d4\u05e8\u05d1\u05d4 \u05d0\u05e0\u05e9\u05d9\u05dd \u05d7\u05d5\u05d5\u05d9\u05dd \u05d0\u05d5\u05ea\u05d4, \u05de\u05d5\u05db\u05e0\u05d9\u05dd \u05dc\u05e9\u05dc\u05dd \u05e2\u05dc \u05e4\u05ea\u05e8\u05d5\u05df, \u05e1\u05e4\u05e6\u05d9\u05e4\u05d9\u05ea. \u05e8\u05e2\u05d4 = \u05e2\u05de\u05d5\u05de\u05d4 \u05de\u05d3\u05d9, \u05e8\u05e7 \u05d0\u05ea\u05dd \u05d7\u05d5\u05d5\u05d9\u05dd \u05d0\u05d5\u05ea\u05d4, \u05db\u05d1\u05e8 \u05e0\u05e4\u05ea\u05e8\u05d4 \u05dc\u05d2\u05de\u05e8\u05d9</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Startup &mdash; \u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4</span><span class=\"concept-tag\">Design Thinking &mdash; \u05d7\u05e9\u05d9\u05d1\u05d4 \u05e2\u05d9\u05e6\u05d5\u05d1\u05d9\u05ea</span><span class=\"concept-tag\">Validation &mdash; \u05d0\u05d9\u05de\u05d5\u05ea \u05d1\u05e2\u05d9\u05d4</span><span class=\"concept-tag\">Problem &rarr; Solution</span></div><div class=\"session-discussion\"><div class=\"disc-label\">\u05e9\u05d0\u05dc\u05d5\u05ea \u05dc\u05d3\u05d9\u05d5\u05df</div><p>\u05de\u05d4 \u05d4\u05d3\u05d1\u05e8 \u05e9\u05d4\u05db\u05d9 \u05de\u05e2\u05e6\u05d1\u05df \u05d0\u05ea\u05db\u05dd \u05d1\u05d1\u05d9\u05ea \u05d4\u05e1\u05e4\u05e8? &bull; \u05d0\u05d9\u05d6\u05d5 \u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d4 \u05d4\u05d9\u05d9\u05ea\u05dd \u05e8\u05d5\u05e6\u05d9\u05dd \u05e9\u05ea\u05d4\u05d9\u05d4 \u05e7\u05d9\u05d9\u05de\u05ea?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">\u05ea\u05e8\u05d2\u05d5\u05dc \u05db\u05d9\u05ea\u05d4 (15 \u05d3\u05e7\u05d5\u05ea)</div><p><strong>\u05e1\u05d9\u05e2\u05d5\u05e8 \u05de\u05d5\u05d7\u05d5\u05ea (Brainstorming):</strong> \u05db\u05dc \u05ea\u05dc\u05de\u05d9\u05d3 \u05de\u05d6\u05d4\u05d4 3 \u05d1\u05e2\u05d9\u05d5\u05ea \u05de\u05d4\u05d7\u05d9\u05d9\u05dd \u05e9\u05dc\u05d5 (\u05d1\u05d9\u05ea \u05e1\u05e4\u05e8, \u05ea\u05d7\u05d1\u05d9\u05d1\u05d9\u05dd, \u05d7\u05d1\u05e8\u05d9\u05dd, \u05de\u05e9\u05e4\u05d7\u05d4) \u05d5\u05de\u05e6\u05d9\u05d2 \u05dc\u05db\u05d9\u05ea\u05d4. \u05d0\u05d7\u05e8\u05d9 \u05d4\u05d4\u05e6\u05d2\u05d5\u05ea &mdash; \u05d4\u05db\u05d9\u05ea\u05d4 \u05de\u05e6\u05d1\u05d9\u05e2\u05d4: \u05d0\u05d9\u05d6\u05d5 \u05d1\u05e2\u05d9\u05d4 \u05d4\u05db\u05d9 \u05de\u05e2\u05e0\u05d9\u05d9\u05e0\u05ea \u05d5\u05e9\u05d5\u05d5\u05d4 \u05dc\u05e4\u05ea\u05d5\u05e8?</p></div><div class=\"session-homework\"><div class=\"homework-label\">\u05d0\u05ea\u05d2\u05e8 \u05d1\u05d9\u05ea</div><p>1. \u05d1\u05d7\u05e8\u05d5 \u05d0\u05ea <strong>\u05d4\u05d1\u05e2\u05d9\u05d4 \u05d4\u05db\u05d9 \u05d8\u05d5\u05d1\u05d4</strong> \u05de\u05ea\u05d5\u05da \u05d4-3 &mdash; \u05d6\u05d5 \u05e9\u05d0\u05ea\u05dd \u05d4\u05db\u05d9 \u05de\u05ea\u05dc\u05d4\u05d1\u05d9\u05dd \u05de\u05de\u05e0\u05d4.</p><p>2. \u05e2\u05e9\u05d5 <strong>Validation (\u05d0\u05d9\u05de\u05d5\u05ea)</strong>: \u05e9\u05d0\u05dc\u05d5 5 \u05d0\u05e0\u05e9\u05d9\u05dd (\u05d7\u05d1\u05e8\u05d9\u05dd, \u05de\u05e9\u05e4\u05d7\u05d4) \u05d0\u05dd \u05d2\u05dd \u05d4\u05dd \u05d7\u05d5\u05d5\u05d9\u05dd \u05d0\u05ea \u05d4\u05d1\u05e2\u05d9\u05d4. \u05e8\u05e9\u05de\u05d5 \u05d0\u05ea \u05d4\u05ea\u05e9\u05d5\u05d1\u05d5\u05ea!</p><p>3. <strong>\u05de\u05d7\u05e7\u05e8 \u05de\u05ea\u05d7\u05e8\u05d9\u05dd (Competitors):</strong> \u05d7\u05e4\u05e9\u05d5 \u05d1\u05d2\u05d5\u05d2\u05dc &mdash; \u05d4\u05d0\u05dd \u05db\u05d1\u05e8 \u05e7\u05d9\u05d9\u05dd \u05e4\u05ea\u05e8\u05d5\u05df \u05dc\u05d1\u05e2\u05d9\u05d4? \u05de\u05d4 \u05d4\u05d5\u05d0 \u05e2\u05d5\u05e9\u05d4 \u05d8\u05d5\u05d1 \u05d5\u05de\u05d4 \u05d7\u05e1\u05e8 \u05d1\u05d5?</p><div class=\"hw-connection\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0 \u05e0\u05d4\u05e4\u05d5\u05da \u05d0\u05ea \u05d4\u05d1\u05e2\u05d9\u05d4 \u05dc\u05de\u05d5\u05e6\u05e8 \u05d0\u05de\u05d9\u05ea\u05d9 \u05e2\u05dd \u05d4\u05e6\u05e2\u05ea \u05e2\u05e8\u05da (Value Proposition) \u05d5\u05ea\u05d5\u05db\u05e0\u05d9\u05ea! \u05ea\u05d1\u05d9\u05d0\u05d5 \u05d0\u05ea \u05d4\u05de\u05d7\u05e7\u05e8 \u05e9\u05dc\u05db\u05dd.</div></div>"}, {"title": "\u05de\u05e8\u05e2\u05d9\u05d5\u05df \u05dc\u05de\u05d5\u05e6\u05e8", "subtitle": "\u05d0\u05e1\u05d8\u05e8\u05d8\u05d2\u05d9\u05d4", "goal": "\u05dc\u05d1\u05d7\u05d5\u05e8 \u05d0\u05ea \u05d4\u05e8\u05e2\u05d9\u05d5\u05df \u05d4\u05d8\u05d5\u05d1 \u05d1\u05d9\u05d5\u05ea\u05e8, \u05dc\u05d4\u05d2\u05d3\u05d9\u05e8 \u05e7\u05d4\u05dc \u05d9\u05e2\u05d3, \u05dc\u05d1\u05e0\u05d5\u05ea \u05d4\u05e6\u05e2\u05ea \u05e2\u05e8\u05da \u05d5\u05dc\u05ea\u05db\u05e0\u05df MVP", "html": "<div class=\"session-recap\"><div class=\"recap-label\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd</div><p>\u05dc\u05de\u05d3\u05e0\u05d5 \u05d7\u05e9\u05d9\u05d1\u05d4 \u05d9\u05d6\u05de\u05d9\u05ea \u05d5\u05de\u05e6\u05d0\u05e0\u05d5 3 \u05d1\u05e2\u05d9\u05d5\u05ea \u05de\u05d4\u05d7\u05d9\u05d9\u05dd \u05e9\u05dc\u05e0\u05d5. &bull; <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05d9\u05de\u05ea \u05d1\u05d9\u05ea:</strong> \u05de\u05d9 \u05d1\u05d7\u05e8 \u05d0\u05ea \u05d4\u05d1\u05e2\u05d9\u05d4 \u05d4\u05d8\u05d5\u05d1\u05d4 \u05d1\u05d9\u05d5\u05ea\u05e8? \u05de\u05d9 \u05e9\u05d0\u05dc 5 \u05d0\u05e0\u05e9\u05d9\u05dd? \u05de\u05d4 \u05d4\u05de\u05ea\u05d7\u05e8\u05d9\u05dd \u05e9\u05de\u05e6\u05d0\u05ea\u05dd?</p></div><ul class=\"content-list\"><li><strong>\u05d1\u05d7\u05d9\u05e8\u05ea \u05d4\u05e8\u05e2\u05d9\u05d5\u05df:</strong> \u05de\u05ea\u05d5\u05da 3 \u05d4\u05d1\u05e2\u05d9\u05d5\u05ea \u05de\u05d4\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd, \u05d1\u05d5\u05d7\u05e8\u05d9\u05dd \u05d0\u05ea \u05d4\u05d8\u05d5\u05d1\u05d4 \u05d1\u05d9\u05d5\u05ea\u05e8. \u05d4\u05e7\u05e8\u05d9\u05d8\u05e8\u05d9\u05d5\u05e0\u05d9\u05dd: \u05d4\u05d0\u05dd \u05d4\u05d1\u05e2\u05d9\u05d4 \u05d0\u05de\u05d9\u05ea\u05d9\u05ea? \u05d4\u05d0\u05dd \u05d0\u05e0\u05d9 \u05de\u05d1\u05d9\u05df \u05d0\u05d5\u05ea\u05d4? \u05d4\u05d0\u05dd \u05d0\u05e4\u05e9\u05e8 \u05dc\u05d1\u05e0\u05d5\u05ea \u05e4\u05ea\u05e8\u05d5\u05df? \u05d4\u05d0\u05dd \u05d0\u05e0\u05e9\u05d9\u05dd \u05d9\u05e8\u05e6\u05d5 \u05dc\u05d4\u05e9\u05ea\u05de\u05e9?</li><li><strong>\u05e7\u05d4\u05dc \u05d9\u05e2\u05d3 (Target Audience):</strong> \u05de\u05d9 \u05d1\u05d3\u05d9\u05d5\u05e7 \u05e1\u05d5\u05d1\u05dc \u05de\u05d4\u05d1\u05e2\u05d9\u05d4? \u05dc\u05d0 &quot;\u05db\u05d5\u05dc\u05dd&quot; \u05d0\u05dc\u05d0 &quot;\u05ea\u05dc\u05de\u05d9\u05d3\u05d9 \u05ea\u05d9\u05db\u05d5\u05df \u05d1\u05d9\u05e9\u05e8\u05d0\u05dc \u05e9\u05de\u05ea\u05e7\u05e9\u05d9\u05dd \u05d1\u05de\u05ea\u05de\u05d8\u05d9\u05e7\u05d4&quot;. \u05d1\u05d5\u05e0\u05d9\u05dd Persona (\u05e4\u05e8\u05e1\u05d5\u05e0\u05d4 &mdash; \u05d3\u05de\u05d5\u05ea \u05d1\u05d3\u05d9\u05d5\u05e0\u05d9\u05ea) \u05e9\u05de\u05d9\u05d9\u05e6\u05d2\u05ea \u05d0\u05ea \u05d4\u05de\u05e9\u05ea\u05de\u05e9 \u05d4\u05d0\u05d9\u05d3\u05d9\u05d0\u05dc\u05d9</li><li><strong>\u05d4\u05e6\u05e2\u05ea \u05e2\u05e8\u05da (Value Proposition):</strong> \u05de\u05d4 \u05de\u05d9\u05d5\u05d7\u05d3 \u05d1\u05e4\u05ea\u05e8\u05d5\u05df \u05e9\u05dc\u05db\u05dd? \u05d4\u05e0\u05d5\u05e1\u05d7\u05d4: &quot;\u05d0\u05e0\u05d7\u05e0\u05d5 \u05e2\u05d5\u05d6\u05e8\u05d9\u05dd \u05dc-[\u05e7\u05d4\u05dc] \u05dc\u05e4\u05ea\u05d5\u05e8 \u05d0\u05ea [\u05d4\u05d1\u05e2\u05d9\u05d4] \u05e2\u05dc \u05d9\u05d3\u05d9 [\u05d4\u05e4\u05ea\u05e8\u05d5\u05df], \u05d1\u05e0\u05d9\u05d2\u05d5\u05d3 \u05dc-[\u05de\u05ea\u05d7\u05e8\u05d9\u05dd (Competitors)] \u05d0\u05e0\u05d7\u05e0\u05d5 [\u05d9\u05ea\u05e8\u05d5\u05df \u05d9\u05d9\u05d7\u05d5\u05d3\u05d9]&quot;</li><li><strong>\u05e0\u05d9\u05ea\u05d5\u05d7 \u05de\u05ea\u05d7\u05e8\u05d9\u05dd:</strong> \u05de\u05d4 \u05db\u05d1\u05e8 \u05e7\u05d9\u05d9\u05dd? \u05d7\u05e4\u05e9\u05d5 \u05d1\u05d2\u05d5\u05d2\u05dc, \u05d4\u05d5\u05e8\u05d9\u05d3\u05d5 \u05d0\u05e4\u05dc\u05d9\u05e7\u05e6\u05d9\u05d5\u05ea \u05d3\u05d5\u05de\u05d5\u05ea. \u05de\u05d4 \u05d8\u05d5\u05d1 \u05d1\u05d4\u05df? \u05de\u05d4 \u05d7\u05e1\u05e8? \u05d4\u05d4\u05d6\u05d3\u05de\u05e0\u05d5\u05ea \u05e9\u05dc\u05db\u05dd \u05e0\u05de\u05e6\u05d0\u05ea \u05d1\u05e4\u05e2\u05e8\u05d9\u05dd!</li><li><strong>MVP (Minimum Viable Product &mdash; \u05de\u05d5\u05e6\u05e8 \u05de\u05d9\u05e0\u05d9\u05de\u05dc\u05d9):</strong> \u05d4\u05d2\u05e8\u05e1\u05d4 \u05d4\u05db\u05d9 \u05e4\u05e9\u05d5\u05d8\u05d4 \u05e9\u05e2\u05d3\u05d9\u05d9\u05df \u05e9\u05d9\u05de\u05d5\u05e9\u05d9\u05ea. \u05dc\u05d0 \u05d4\u05de\u05d5\u05e6\u05e8 \u05d4\u05de\u05dc\u05d0, \u05e8\u05e7 \u05de\u05e1\u05e4\u05d9\u05e7 \u05db\u05d3\u05d9 \u05dc\u05d1\u05d3\u05d5\u05e7 \u05d0\u05dd \u05d0\u05e0\u05e9\u05d9\u05dd \u05e8\u05d5\u05e6\u05d9\u05dd \u05d0\u05ea \u05d6\u05d4</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Target Audience &mdash; \u05e7\u05d4\u05dc \u05d9\u05e2\u05d3</span><span class=\"concept-tag\">Value Proposition &mdash; \u05d4\u05e6\u05e2\u05ea \u05e2\u05e8\u05da</span><span class=\"concept-tag\">Competitors &mdash; \u05de\u05ea\u05d7\u05e8\u05d9\u05dd</span><span class=\"concept-tag\">MVP &mdash; \u05de\u05d5\u05e6\u05e8 \u05de\u05d9\u05e0\u05d9\u05de\u05dc\u05d9</span><span class=\"concept-tag\">Persona &mdash; \u05d3\u05de\u05d5\u05ea \u05de\u05e9\u05ea\u05de\u05e9</span></div><div class=\"session-discussion\"><div class=\"disc-label\">\u05e9\u05d0\u05dc\u05d5\u05ea \u05dc\u05d3\u05d9\u05d5\u05df</div><p>\u05de\u05d9 \u05d4\u05de\u05e9\u05ea\u05de\u05e9 \u05e9\u05dc\u05db\u05dd? \u05ea\u05d0\u05e8\u05d5 \u05d0\u05d5\u05ea\u05d5 \u05d1\u05e4\u05d9\u05e8\u05d5\u05d8. &bull; \u05de\u05d4 \u05d4\u05d3\u05d1\u05e8 \u05d4\u05d0\u05d7\u05d3 \u05e9\u05d4\u05de\u05d5\u05e6\u05e8 \u05e9\u05dc\u05db\u05dd \u05e2\u05d5\u05e9\u05d4 \u05d8\u05d5\u05d1 \u05d9\u05d5\u05ea\u05e8 \u05de\u05db\u05dc \u05d3\u05d1\u05e8 \u05d0\u05d7\u05e8?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">\u05ea\u05e8\u05d2\u05d5\u05dc \u05db\u05d9\u05ea\u05d4 (15 \u05d3\u05e7\u05d5\u05ea)</div><p><strong>\u05d1\u05d5\u05e0\u05d4 \u05d4\u05e4\u05e8\u05d5\u05d9\u05e7\u05d8 (Project Builder):</strong> \u05de\u05dc\u05d0\u05d5 \u05d0\u05ea 10 \u05d4\u05e9\u05d0\u05dc\u05d5\u05ea \u05d4\u05de\u05e0\u05d7\u05d5\u05ea \u05d1\u05d0\u05d6\u05d5\u05e8 \u05d4\u05d0\u05d9\u05e9\u05d9 &mdash; \u05e9\u05dd \u05d4\u05e4\u05e8\u05d5\u05d9\u05e7\u05d8, \u05d4\u05d1\u05e2\u05d9\u05d4, \u05d4\u05e4\u05ea\u05e8\u05d5\u05df, \u05e7\u05d4\u05dc \u05d4\u05d9\u05e2\u05d3 (Target Audience), \u05d5\u05d4\u05e6\u05e2\u05ea \u05d4\u05e2\u05e8\u05da (Value Proposition). \u05d6\u05d4 \u05d9\u05d4\u05e4\u05d5\u05da \u05dc\u05d0\u05e4\u05d9\u05d5\u05df (Spec &mdash; \u05de\u05e4\u05e8\u05d8) \u05d4\u05de\u05d5\u05e6\u05e8 \u05e9\u05dc\u05db\u05dd!</p></div><div class=\"session-homework\"><div class=\"homework-label\">\u05d0\u05ea\u05d2\u05e8 \u05d1\u05d9\u05ea</div><p>1. \u05d4\u05e9\u05dc\u05d9\u05de\u05d5 \u05d0\u05ea \u05db\u05dc 10 \u05d4\u05e9\u05d0\u05dc\u05d5\u05ea \u05d1&quot;\u05d1\u05d5\u05e0\u05d4 \u05d4\u05e4\u05e8\u05d5\u05d9\u05e7\u05d8&quot; &mdash; \u05d6\u05d4 \u05d4\u05d0\u05e4\u05d9\u05d5\u05df (Specification &mdash; \u05de\u05e4\u05e8\u05d8) \u05e9\u05dc\u05db\u05dd!</p><p>2. \u05d7\u05e9\u05d1\u05d5 \u05e2\u05dc <strong>\u05e2\u05d9\u05e6\u05d5\u05d1 (Design) \u05d4\u05d0\u05ea\u05e8:</strong> \u05d0\u05d9\u05dc\u05d5 \u05e6\u05d1\u05e2\u05d9\u05dd \u05de\u05ea\u05d0\u05d9\u05de\u05d9\u05dd \u05dc\u05de\u05d5\u05e6\u05e8 \u05e9\u05dc\u05db\u05dd? \u05d0\u05d9\u05dc\u05d5 \u05d7\u05dc\u05e7\u05d9\u05dd (Sections &mdash; \u05de\u05e7\u05d8\u05e2\u05d9\u05dd) \u05e6\u05e8\u05d9\u05db\u05d9\u05dd \u05dc\u05d4\u05d9\u05d5\u05ea \u05d1\u05d3\u05e3 \u05d4\u05e0\u05d7\u05d9\u05ea\u05d4 (Landing Page)?</p><p>3. \u05d4\u05db\u05d9\u05e0\u05d5 \u05d0\u05ea \u05d4\u05dc\u05d5\u05d2\u05d5 \u05e9\u05d9\u05e6\u05e8\u05ea\u05dd \u05d1\u05de\u05e4\u05d2\u05e9 2 &mdash; \u05d4\u05d5\u05d0 \u05d9\u05e9\u05de\u05e9 \u05d0\u05ea\u05db\u05dd \u05d1\u05d1\u05e0\u05d9\u05d9\u05d4!</p><div class=\"hw-connection\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0 \u05e0\u05ea\u05d7\u05d9\u05dc \u05dc\u05d1\u05e0\u05d5\u05ea \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05d1\u05d0\u05de\u05ea \u05e2\u05dd Cursor! \u05d5\u05d3\u05d0\u05d5 \u05e9-Cursor \u05de\u05d5\u05ea\u05e7\u05df \u05d5\u05e2\u05d5\u05d1\u05d3.</div></div>"}, {"title": "\u05d1\u05d5\u05e0\u05d9\u05dd \u05d0\u05ea\u05e8 \u2014 \u05d7\u05dc\u05e7 1", "subtitle": "\u05d1\u05e0\u05d9\u05d9\u05d4", "goal": "\u05d4\u05d1\u05e0\u05ea \u05de\u05d1\u05e0\u05d4 \u05d0\u05ea\u05e8 (HTML/CSS/JS), \u05d4\u05db\u05e8\u05ea \u05e9\u05e8\u05ea\u05d9\u05dd \u05d5\u05d3\u05d5\u05de\u05d9\u05d9\u05e0\u05d9\u05dd, \u05d5\u05d1\u05e0\u05d9\u05d9\u05d4 \u05e8\u05d0\u05e9\u05d5\u05e0\u05d4 \u05e9\u05dc \u05d3\u05e3 \u05e0\u05d7\u05d9\u05ea\u05d4 (Landing Page) \u05e2\u05dd AI", "html": "<div class=\"session-recap\"><div class=\"recap-label\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd</div><p>\u05d1\u05d7\u05e8\u05e0\u05d5 \u05e8\u05e2\u05d9\u05d5\u05df, \u05d4\u05d2\u05d3\u05e8\u05e0\u05d5 \u05e7\u05d4\u05dc \u05d9\u05e2\u05d3 \u05d5\u05de\u05d9\u05dc\u05d0\u05e0\u05d5 \u05d0\u05ea \"\u05d1\u05d5\u05e0\u05d4 \u05d4\u05e4\u05e8\u05d5\u05d9\u05e7\u05d8\". &bull; <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05d9\u05de\u05ea \u05d1\u05d9\u05ea:</strong> \u05de\u05d9 \u05d4\u05e9\u05dc\u05d9\u05dd \u05d0\u05ea 10 \u05d4\u05e9\u05d0\u05dc\u05d5\u05ea? \u05de\u05d9 \u05d7\u05e9\u05d1 \u05e2\u05dc \u05e2\u05d9\u05e6\u05d5\u05d1 \u05d5\u05e6\u05d1\u05e2\u05d9\u05dd? \u05d4\u05e6\u05d9\u05d2\u05d5 \u05d0\u05ea \u05d4\u05d0\u05e4\u05d9\u05d5\u05df \u05e9\u05dc\u05db\u05dd!</p></div><ul class=\"content-list\"><li><strong>\u05d7\u05d6\u05e8\u05d4 \u05de\u05d4\u05d9\u05e8\u05d4 &mdash; Cursor (\u05e7\u05e8\u05e1\u05d5\u05e8):</strong> \u05d4\u05ea\u05e7\u05e0\u05d5 \u05d0\u05ea Cursor \u05d1\u05de\u05e4\u05d2\u05e9 1. \u05d4\u05d9\u05d5\u05dd \u05e0\u05e9\u05ea\u05de\u05e9 \u05d1\u05d5 \u05dc\u05d1\u05e0\u05d5\u05ea \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8! \u05ea\u05d6\u05db\u05d5\u05e8\u05ea: <kbd>Ctrl+K</kbd> (\u05d5\u05d5\u05d9\u05e0\u05d3\u05d5\u05e1) \u05d0\u05d5 <kbd>Cmd+K</kbd> (\u05de\u05e7) \u05e4\u05d5\u05ea\u05d7 \u05d0\u05ea \u05d7\u05dc\u05d5\u05df \u05d4-AI &mdash; \u05db\u05d5\u05ea\u05d1\u05d9\u05dd \u05de\u05d4 \u05e8\u05d5\u05e6\u05d9\u05dd \u05dc\u05d1\u05e0\u05d5\u05ea \u05d5\u05d4\u05d5\u05d0 \u05db\u05d5\u05ea\u05d1 \u05d0\u05ea \u05d4\u05e7\u05d5\u05d3</li><li><strong>\u05de\u05d1\u05e0\u05d4 \u05d0\u05ea\u05e8 &mdash; 3 \u05e9\u05db\u05d1\u05d5\u05ea (Layers):</strong> \u05db\u05dc \u05d0\u05ea\u05e8 \u05d1\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8 \u05d1\u05e0\u05d5\u05d9 \u05de-3 \u05e9\u05e4\u05d5\u05ea \u05e9\u05e2\u05d5\u05d1\u05d3\u05d5\u05ea \u05d1\u05d9\u05d7\u05d3: <strong>HTML (\u05d0\u05d9\u05d9\u05e6\u05f3.\u05d8\u05d9.\u05d0\u05dd.\u05d0\u05dc)</strong> = \u05d4\u05e9\u05dc\u05d3 &mdash; \u05de\u05d2\u05d3\u05d9\u05e8 \u05de\u05d4 \u05d9\u05e9 \u05d1\u05d3\u05e3 (\u05db\u05d5\u05ea\u05e8\u05d5\u05ea, \u05d8\u05e7\u05e1\u05d8\u05d9\u05dd, \u05ea\u05de\u05d5\u05e0\u05d5\u05ea, \u05db\u05e4\u05ea\u05d5\u05e8\u05d9\u05dd). \u05db\u05de\u05d5 \u05d4\u05dc\u05d1\u05e0\u05d9\u05dd \u05e9\u05dc \u05d1\u05d9\u05ea. <strong>CSS (\u05e1\u05d9.\u05d0\u05e1.\u05d0\u05e1)</strong> = \u05d4\u05e2\u05d9\u05e6\u05d5\u05d1 &mdash; \u05e7\u05d5\u05d1\u05e2 \u05d0\u05d9\u05da \u05d4\u05d3\u05e3 \u05e0\u05e8\u05d0\u05d4 (\u05e6\u05d1\u05e2\u05d9\u05dd, \u05d2\u05d3\u05dc\u05d9\u05dd, \u05e4\u05d5\u05e0\u05d8\u05d9\u05dd). \u05db\u05de\u05d5 \u05d4\u05e6\u05d1\u05e2 \u05d5\u05d4\u05d8\u05e4\u05d8. <strong>JavaScript (\u05d2\u05f3\u05d0\u05d5\u05d5\u05d4-\u05e1\u05e7\u05e8\u05d9\u05e4\u05d8)</strong> = \u05d4\u05de\u05d5\u05d7 &mdash; \u05de\u05e4\u05e2\u05d9\u05dc \u05d3\u05d1\u05e8\u05d9\u05dd (\u05de\u05d4 \u05e7\u05d5\u05e8\u05d4 \u05db\u05e9\u05dc\u05d5\u05d7\u05e6\u05d9\u05dd \u05db\u05e4\u05ea\u05d5\u05e8, \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d5\u05ea). \u05db\u05de\u05d5 \u05d4\u05d7\u05e9\u05de\u05dc \u05e9\u05dc \u05d4\u05d1\u05d9\u05ea.</li><li><strong>\u05de\u05d4 \u05d6\u05d4 \u05e9\u05e8\u05ea (Server)? \u05d0\u05d9\u05da \u05d0\u05ea\u05e8 \u05e2\u05d5\u05d1\u05d3?</strong> \u05db\u05e9\u05d0\u05ea\u05dd \u05db\u05d5\u05ea\u05d1\u05d9\u05dd \u05db\u05ea\u05d5\u05d1\u05ea \u05d0\u05ea\u05e8 \u05d1\u05d3\u05e4\u05d3\u05e4\u05df (Browser &mdash; \u05ea\u05d5\u05db\u05e0\u05ea \u05d2\u05dc\u05d9\u05e9\u05d4 \u05db\u05de\u05d5 Chrome), \u05d4\u05de\u05d7\u05e9\u05d1 \u05e9\u05dc\u05db\u05dd (<strong>Client &mdash; \u05dc\u05e7\u05d5\u05d7</strong>) \u05e9\u05d5\u05dc\u05d7 \u05d1\u05e7\u05e9\u05d4 \u05dc<strong>Server (\u05e9\u05e8\u05ea)</strong> &mdash; \u05de\u05d7\u05e9\u05d1 \u05d7\u05d6\u05e7 \u05e9\u05d9\u05d5\u05e9\u05d1 \u05d1\u05de\u05e8\u05db\u05d6 \u05e0\u05ea\u05d5\u05e0\u05d9\u05dd (Data Center) \u05d5\u05de\u05d7\u05d6\u05d9\u05e7 \u05d0\u05ea \u05e7\u05d1\u05e6\u05d9 \u05d4\u05d0\u05ea\u05e8. \u05d4\u05e9\u05e8\u05ea \u05e9\u05d5\u05dc\u05d7 \u05d7\u05d6\u05e8\u05d4 \u05d0\u05ea \u05d4\u05e7\u05d1\u05e6\u05d9\u05dd \u05d5\u05d4\u05d3\u05e4\u05d3\u05e4\u05df \u05de\u05e6\u05d9\u05d2 \u05d0\u05d5\u05ea\u05dd. <strong>Domain (\u05d3\u05d5\u05de\u05d9\u05d9\u05df)</strong> = \u05d4\u05db\u05ea\u05d5\u05d1\u05ea \u05d4\u05e7\u05e8\u05d9\u05d0\u05d4 (\u05db\u05de\u05d5 google.com). <strong>Hosting (\u05d0\u05d7\u05e1\u05d5\u05df)</strong> = \u05d4\u05e9\u05e8\u05ea \u05e9\u05de\u05d0\u05d7\u05e1\u05df \u05d0\u05ea \u05d4\u05e7\u05d1\u05e6\u05d9\u05dd. \u05db\u05e8\u05d2\u05e2 \u05d1\u05d5\u05e0\u05d9\u05dd <strong>\u05de\u05e7\u05d5\u05de\u05d9\u05ea (Locally)</strong> &mdash; \u05d4\u05e7\u05d5\u05d1\u05e5 \u05e8\u05e7 \u05e2\u05dc \u05d4\u05de\u05d7\u05e9\u05d1 \u05e9\u05dc\u05db\u05dd. \u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0 \u05e0\u05e2\u05dc\u05d4 \u05dc\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8!</li><li><strong>\u05d1\u05e0\u05d9\u05d9\u05d4 \u05e2\u05dd AI &mdash; \u05d4\u05e4\u05e8\u05d5\u05de\u05e4\u05d8 \u05d4\u05e8\u05d0\u05e9\u05d5\u05df:</strong> \u05dc\u05d5\u05d7\u05e6\u05d9\u05dd <kbd>Ctrl+K</kbd> (\u05d5\u05d5\u05d9\u05e0\u05d3\u05d5\u05e1) \u05d0\u05d5 <kbd>Cmd+K</kbd> (\u05de\u05e7), \u05d5\u05db\u05d5\u05ea\u05d1\u05d9\u05dd Prompt (\u05e4\u05e8\u05d5\u05de\u05e4\u05d8 &mdash; \u05d4\u05d5\u05e8\u05d0\u05d4) \u05de\u05e4\u05d5\u05e8\u05d8. \u05d0\u05e4\u05e9\u05e8 \u05d1\u05e2\u05d1\u05e8\u05d9\u05ea! \u05dc\u05d3\u05d5\u05d2\u05de\u05d4: <code>&quot;\u05ea\u05d1\u05e0\u05d4 \u05dc\u05d9 \u05d3\u05e3 \u05e0\u05d7\u05d9\u05ea\u05d4 (Landing Page) \u05dc\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05e9\u05dc\u05d9 \u05e2\u05dd \u05db\u05d5\u05ea\u05e8\u05ea \u05de\u05d5\u05e9\u05db\u05ea, \u05d7\u05dc\u05e7 \u05d0\u05d5\u05d3\u05d5\u05ea, 3 \u05db\u05e8\u05d8\u05d9\u05e1\u05d9\u05d5\u05ea \u05e9\u05dc \u05e4\u05d9\u05e6\u05f3\u05e8\u05d9\u05dd, \u05d7\u05d5\u05d5\u05ea \u05d3\u05e2\u05ea, \u05d5\u05d8\u05d5\u05e4\u05e1 \u05d9\u05e6\u05d9\u05e8\u05ea \u05e7\u05e9\u05e8. \u05e2\u05d9\u05e6\u05d5\u05d1 \u05de\u05d5\u05d3\u05e8\u05e0\u05d9, \u05e6\u05d1\u05e2\u05d9\u05dd \u05db\u05d7\u05d5\u05dc \u05d5\u05e1\u05d2\u05d5\u05dc, \u05e2\u05d1\u05e8\u05d9\u05ea RTL&quot;</code> &mdash; \u05db\u05db\u05dc \u05e9\u05d4\u05e4\u05e8\u05d5\u05de\u05e4\u05d8 \u05de\u05e4\u05d5\u05e8\u05d8 \u05d9\u05d5\u05ea\u05e8, \u05d4\u05ea\u05d5\u05e6\u05d0\u05d4 \u05d8\u05d5\u05d1\u05d4 \u05d9\u05d5\u05ea\u05e8!</li><li><strong>\u05ea\u05e6\u05d5\u05d2\u05d4 \u05de\u05e7\u05d3\u05d9\u05de\u05d4 (Preview):</strong> \u05db\u05d3\u05d9 \u05dc\u05e8\u05d0\u05d5\u05ea \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e9\u05d1\u05e0\u05d9\u05ea\u05dd, \u05de\u05d7\u05e4\u05e9\u05d9\u05dd \u05d0\u05ea \u05e7\u05d5\u05d1\u05e5 \u05d4-<code>index.html</code> \u05d1\u05ea\u05d9\u05e7\u05d9\u05d9\u05d4 \u05d5\u05e4\u05d5\u05ea\u05d7\u05d9\u05dd \u05d0\u05d5\u05ea\u05d5 \u05d1\u05d3\u05e4\u05d3\u05e4\u05df Chrome (\u05dc\u05d7\u05d9\u05e6\u05d4 \u05db\u05e4\u05d5\u05dc\u05d4 \u05e2\u05dc \u05d4\u05e7\u05d5\u05d1\u05e5). \u05d0\u05d7\u05e8\u05d9 \u05db\u05dc \u05e9\u05d9\u05e0\u05d5\u05d9 \u05d1-Cursor &mdash; \u05d7\u05d5\u05d6\u05e8\u05d9\u05dd \u05dc\u05d3\u05e4\u05d3\u05e4\u05df \u05d5\u05dc\u05d5\u05d7\u05e6\u05d9\u05dd \u05e8\u05e2\u05e0\u05df (Refresh &mdash; F5) \u05db\u05d3\u05d9 \u05dc\u05e8\u05d0\u05d5\u05ea \u05d0\u05ea \u05d4\u05e2\u05d3\u05db\u05d5\u05df. \u05d1\u05d3\u05e7\u05d5: \u05d4\u05d0\u05dd \u05d4\u05d8\u05e7\u05e1\u05d8 \u05e7\u05e8\u05d9\u05d0? \u05d4\u05e6\u05d1\u05e2\u05d9\u05dd \u05e0\u05db\u05d5\u05e0\u05d9\u05dd? \u05d4\u05db\u05e4\u05ea\u05d5\u05e8\u05d9\u05dd \u05d1\u05de\u05e7\u05d5\u05dd?</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">HTML &mdash; \u05e9\u05dc\u05d3 \u05d4\u05d0\u05ea\u05e8</span><span class=\"concept-tag\">CSS &mdash; \u05e2\u05d9\u05e6\u05d5\u05d1</span><span class=\"concept-tag\">JavaScript &mdash; \u05d4\u05e4\u05e2\u05dc\u05d4</span><span class=\"concept-tag\">Server &mdash; \u05e9\u05e8\u05ea</span><span class=\"concept-tag\">Domain &mdash; \u05d3\u05d5\u05de\u05d9\u05d9\u05df</span><span class=\"concept-tag\">Landing Page &mdash; \u05d3\u05e3 \u05e0\u05d7\u05d9\u05ea\u05d4</span></div><div class=\"session-discussion\"><div class=\"disc-label\">\u05e9\u05d0\u05dc\u05d5\u05ea \u05dc\u05d3\u05d9\u05d5\u05df</div><p>\u05d0\u05d9\u05dc\u05d5 \u05d7\u05dc\u05e7\u05d9\u05dd \u05e6\u05e8\u05d9\u05db\u05d9\u05dd \u05dc\u05d4\u05d9\u05d5\u05ea \u05d1\u05d3\u05e3 \u05d4\u05e0\u05d7\u05d9\u05ea\u05d4 \u05e9\u05dc\u05db\u05dd? &bull; \u05d0\u05d9\u05dc\u05d5 \u05e6\u05d1\u05e2\u05d9\u05dd \u05de\u05d9\u05d9\u05e6\u05d2\u05d9\u05dd \u05d0\u05ea \u05d4\u05de\u05d5\u05ea\u05d2 \u05e9\u05dc\u05db\u05dd? &bull; \u05de\u05d4 \u05d4\u05d4\u05d1\u05d3\u05dc \u05d1\u05d9\u05df \u05d0\u05ea\u05e8 \u05e9\u05e0\u05de\u05e6\u05d0 \u05e8\u05e7 \u05e2\u05dc \u05d4\u05de\u05d7\u05e9\u05d1 \u05e9\u05dc\u05db\u05dd \u05dc\u05d1\u05d9\u05df \u05d0\u05ea\u05e8 \u05e9\u05d7\u05d9 \u05d1\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">\u05ea\u05e8\u05d2\u05d5\u05dc \u05db\u05d9\u05ea\u05d4 (25 \u05d3\u05e7\u05d5\u05ea)</div><p><strong>\u05d1\u05d5\u05e0\u05d9\u05dd \u05d3\u05e3 \u05e0\u05d7\u05d9\u05ea\u05d4 (Landing Page)!</strong> \u05db\u05dc \u05ea\u05dc\u05de\u05d9\u05d3 \u05e4\u05d5\u05ea\u05d7 Cursor, \u05dc\u05d5\u05d7\u05e5 <kbd>Ctrl+K</kbd> / <kbd>Cmd+K</kbd>, \u05d5\u05db\u05d5\u05ea\u05d1 \u05e4\u05e8\u05d5\u05de\u05e4\u05d8 (Prompt) \u05de\u05e4\u05d5\u05e8\u05d8 \u05dc\u05de\u05d5\u05e6\u05e8 \u05e9\u05dc\u05d5. \u05d4\u05ea\u05d5\u05e6\u05d0\u05d4: \u05d0\u05ea\u05e8 \u05e9\u05dc\u05dd \u05e2\u05dd \u05db\u05d5\u05ea\u05e8\u05ea, \u05ea\u05d9\u05d0\u05d5\u05e8, \u05e4\u05d9\u05e6\u05f3\u05e8\u05d9\u05dd (Features &mdash; \u05d9\u05db\u05d5\u05dc\u05d5\u05ea) \u05d5\u05db\u05e4\u05ea\u05d5\u05e8! \u05de\u05d9 \u05de\u05e7\u05d1\u05dc \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05d4\u05db\u05d9 \u05d9\u05e4\u05d4?</p></div><div class=\"session-homework\"><div class=\"homework-label\">\u05d0\u05ea\u05d2\u05e8 \u05d1\u05d9\u05ea</div><p>1. <strong>\u05e9\u05e4\u05e8\u05d5 \u05d0\u05ea \u05d3\u05e3 \u05d4\u05e0\u05d7\u05d9\u05ea\u05d4</strong> &mdash; \u05d4\u05d5\u05e1\u05d9\u05e4\u05d5 \u05d0\u05ea \u05d4\u05dc\u05d5\u05d2\u05d5 (Logo) \u05e9\u05d9\u05e6\u05e8\u05ea\u05dd \u05d1\u05de\u05e4\u05d2\u05e9 2! \u05d1\u05e7\u05e9\u05d5 \u05de-Cursor: &quot;\u05ea\u05d5\u05e1\u05d9\u05e3 \u05d0\u05ea \u05d4\u05dc\u05d5\u05d2\u05d5 \u05e9\u05dc\u05d9 \u05dc\u05e8\u05d0\u05e9 \u05d4\u05d3\u05e3&quot;</p><p>2. <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05d5\u05d1\u05d9\u05d9\u05dc (Mobile):</strong> \u05e4\u05ea\u05d7\u05d5 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05d1\u05d8\u05dc\u05e4\u05d5\u05df &mdash; \u05d4\u05d0\u05dd \u05d4\u05d5\u05d0 \u05e0\u05e8\u05d0\u05d4 \u05d8\u05d5\u05d1? \u05d0\u05dd \u05dc\u05d0, \u05d1\u05e7\u05e9\u05d5 \u05de-Cursor: &quot;\u05ea\u05e2\u05e9\u05d4 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e8\u05e1\u05e4\u05d5\u05e0\u05e1\u05d9\u05d1\u05d9 (Responsive &mdash; \u05de\u05ea\u05d0\u05d9\u05dd \u05dc\u05db\u05dc \u05de\u05e1\u05da)&quot;</p><p>3. \u05d4\u05d5\u05e1\u05d9\u05e4\u05d5 \u05e2\u05d5\u05d3 Section (\u05de\u05e7\u05d8\u05e2) &mdash; \u05dc\u05de\u05e9\u05dc: About (\u05d0\u05d5\u05d3\u05d5\u05ea), Features (\u05d9\u05db\u05d5\u05dc\u05d5\u05ea), \u05d0\u05d5 FAQ (\u05e9\u05d0\u05dc\u05d5\u05ea \u05e0\u05e4\u05d5\u05e6\u05d5\u05ea)</p><div class=\"hw-connection\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0 \u05e0\u05e9\u05d3\u05e8\u05d2 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e2\u05dd Animation (\u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d4), \u05d8\u05e4\u05e1\u05d9\u05dd (Forms) \u05d5\u05ea\u05e4\u05e8\u05d9\u05d8 \u05e0\u05d9\u05d5\u05d5\u05d8 (Navigation)!</div></div>"}, {"title": "\u05d1\u05d5\u05e0\u05d9\u05dd \u05d0\u05ea\u05e8 \u2014 \u05d7\u05dc\u05e7 2", "subtitle": "\u05e4\u05d9\u05ea\u05d5\u05d7", "goal": "\u05dc\u05e9\u05d3\u05e8\u05d2 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e2\u05dd \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d5\u05ea, \u05e8\u05e1\u05e4\u05d5\u05e0\u05e1\u05d9\u05d1\u05d9\u05d5\u05ea \u05dc\u05de\u05d5\u05d1\u05d9\u05d9\u05dc, \u05d8\u05e4\u05e1\u05d9\u05dd \u05d5\u05e4\u05d9\u05e6'\u05e8\u05d9\u05dd \u05de\u05ea\u05e7\u05d3\u05de\u05d9\u05dd", "html": "<div class=\"session-recap\"><div class=\"recap-label\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd</div><p>\u05d4\u05ea\u05e7\u05e0\u05d5 Cursor \u05d5\u05d1\u05e0\u05d9\u05e0\u05d5 \u05d0\u05ea \u05d3\u05e3 \u05d4\u05e0\u05d7\u05d9\u05ea\u05d4 \u05d4\u05e8\u05d0\u05e9\u05d5\u05df! &bull; <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05d9\u05de\u05ea \u05d1\u05d9\u05ea:</strong> \u05de\u05d9 \u05d4\u05d5\u05e1\u05d9\u05e3 \u05d0\u05ea \u05d4\u05dc\u05d5\u05d2\u05d5? \u05de\u05d9 \u05d1\u05d3\u05e7 \u05d1\u05d8\u05dc\u05e4\u05d5\u05df? \u05d4\u05e8\u05d0\u05d5 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8\u05d9\u05dd \u05e9\u05dc\u05db\u05dd!</p></div><ul class=\"content-list\"><li><strong>Animation (\u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d4) &mdash; \u05de\u05d4 \u05d6\u05d4 \u05d5\u05dc\u05de\u05d4 \u05d6\u05d4 \u05d7\u05e9\u05d5\u05d1:</strong> \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d5\u05ea \u05d2\u05d5\u05e8\u05de\u05d5\u05ea \u05dc\u05d0\u05ea\u05e8 \u05dc\u05d4\u05e8\u05d2\u05d9\u05e9 \u05de\u05e7\u05e6\u05d5\u05e2\u05d9 \u05d5&quot;\u05d7\u05d9&quot;. \u05e1\u05d5\u05d2\u05d9\u05dd: (1) <strong>Hover (\u05e8\u05d9\u05d7\u05d5\u05e3)</strong> &mdash; \u05db\u05e4\u05ea\u05d5\u05e8 \u05de\u05e9\u05e0\u05d4 \u05e6\u05d1\u05e2 \u05db\u05e9\u05de\u05e8\u05d7\u05e4\u05d9\u05dd \u05e2\u05dc\u05d9\u05d5 \u05e2\u05dd \u05d4\u05e2\u05db\u05d1\u05e8. (2) <strong>Fade-in (\u05d4\u05d5\u05e4\u05e2\u05d4 \u05e2\u05d3\u05d9\u05e0\u05d4)</strong> &mdash; \u05d0\u05dc\u05de\u05e0\u05d8\u05d9\u05dd \u05e0\u05db\u05e0\u05e1\u05d9\u05dd \u05d1\u05e2\u05d3\u05d9\u05e0\u05d5\u05ea \u05db\u05e9\u05d2\u05d5\u05dc\u05dc\u05d9\u05dd \u05dc\u05de\u05d8\u05d4. (3) <strong>Slide (\u05d4\u05d7\u05dc\u05e7\u05d4)</strong> &mdash; \u05ea\u05de\u05d5\u05e0\u05d5\u05ea \u05d0\u05d5 \u05d8\u05e7\u05e1\u05d8\u05d9\u05dd \u05e0\u05db\u05e0\u05e1\u05d9\u05dd \u05de\u05d4\u05e6\u05d3. \u05d3\u05d5\u05d2\u05de\u05ea \u05e4\u05e8\u05d5\u05de\u05e4\u05d8 \u05dc-Cursor: &quot;\u05ea\u05d5\u05e1\u05d9\u05e3 \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d5\u05ea \u05d7\u05dc\u05e7\u05d5\u05ea \u05db\u05e9\u05d4\u05de\u05e7\u05d8\u05e2\u05d9\u05dd \u05de\u05d5\u05e4\u05d9\u05e2\u05d9\u05dd \u05d1\u05d2\u05dc\u05d9\u05dc\u05d4, \u05d5\u05d0\u05e4\u05e7\u05d8 \u05e8\u05d9\u05d7\u05d5\u05e3 \u05e2\u05dc \u05db\u05e4\u05ea\u05d5\u05e8\u05d9\u05dd&quot;</li><li><strong>Responsive Design (\u05e2\u05d9\u05e6\u05d5\u05d1 \u05e8\u05e1\u05e4\u05d5\u05e0\u05e1\u05d9\u05d1\u05d9) &mdash; \u05d4\u05d0\u05ea\u05e8 \u05d7\u05d9\u05d9\u05d1 \u05dc\u05e2\u05d1\u05d5\u05d3 \u05d1\u05d8\u05dc\u05e4\u05d5\u05df!</strong> \u05d9\u05d5\u05ea\u05e8 \u05de-60% \u05de\u05d4\u05d2\u05d5\u05dc\u05e9\u05d9\u05dd \u05d2\u05d5\u05dc\u05e9\u05d9\u05dd \u05de\u05d4\u05d8\u05dc\u05e4\u05d5\u05df! <strong>\u05e8\u05e1\u05e4\u05d5\u05e0\u05e1\u05d9\u05d1\u05d9</strong> = \u05d4\u05d0\u05ea\u05e8 \u05de\u05e9\u05ea\u05e0\u05d4 \u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9\u05ea \u05d1\u05d4\u05ea\u05d0\u05dd \u05dc\u05d2\u05d5\u05d3\u05dc \u05d4\u05de\u05e1\u05da. \u05d1\u05de\u05d7\u05e9\u05d1: 3 \u05e2\u05de\u05d5\u05d3\u05d5\u05ea \u05d6\u05d5 \u05dc\u05d9\u05d3 \u05d6\u05d5. \u05d1\u05d8\u05dc\u05e4\u05d5\u05df: \u05e2\u05de\u05d5\u05d3\u05d4 \u05d0\u05d7\u05ea, \u05db\u05e4\u05ea\u05d5\u05e8\u05d9\u05dd \u05d2\u05d3\u05d5\u05dc\u05d9\u05dd \u05d9\u05d5\u05ea\u05e8, \u05d8\u05e7\u05e1\u05d8 \u05e7\u05e8\u05d9\u05d0. \u05d3\u05d5\u05d2\u05de\u05ea \u05e4\u05e8\u05d5\u05de\u05e4\u05d8: &quot;\u05ea\u05e2\u05e9\u05d4 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e8\u05e1\u05e4\u05d5\u05e0\u05e1\u05d9\u05d1\u05d9 &mdash; \u05e9\u05d9\u05e2\u05d1\u05d5\u05d3 \u05d2\u05dd \u05d1\u05d8\u05dc\u05e4\u05d5\u05df \u05e2\u05dd \u05e2\u05de\u05d5\u05d3\u05d4 \u05d0\u05d7\u05ea \u05d5\u05db\u05e4\u05ea\u05d5\u05e8\u05d9\u05dd \u05d2\u05d3\u05d5\u05dc\u05d9\u05dd&quot;</li><li><strong>Navigation (\u05e0\u05d9\u05d5\u05d5\u05d8) \u05de\u05e7\u05e6\u05d5\u05e2\u05d9:</strong> \u05db\u05dc \u05d0\u05ea\u05e8 \u05e8\u05e6\u05d9\u05e0\u05d9 \u05e6\u05e8\u05d9\u05da Header (\u05db\u05d5\u05ea\u05e8\u05ea \u05e2\u05dc\u05d9\u05d5\u05e0\u05d4) \u05e7\u05d1\u05d5\u05e2 \u05dc\u05de\u05e2\u05dc\u05d4 \u05e2\u05dd: Logo (\u05dc\u05d5\u05d2\u05d5), Links (\u05e7\u05d9\u05e9\u05d5\u05e8\u05d9\u05dd) \u05dc\u05d7\u05dc\u05e7\u05d9 \u05d4\u05d0\u05ea\u05e8 (\u05d0\u05d5\u05d3\u05d5\u05ea, \u05d9\u05db\u05d5\u05dc\u05d5\u05ea, \u05e6\u05d5\u05e8 \u05e7\u05e9\u05e8), \u05d5\u05db\u05e4\u05ea\u05d5\u05e8 CTA (Call To Action &mdash; \u05e7\u05e8\u05d9\u05d0\u05d4 \u05dc\u05e4\u05e2\u05d5\u05dc\u05d4) \u05d1\u05d5\u05dc\u05d8. \u05d1\u05de\u05d5\u05d1\u05d9\u05d9\u05dc &mdash; \u05ea\u05e4\u05e8\u05d9\u05d8 Hamburger Menu (&quot;\u05d4\u05de\u05d1\u05d5\u05e8\u05d2\u05e8&quot; &mdash; 3 \u05e4\u05e1\u05d9\u05dd ) \u05e9\u05e0\u05e4\u05ea\u05d7 \u05d1\u05dc\u05d7\u05d9\u05e6\u05d4. \u05d3\u05d5\u05d2\u05de\u05ea \u05e4\u05e8\u05d5\u05de\u05e4\u05d8: &quot;\u05ea\u05d5\u05e1\u05d9\u05e3 \u05ea\u05e4\u05e8\u05d9\u05d8 \u05e0\u05d9\u05d5\u05d5\u05d8 \u05e7\u05d1\u05d5\u05e2 \u05dc\u05de\u05e2\u05dc\u05d4 \u05e2\u05dd \u05dc\u05d5\u05d2\u05d5, \u05e7\u05d9\u05e9\u05d5\u05e8\u05d9\u05dd, \u05d5\u05ea\u05e4\u05e8\u05d9\u05d8 \u05d4\u05de\u05d1\u05d5\u05e8\u05d2\u05e8 \u05d1\u05de\u05d5\u05d1\u05d9\u05d9\u05dc&quot;</li><li><strong>Form (\u05d8\u05d5\u05e4\u05e1):</strong> \u05d8\u05d5\u05e4\u05e1 &quot;\u05e6\u05d5\u05e8 \u05e7\u05e9\u05e8&quot; \u05d4\u05d5\u05d0 \u05d7\u05d5\u05d1\u05d4 \u05d1\u05db\u05dc \u05d0\u05ea\u05e8 \u05e2\u05e1\u05e7\u05d9. \u05e9\u05d3\u05d5\u05ea (Fields): \u05e9\u05dd, \u05d0\u05d9\u05de\u05d9\u05d9\u05dc (Email), \u05d4\u05d5\u05d3\u05e2\u05d4 (Message). \u05d4\u05d5\u05e1\u05d9\u05e4\u05d5 Validation (\u05d5\u05dc\u05d9\u05d3\u05e6\u05d9\u05d4 &mdash; \u05d1\u05d3\u05d9\u05e7\u05d4 \u05e9\u05d4\u05e9\u05d3\u05d5\u05ea \u05de\u05dc\u05d0\u05d9\u05dd \u05d5\u05e9\u05d4\u05d0\u05d9\u05de\u05d9\u05d9\u05dc \u05ea\u05e7\u05d9\u05df). \u05d3\u05d5\u05d2\u05de\u05ea \u05e4\u05e8\u05d5\u05de\u05e4\u05d8: &quot;\u05ea\u05d5\u05e1\u05d9\u05e3 \u05d8\u05d5\u05e4\u05e1 \u05d9\u05e6\u05d9\u05e8\u05ea \u05e7\u05e9\u05e8 \u05e2\u05dd \u05e9\u05dd, \u05d0\u05d9\u05de\u05d9\u05d9\u05dc \u05d5\u05d4\u05d5\u05d3\u05e2\u05d4, \u05e2\u05dd \u05d1\u05d3\u05d9\u05e7\u05ea \u05ea\u05e7\u05d9\u05e0\u05d5\u05ea \u05d5\u05db\u05e4\u05ea\u05d5\u05e8 \u05e9\u05dc\u05d9\u05d7\u05d4 \u05de\u05e2\u05d5\u05e6\u05d1&quot;</li><li><strong>Deploy (\u05d4\u05e2\u05dc\u05d0\u05d4) \u05dc\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8 &mdash; GitHub Pages:</strong> \u05e2\u05d3 \u05e2\u05db\u05e9\u05d9\u05d5 \u05d4\u05d0\u05ea\u05e8 \u05d7\u05d9 \u05e8\u05e7 \u05e2\u05dc \u05d4\u05de\u05d7\u05e9\u05d1 \u05e9\u05dc\u05db\u05dd (Locally &mdash; \u05de\u05e7\u05d5\u05de\u05d9\u05ea). \u05db\u05d3\u05d9 \u05e9\u05db\u05dc \u05d4\u05e2\u05d5\u05dc\u05dd \u05d9\u05d5\u05db\u05dc \u05dc\u05e8\u05d0\u05d5\u05ea \u05d0\u05d5\u05ea\u05d5, \u05e6\u05e8\u05d9\u05da <strong>Deploy (\u05dc\u05d4\u05e2\u05dc\u05d5\u05ea \u05d0\u05d5\u05ea\u05d5 \u05dc\u05e9\u05e8\u05ea)</strong>. <strong>GitHub Pages</strong> = \u05e9\u05d9\u05e8\u05d5\u05ea \u05d7\u05d9\u05e0\u05de\u05d9 \u05e9\u05dc GitHub \u05e9\u05d4\u05d5\u05e4\u05da \u05d0\u05ea \u05d4\u05e7\u05d5\u05d3 \u05e9\u05dc\u05db\u05dd \u05dc\u05d0\u05ea\u05e8 \u05d7\u05d9 \u05d1\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8! \u05d0\u05d9\u05da \u05d6\u05d4 \u05e2\u05d5\u05d1\u05d3? (1) \u05d9\u05d5\u05e6\u05e8\u05d9\u05dd \u05d7\u05e9\u05d1\u05d5\u05df \u05d1-GitHub (\u05e8\u05d0\u05d5 \u05d4\u05d3\u05e8\u05db\u05d4 \u05d1\u05dc\u05e9\u05d5\u05e0\u05d9\u05ea &quot;\u05d4\u05d3\u05e8\u05db\u05d5\u05ea&quot;). (2) \u05de\u05e2\u05dc\u05d9\u05dd \u05d0\u05ea \u05e7\u05d1\u05e6\u05d9 \u05d4\u05d0\u05ea\u05e8 \u05dc-Repository (\u05e8\u05d9\u05e4\u05d5 &mdash; \u05de\u05d0\u05d2\u05e8 \u05e7\u05d5\u05d3). (3) \u05de\u05e4\u05e2\u05d9\u05dc\u05d9\u05dd GitHub Pages \u05d1\u05d4\u05d2\u05d3\u05e8\u05d5\u05ea (Settings). (4) \u05de\u05e7\u05d1\u05dc\u05d9\u05dd \u05db\u05ea\u05d5\u05d1\u05ea \u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8: <code>https://username.github.io/repo-name</code>. \u05de\u05d4 \u05e7\u05d5\u05e8\u05d4 \u05de\u05d0\u05d7\u05d5\u05e8\u05d9 \u05d4\u05e7\u05dc\u05e2\u05d9\u05dd? \u05d4-<strong>Domain (\u05d3\u05d5\u05de\u05d9\u05d9\u05df)</strong> = \u05d4\u05db\u05ea\u05d5\u05d1\u05ea \u05d4\u05e7\u05e8\u05d9\u05d0\u05d4. \u05e9\u05e8\u05ea\u05d9 GitHub = \u05de\u05d7\u05e9\u05d1\u05d9\u05dd \u05e9\u05de\u05e8\u05d9\u05e6\u05d9\u05dd \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e9\u05dc\u05db\u05dd 24/7. <strong>DNS</strong> (\u05de\u05e2\u05e8\u05db\u05ea \u05e9\u05de\u05d5\u05ea \u05d3\u05d5\u05de\u05d9\u05d9\u05df) = \u05de\u05ea\u05e8\u05d2\u05de\u05ea \u05d0\u05ea \u05d4\u05db\u05ea\u05d5\u05d1\u05ea \u05d4\u05e7\u05e8\u05d9\u05d0\u05d4 \u05dc\u05db\u05ea\u05d5\u05d1\u05ea IP \u05e9\u05dc \u05d4\u05e9\u05e8\u05ea.</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Animation &mdash; \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d4</span><span class=\"concept-tag\">Responsive &mdash; \u05e8\u05e1\u05e4\u05d5\u05e0\u05e1\u05d9\u05d1\u05d9</span><span class=\"concept-tag\">Navigation &mdash; \u05e0\u05d9\u05d5\u05d5\u05d8</span><span class=\"concept-tag\">Form &mdash; \u05d8\u05d5\u05e4\u05e1</span><span class=\"concept-tag\">GitHub Pages &mdash; \u05d0\u05d7\u05e1\u05d5\u05df \u05d7\u05d9\u05e0\u05de\u05d9</span><span class=\"concept-tag\">DNS &mdash; \u05de\u05e2\u05e8\u05db\u05ea \u05db\u05ea\u05d5\u05d1\u05d5\u05ea</span></div><div class=\"session-discussion\"><div class=\"disc-label\">\u05e9\u05d0\u05dc\u05d5\u05ea \u05dc\u05d3\u05d9\u05d5\u05df</div><p>\u05d1\u05d3\u05e7\u05d5 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e9\u05dc\u05db\u05dd \u05d1\u05d8\u05dc\u05e4\u05d5\u05df &mdash; \u05de\u05d4 \u05e6\u05e8\u05d9\u05da \u05dc\u05d4\u05e9\u05ea\u05e0\u05d5\u05ea? &bull; \u05d0\u05d9\u05d6\u05d5 \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d4 \u05ea\u05d2\u05e8\u05d5\u05dd \u05dc\u05d0\u05ea\u05e8 \u05dc\u05d4\u05e8\u05d2\u05d9\u05e9 \u05de\u05e7\u05e6\u05d5\u05e2\u05d9?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">\u05ea\u05e8\u05d2\u05d5\u05dc \u05db\u05d9\u05ea\u05d4 (25 \u05d3\u05e7\u05d5\u05ea)</div><p><strong>\u05e9\u05d3\u05e8\u05d5\u05d2 \u05d4\u05d0\u05ea\u05e8!</strong> \u05db\u05dc \u05ea\u05dc\u05de\u05d9\u05d3 \u05de\u05d5\u05e1\u05d9\u05e3 \u05dc\u05d0\u05ea\u05e8 \u05e9\u05dc\u05d5 \u05dc\u05e4\u05d7\u05d5\u05ea 3 \u05d3\u05d1\u05e8\u05d9\u05dd \u05d1\u05e2\u05d6\u05e8\u05ea Cursor (<kbd>Ctrl+K</kbd> / <kbd>Cmd+K</kbd>): (1) Form (\u05d8\u05d5\u05e4\u05e1) \u05d9\u05e6\u05d9\u05e8\u05ea \u05e7\u05e9\u05e8, (2) Animation (\u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d4) \u05d0\u05d7\u05ea \u05dc\u05e4\u05d7\u05d5\u05ea, (3) Navigation (\u05ea\u05e4\u05e8\u05d9\u05d8 \u05e0\u05d9\u05d5\u05d5\u05d8) \u05e2\u05dd \u05dc\u05d5\u05d2\u05d5 \u05d5\u05e7\u05d9\u05e9\u05d5\u05e8\u05d9\u05dd. \u05de\u05d9 \u05de\u05e7\u05d1\u05dc \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05d4\u05db\u05d9 \u05de\u05e7\u05e6\u05d5\u05e2\u05d9?</p></div><div class=\"session-homework\"><div class=\"homework-label\">\u05d0\u05ea\u05d2\u05e8 \u05d1\u05d9\u05ea</div><p>1. <strong>Deploy (\u05d4\u05e2\u05dc\u05d0\u05d4) \u05dc\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8!</strong> \u05d4\u05e2\u05dc\u05d5 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e2\u05dd GitHub Pages (\u05e8\u05d0\u05d5 \u05d4\u05d3\u05e8\u05db\u05d4 \u05d1\u05dc\u05e9\u05d5\u05e0\u05d9\u05ea &quot;\u05d4\u05d3\u05e8\u05db\u05d5\u05ea&quot;). \u05e9\u05dc\u05d1\u05d9\u05dd: \u05d7\u05e9\u05d1\u05d5\u05df GitHub &rarr; Repository (\u05de\u05d0\u05d2\u05e8 \u05e7\u05d5\u05d3) &rarr; \u05d4\u05e2\u05dc\u05d0\u05ea \u05e7\u05d1\u05e6\u05d9\u05dd &rarr; \u05d4\u05e4\u05e2\u05dc\u05ea Pages.</p><p>2. <strong>User Testing (\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05ea\u05de\u05e9\u05d9\u05dd):</strong> \u05e9\u05dc\u05d7\u05d5 \u05d0\u05ea \u05d4\u05dc\u05d9\u05e0\u05e7 \u05d4\u05d7\u05d9 \u05dc-3 \u05d7\u05d1\u05e8\u05d9\u05dd \u05d5\u05d1\u05e7\u05e9\u05d5 Feedback (\u05e4\u05d9\u05d3\u05d1\u05e7 &mdash; \u05de\u05e9\u05d5\u05d1): \u05de\u05d4 \u05d0\u05d4\u05d1\u05d5? \u05de\u05d4 \u05dc\u05d0 \u05d1\u05e8\u05d5\u05e8? \u05de\u05d4 \u05d4\u05d9\u05d9\u05ea\u05dd \u05de\u05e9\u05e0\u05d9\u05dd?</p><p>3. \u05d7\u05e9\u05d1\u05d5: \u05d0\u05d9\u05da \u05d4\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05e9\u05dc\u05db\u05dd \u05d9\u05e8\u05d5\u05d5\u05d9\u05d7 \u05db\u05e1\u05e3? Subscription (\u05de\u05e0\u05d5\u05d9 \u05d7\u05d5\u05d3\u05e9\u05d9)? Freemium (\u05d7\u05d9\u05e0\u05dd + \u05e4\u05e8\u05d9\u05de\u05d9\u05d5\u05dd)? E-commerce (\u05d7\u05e0\u05d5\u05ea)?</p><div class=\"hw-connection\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0 \u05e0\u05dc\u05de\u05d3 \u05e2\u05dc Business Model (\u05de\u05d5\u05d3\u05dc \u05e2\u05e1\u05e7\u05d9) \u05d5-Marketing (\u05e9\u05d9\u05d5\u05d5\u05e7). \u05d4\u05d0\u05ea\u05e8 \u05e9\u05d1\u05e0\u05d9\u05ea\u05dd \u05d9\u05d4\u05d9\u05d4 \u05d4\u05d1\u05e1\u05d9\u05e1!</div></div>"}, {"title": "\u05de\u05e2\u05dc\u05d9\u05dd \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05dc\u05d0\u05d5\u05d5\u05d9\u05e8", "subtitle": "\u05d4\u05e9\u05e7\u05d4", "goal": "\u05dc\u05d4\u05e2\u05dc\u05d5\u05ea \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05dc\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8 \u05e2\u05dd Claude Desktop \u05d5-Connectors, \u05dc\u05e7\u05d1\u05dc \u05dc\u05d9\u05e0\u05e7 \u05e6\u05d9\u05d1\u05d5\u05e8\u05d9 \u05d0\u05de\u05d9\u05ea\u05d9, \u05d5\u05dc\u05d4\u05d1\u05d9\u05df \u05d0\u05d9\u05da \u05d3\u05d5\u05de\u05d9\u05d9\u05e0\u05d9\u05dd \u05e2\u05d5\u05d1\u05d3\u05d9\u05dd", "html": "<div class=\"session-recap\"><div class=\"recap-label\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd</div><p>\u05e9\u05d3\u05e8\u05d2\u05e0\u05d5 \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05e2\u05dd \u05d0\u05e0\u05d9\u05de\u05e6\u05d9\u05d5\u05ea, \u05d8\u05d5\u05e4\u05e1 \u05d5\u05ea\u05e4\u05e8\u05d9\u05d8 \u05e0\u05d9\u05d5\u05d5\u05d8! &bull; <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05d9\u05de\u05ea \u05d1\u05d9\u05ea:</strong> \u05d1\u05d3\u05e7\u05ea \u05d1\u05d8\u05dc\u05e4\u05d5\u05df? \u05e7\u05d9\u05d1\u05dc\u05ea \u05e4\u05d9\u05d3\u05d1\u05e7? \u05d7\u05e9\u05d1\u05ea \u05d0\u05d9\u05da \u05d4\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05e9\u05dc\u05da \u05d9\u05e8\u05d5\u05d5\u05d9\u05d7 \u05db\u05e1\u05e3? \u05d4\u05d9\u05d5\u05dd \u05d4\u05d0\u05ea\u05e8 \u05e2\u05d5\u05dc\u05d4 \u05dc\u05d0\u05d5\u05d5\u05d9\u05e8.</p></div><ul class=\"content-list\"><li><strong>\u05de\u05d4 \u05d6\u05d4 \u05e9\u05e8\u05ea?</strong> \u05e9\u05e8\u05ea (Server) \u05d4\u05d5\u05d0 \u05de\u05d7\u05e9\u05d1 \u05e9\u05d3\u05d5\u05dc\u05e7 \u05ea\u05de\u05d9\u05d3 \u05d5\u05de\u05d7\u05d5\u05d1\u05e8 \u05dc\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8. \u05d4\u05ea\u05e4\u05e7\u05d9\u05d3 \u05e9\u05dc\u05d5 \u05d4\u05d5\u05d0 &quot;\u05dc\u05d4\u05d2\u05d9\u05e9&quot; \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05dc\u05db\u05dc \u05de\u05d9 \u05e9\u05de\u05d1\u05e7\u05e9. <strong>\u05d0\u05d7\u05e1\u05d5\u05df (Hosting)</strong> = \u05e9\u05d5\u05db\u05e8\u05d9\u05dd \u05de\u05e7\u05d5\u05dd \u05e2\u05dc \u05de\u05d7\u05e9\u05d1 \u05db\u05d6\u05d4. \u05db\u05e8\u05d2\u05e2 \u05d4\u05d0\u05ea\u05e8 \u05e9\u05dc\u05da \u05d7\u05d9 \u05e8\u05e7 \u05d1\u05de\u05d7\u05e9\u05d1 \u05e9\u05dc\u05da &mdash; \u05db\u05de\u05d5 \u05e2\u05d5\u05d2\u05d4 \u05d1\u05de\u05d8\u05d1\u05d7 \u05e9\u05e8\u05e7 \u05d4\u05de\u05e9\u05e4\u05d7\u05d4 \u05d9\u05db\u05d5\u05dc\u05d4 \u05dc\u05d8\u05e2\u05d5\u05dd. \u05d0\u05d7\u05e1\u05d5\u05df \u05e9\u05dd \u05d0\u05d5\u05ea\u05d4 \u05d1\u05d7\u05dc\u05d5\u05df \u05e8\u05d0\u05d5\u05d5\u05d4 \u05e9\u05dc \u05de\u05d0\u05e4\u05d9\u05d9\u05d4 \u05d1\u05e8\u05d7\u05d5\u05d1 \u05e1\u05d5\u05d0\u05df, \u05e4\u05ea\u05d5\u05d7 \u05d9\u05d5\u05de\u05dd \u05d5\u05dc\u05d9\u05dc\u05d4</li><li><strong>Connectors (\u05de\u05d7\u05d1\u05e8\u05d9\u05dd) \u05d1-Claude Desktop:</strong> \u05de\u05d7\u05d1\u05e8 \u05de\u05d0\u05e4\u05e9\u05e8 \u05dc-Claude \u05dc\u05e2\u05d1\u05d5\u05d3 \u05d9\u05e9\u05d9\u05e8\u05d5\u05ea \u05e2\u05dd \u05d4\u05d7\u05e9\u05d1\u05d5\u05e0\u05d5\u05ea \u05d4\u05d0\u05d7\u05e8\u05d9\u05dd \u05e9\u05dc\u05da &mdash; \u05dc\u05de\u05e9\u05dc \u05dc\u05d9\u05e6\u05d5\u05e8 \u05d1\u05e9\u05d1\u05d9\u05dc\u05da \u05de\u05d0\u05d2\u05e8 \u05d1-GitHub. \u05d0\u05d9\u05e4\u05d4 \u05de\u05d5\u05e6\u05d0\u05d9\u05dd: <strong>Claude Desktop &larr; Settings &larr; Connectors</strong>. \u05db\u05dc \u05d7\u05d9\u05d1\u05d5\u05e8 \u05de\u05d1\u05e7\u05e9 \u05d0\u05ea \u05d4\u05d0\u05d9\u05e9\u05d5\u05e8 \u05e9\u05dc\u05da: \u05e7\u05d5\u05e8\u05d0\u05d9\u05dd \u05de\u05d4 \u05d4\u05d5\u05d0 \u05e8\u05d5\u05e6\u05d4 \u05dc\u05e2\u05e9\u05d5\u05ea, \u05d5\u05d0\u05d6 \u05de\u05d0\u05e9\u05e8\u05d9\u05dd. \u05d4\u05e9\u05dc\u05d9\u05d8\u05d4 \u05d0\u05e6\u05dc\u05da &mdash; Claude \u05de\u05e1\u05d1\u05d9\u05e8 \u05dc\u05e4\u05e0\u05d9 \u05e9\u05d4\u05d5\u05d0 \u05e4\u05d5\u05e2\u05dc, \u05d5\u05d0\u05e4\u05e9\u05e8 \u05dc\u05e0\u05ea\u05e7 \u05d1\u05db\u05dc \u05e8\u05d2\u05e2</li><li><strong>GitHub &mdash; \u05d4\u05d1\u05d9\u05ea \u05e9\u05dc \u05d4\u05d0\u05ea\u05e8 \u05d1\u05e2\u05e0\u05df:</strong> (1) \u05e4\u05d5\u05ea\u05d7\u05d9\u05dd \u05d7\u05e9\u05d1\u05d5\u05df \u05d7\u05d9\u05e0\u05de\u05d9 \u05d1-<code>github.com</code> \u05d9\u05d7\u05d3 \u05e2\u05dd \u05d4\u05d5\u05e8\u05d4. (2) \u05d1-Claude Desktop: Settings &larr; Connectors &larr; GitHub &larr; Connect &larr; \u05de\u05ea\u05d7\u05d1\u05e8\u05d9\u05dd &larr; Approve. (3) \u05de\u05e6\u05e8\u05e4\u05d9\u05dd \u05dc\u05e6\u05f3\u05d0\u05d8 \u05d0\u05ea \u05e7\u05d1\u05e6\u05d9 \u05d4\u05d0\u05ea\u05e8 \u05d5\u05de\u05d1\u05e7\u05e9\u05d9\u05dd \u05de-Claude: &quot;\u05e6\u05d5\u05e8 \u05de\u05d0\u05d2\u05e8 \u05d7\u05d3\u05e9 \u05d1\u05e9\u05dd my-startup-site \u05d5\u05d4\u05e2\u05dc\u05d4 \u05d0\u05dc\u05d9\u05d5 \u05d0\u05ea \u05e7\u05d1\u05e6\u05d9 \u05d4\u05d0\u05ea\u05e8 \u05e9\u05dc\u05d9&quot;. <strong>Repository (\u05de\u05d0\u05d2\u05e8)</strong> = \u05ea\u05d9\u05e7\u05d9\u05d9\u05d4 \u05d1\u05e2\u05e0\u05df \u05e9\u05e9\u05d5\u05de\u05e8\u05ea \u05db\u05dc \u05d2\u05e8\u05e1\u05d4 \u05e9\u05dc \u05d4\u05e7\u05d1\u05e6\u05d9\u05dd \u05e9\u05dc\u05da</li><li><strong>Supabase (\u05e8\u05e7 \u05d0\u05dd \u05e6\u05e8\u05d9\u05da):</strong> \u05d0\u05dd \u05d4\u05d0\u05ea\u05e8 \u05e9\u05d5\u05de\u05e8 \u05de\u05d9\u05d3\u05e2 &mdash; \u05d4\u05e8\u05e9\u05de\u05d5\u05ea, \u05d4\u05d5\u05d3\u05e2\u05d5\u05ea \u05de\u05d8\u05d5\u05e4\u05e1 &mdash; \u05d4\u05d5\u05d0 \u05e6\u05e8\u05d9\u05da \u05de\u05e1\u05d3 \u05e0\u05ea\u05d5\u05e0\u05d9\u05dd. \u05de\u05d7\u05d1\u05e8\u05d9\u05dd \u05d0\u05ea Supabase \u05d1\u05d0\u05d5\u05ea\u05d4 \u05d3\u05e8\u05da (Settings &larr; Connectors &larr; Supabase), \u05d5-Claude \u05d9\u05db\u05d5\u05dc \u05dc\u05d9\u05e6\u05d5\u05e8 \u05d8\u05d1\u05dc\u05d4, \u05dc\u05d4\u05e8\u05d0\u05d5\u05ea \u05dc\u05da \u05d0\u05ea \u05d4\u05e0\u05ea\u05d5\u05e0\u05d9\u05dd \u05d5\u05dc\u05d4\u05e1\u05d1\u05d9\u05e8 \u05d0\u05d5\u05ea\u05dd. \u05d0\u05ea\u05e8 \u05e9\u05e8\u05e7 \u05de\u05e6\u05d9\u05d2 \u05de\u05d9\u05d3\u05e2 \u05dc\u05d0 \u05e6\u05e8\u05d9\u05da \u05d0\u05ea \u05d6\u05d4</li><li><strong>Deploy (\u05d4\u05e2\u05dc\u05d0\u05d4) \u05e2\u05dd Railway:</strong> Railway \u05e7\u05d5\u05e8\u05d0 \u05d0\u05ea \u05d4\u05de\u05d0\u05d2\u05e8 \u05e9\u05dc\u05da \u05d1-GitHub \u05d5\u05d4\u05d5\u05e4\u05da \u05d0\u05d5\u05ea\u05d5 \u05dc\u05d0\u05ea\u05e8 \u05d7\u05d9. \u05e9\u05dc\u05d1\u05d9\u05dd: <code>railway.com</code> &larr; Login with GitHub &larr; New Project &larr; Deploy from GitHub repo &larr; \u05d1\u05d5\u05d7\u05e8\u05d9\u05dd \u05d0\u05ea \u05d4\u05de\u05d0\u05d2\u05e8 &larr; Settings &larr; Networking &larr; Generate Domain. \u05de\u05e7\u05d1\u05dc\u05d9\u05dd \u05db\u05ea\u05d5\u05d1\u05ea \u05d0\u05de\u05d9\u05ea\u05d9\u05ea \u05db\u05de\u05d5 <code>my-startup-site.up.railway.app</code>. \u05de\u05e2\u05db\u05e9\u05d9\u05d5 \u05db\u05dc \u05e9\u05d9\u05e0\u05d5\u05d9 \u05e9-Claude \u05de\u05e2\u05dc\u05d4 \u05dc-GitHub \u05de\u05e2\u05d3\u05db\u05df \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8 \u05dc\u05d1\u05d3. <strong>\u05d4\u05d0\u05e4\u05e9\u05e8\u05d5\u05ea \u05d4\u05d7\u05d9\u05e0\u05de\u05d9\u05ea \u05d4\u05e4\u05e9\u05d5\u05d8\u05d4 \u05d1\u05d9\u05d5\u05ea\u05e8:</strong> \u05d0\u05dd \u05d4\u05d0\u05ea\u05e8 \u05d4\u05d5\u05d0 \u05e8\u05e7 HTML, CSS \u05d5-JS, \u05d0\u05e4\u05e9\u05e8 \u05dc\u05d0\u05e8\u05d7 \u05d0\u05d5\u05ea\u05d5 \u05d2\u05dd \u05d1-GitHub Pages (\u05d1\u05d4\u05d2\u05d3\u05e8\u05d5\u05ea \u05d4\u05de\u05d0\u05d2\u05e8 &larr; Pages)</li><li><strong>\u05d3\u05d5\u05de\u05d9\u05d9\u05df (Domain) &mdash; \u05e9\u05dd \u05de\u05e9\u05dc\u05da:</strong> \u05d1\u05de\u05e7\u05d5\u05dd \u05db\u05ea\u05d5\u05d1\u05ea \u05d0\u05e8\u05d5\u05db\u05d4, \u05e9\u05dd \u05db\u05de\u05d5 <code>mystartup.com</code>. \u05d0\u05d9\u05da \u05d1\u05d5\u05d7\u05e8\u05d9\u05dd: \u05e7\u05e6\u05e8, \u05e7\u05dc \u05dc\u05d4\u05d2\u05d9\u05d9\u05d4 \u05d5\u05dc\u05d0\u05d9\u05d5\u05ea, \u05d1\u05dc\u05d9 \u05de\u05e7\u05e4\u05d9\u05dd \u05d0\u05dd \u05d0\u05e4\u05e9\u05e8. <code>.com</code> \u05dc\u05db\u05dc \u05d4\u05e2\u05d5\u05dc\u05dd, <code>.co.il</code> \u05dc\u05d9\u05e9\u05e8\u05d0\u05dc. \u05d0\u05d9\u05e4\u05d4 \u05e7\u05d5\u05e0\u05d9\u05dd: Namecheap \u05d0\u05d5 Cloudflare \u05dc-<code>.com</code>, \u05e8\u05e9\u05dd \u05d3\u05d5\u05de\u05d9\u05d9\u05e0\u05d9\u05dd \u05d9\u05e9\u05e8\u05d0\u05dc\u05d9 \u05dc-<code>.co.il</code>. \u05d3\u05d5\u05de\u05d9\u05d9\u05df <code>.com</code> \u05e2\u05d5\u05dc\u05d4 \u05d1\u05d3\u05e8\u05da \u05db\u05dc\u05dc \u05d1\u05e2\u05e8\u05da 10&ndash;15 \u05d3\u05d5\u05dc\u05e8 \u05dc\u05e9\u05e0\u05d4. \u05d0\u05ea \u05d4\u05e7\u05e0\u05d9\u05d9\u05d4 \u05e2\u05d5\u05e9\u05d9\u05dd \u05d9\u05d7\u05d3 \u05e2\u05dd \u05d4\u05d5\u05e8\u05d4. \u05d8\u05d9\u05e4: \u05dc\u05d1\u05d3\u05d5\u05e7 \u05d0\u05ea \u05de\u05d7\u05d9\u05e8 \u05d4\u05d7\u05d9\u05d3\u05d5\u05e9 \u05d5\u05dc\u05d5\u05d5\u05ea\u05e8 \u05e2\u05dc \u05ea\u05d5\u05e1\u05e4\u05d5\u05ea \u05e9\u05dc\u05d0 \u05e6\u05e8\u05d9\u05da</li><li><strong>\u05de\u05d7\u05d1\u05e8\u05d9\u05dd \u05d0\u05ea \u05d4\u05d3\u05d5\u05de\u05d9\u05d9\u05df:</strong> <strong>DNS</strong> = \u05e1\u05e4\u05e8 \u05d4\u05d8\u05dc\u05e4\u05d5\u05e0\u05d9\u05dd \u05e9\u05dc \u05d4\u05d0\u05d9\u05e0\u05d8\u05e8\u05e0\u05d8 &mdash; \u05d4\u05d5\u05d0 \u05d0\u05d5\u05de\u05e8 \u05dc\u05e2\u05d5\u05dc\u05dd \u05dc\u05d0\u05d9\u05d6\u05d4 \u05e9\u05e8\u05ea \u05d4\u05e9\u05dd \u05e9\u05dc\u05da \u05de\u05e4\u05e0\u05d4. \u05d1-Railway: Settings &larr; Networking &larr; Custom Domain &larr; \u05de\u05e7\u05dc\u05d9\u05d3\u05d9\u05dd \u05d0\u05ea \u05d4\u05d3\u05d5\u05de\u05d9\u05d9\u05df, \u05d5-Railway \u05de\u05e6\u05d9\u05d2 \u05e8\u05e9\u05d5\u05de\u05ea DNS. \u05d1\u05d0\u05ea\u05e8 \u05e9\u05d1\u05d5 \u05e7\u05e0\u05d9\u05ea \u05d0\u05ea \u05d4\u05d3\u05d5\u05de\u05d9\u05d9\u05df: \u05d4\u05d2\u05d3\u05e8\u05d5\u05ea DNS &larr; \u05de\u05d5\u05e1\u05d9\u05e4\u05d9\u05dd \u05d0\u05ea \u05d4\u05e8\u05e9\u05d5\u05de\u05d4 \u05d1\u05d3\u05d9\u05d5\u05e7. \u05d6\u05d4 \u05d9\u05db\u05d5\u05dc \u05dc\u05e7\u05d7\u05ea \u05de\u05db\u05de\u05d4 \u05d3\u05e7\u05d5\u05ea \u05d5\u05e2\u05d3 24&ndash;48 \u05e9\u05e2\u05d5\u05ea. Railway \u05de\u05d5\u05e1\u05d9\u05e3 \u05d0\u05ea <strong>\u05d4\u05de\u05e0\u05e2\u05d5\u05dc \u05e9\u05dc HTTPS</strong> (\u05ea\u05e2\u05d5\u05d3\u05ea \u05d0\u05d1\u05d8\u05d7\u05d4 \u05d7\u05d9\u05e0\u05de\u05d9\u05ea) \u05d0\u05d5\u05d8\u05d5\u05de\u05d8\u05d9\u05ea. \u05e0\u05ea\u05e7\u05e2\u05ea? \u05e9\u05dc\u05d7\u05d9 \u05dc-Claude \u05e6\u05d9\u05dc\u05d5\u05dd \u05de\u05e1\u05da \u05d5\u05e9\u05d0\u05dc\u05d9 \u05de\u05d4 \u05dc\u05d4\u05e7\u05dc\u05d9\u05d3</li><li><strong>\u05de\u05d4\u05d9\u05e8\u05d5\u05ea \u05d5\u05e8\u05e9\u05d9\u05de\u05ea \u05d4\u05e9\u05e7\u05d4:</strong> \u05e4\u05ea\u05d7\u05d9 \u05d0\u05ea <code>pagespeed.web.dev</code>, \u05d4\u05d3\u05d1\u05d9\u05e7\u05d9 \u05d0\u05ea \u05d4\u05dc\u05d9\u05e0\u05e7 \u05d5\u05d1\u05d3\u05e7\u05d9 \u05d0\u05ea \u05d4\u05e6\u05d9\u05d5\u05df \u05d1\u05de\u05d5\u05d1\u05d9\u05d9\u05dc. \u05d0\u05d9\u05d8\u05d9? \u05d1\u05e7\u05e9\u05d9 \u05de-Claude \u05dc\u05d3\u05d7\u05d5\u05e1 \u05d0\u05ea \u05d4\u05ea\u05de\u05d5\u05e0\u05d5\u05ea \u05d5\u05dc\u05d2\u05e8\u05d5\u05dd \u05dc\u05d0\u05ea\u05e8 \u05dc\u05d4\u05d9\u05d8\u05e2\u05df \u05de\u05d4\u05e8 \u05d9\u05d5\u05ea\u05e8. \u05dc\u05e4\u05e0\u05d9 \u05e9\u05e9\u05d5\u05dc\u05d7\u05d9\u05dd: \u05e0\u05e8\u05d0\u05d4 \u05d8\u05d5\u05d1 \u05d1\u05d8\u05dc\u05e4\u05d5\u05df \u05d5\u05d1\u05de\u05d7\u05e9\u05d1 &bull; \u05db\u05dc \u05db\u05e4\u05ea\u05d5\u05e8 \u05d5\u05e7\u05d9\u05e9\u05d5\u05e8 \u05e2\u05d5\u05d1\u05d3\u05d9\u05dd &bull; \u05db\u05d5\u05ea\u05e8\u05ea \u05dc\u05d3\u05e3 \u05d5\u05d0\u05d9\u05d9\u05e7\u05d5\u05df \u05d1\u05dc\u05e9\u05d5\u05e0\u05d9\u05ea &bull; \u05d4\u05d8\u05d5\u05e4\u05e1 \u05e0\u05e9\u05dc\u05d7 &bull; \u05de\u05e0\u05e2\u05d5\u05dc \u05d1\u05e9\u05d5\u05e8\u05ea \u05d4\u05db\u05ea\u05d5\u05d1\u05ea &bull; \u05d1\u05dc\u05d9 \u05e9\u05d2\u05d9\u05d0\u05d5\u05ea \u05db\u05ea\u05d9\u05d1</li></ul><div class=\"session-concepts\"><span class=\"concept-tag\">Server &mdash; \u05e9\u05e8\u05ea</span><span class=\"concept-tag\">Hosting &mdash; \u05d0\u05d7\u05e1\u05d5\u05df</span><span class=\"concept-tag\">Connector &mdash; \u05de\u05d7\u05d1\u05e8</span><span class=\"concept-tag\">Repository &mdash; \u05de\u05d0\u05d2\u05e8</span><span class=\"concept-tag\">Deploy &mdash; \u05d4\u05e2\u05dc\u05d0\u05d4</span><span class=\"concept-tag\">Domain &mdash; \u05d3\u05d5\u05de\u05d9\u05d9\u05df</span><span class=\"concept-tag\">DNS &mdash; \u05e1\u05e4\u05e8 \u05d4\u05db\u05ea\u05d5\u05d1\u05d5\u05ea</span><span class=\"concept-tag\">HTTPS &mdash; \u05d4\u05de\u05e0\u05e2\u05d5\u05dc</span></div><div class=\"session-discussion\"><div class=\"disc-label\">\u05e9\u05d0\u05dc\u05d5\u05ea \u05dc\u05d3\u05d9\u05d5\u05df</div><p>\u05d0\u05dd \u05d4\u05d9\u05d9\u05ea \u05d9\u05db\u05d5\u05dc\u05d4 \u05dc\u05d1\u05d7\u05d5\u05e8 \u05db\u05dc \u05d3\u05d5\u05de\u05d9\u05d9\u05df \u05dc\u05e1\u05d8\u05d0\u05e8\u05d8\u05d0\u05e4 \u05e9\u05dc\u05da, \u05de\u05d4 \u05d4\u05d5\u05d0 \u05d4\u05d9\u05d4? &bull; \u05de\u05d4 \u05d2\u05d5\u05dc\u05e9 \u05e6\u05e8\u05d9\u05da \u05dc\u05d4\u05d1\u05d9\u05df \u05d1-5 \u05d4\u05e9\u05e0\u05d9\u05d5\u05ea \u05d4\u05e8\u05d0\u05e9\u05d5\u05e0\u05d5\u05ea \u05d0\u05d7\u05e8\u05d9 \u05e9\u05d4\u05d5\u05d0 \u05e4\u05d5\u05ea\u05d7 \u05d0\u05ea \u05d4\u05dc\u05d9\u05e0\u05e7 \u05e9\u05dc\u05da?</p></div><div class=\"session-exercise\"><div class=\"exercise-label\">\u05ea\u05e8\u05d2\u05d5\u05dc \u05de\u05e9\u05d5\u05ea\u05e3 (25 \u05d3\u05e7\u05d5\u05ea)</div><p><strong>\u05de\u05e2\u05dc\u05d5\u05ea \u05dc\u05d0\u05d5\u05d5\u05d9\u05e8!</strong> (1) \u05de\u05d7\u05d1\u05e8\u05d9\u05dd \u05d0\u05ea GitHub \u05d1-Claude Desktop &larr; Settings &larr; Connectors. (2) \u05de\u05d1\u05e7\u05e9\u05d9\u05dd \u05de-Claude \u05dc\u05d9\u05e6\u05d5\u05e8 \u05de\u05d0\u05d2\u05e8 \u05d5\u05dc\u05d4\u05e2\u05dc\u05d5\u05ea \u05d0\u05ea \u05d4\u05d0\u05ea\u05e8. (3) Deploy \u05d1-Railway \u05d5\u05d9\u05e6\u05d9\u05e8\u05ea \u05db\u05ea\u05d5\u05d1\u05ea \u05e6\u05d9\u05d1\u05d5\u05e8\u05d9\u05ea. (4) \u05e4\u05d5\u05ea\u05d7\u05d9\u05dd \u05d0\u05ea \u05d4\u05dc\u05d9\u05e0\u05e7 \u05d4\u05d7\u05d9 \u05d1\u05d8\u05dc\u05e4\u05d5\u05df \u05d5\u05e2\u05d5\u05d1\u05e8\u05d9\u05dd \u05e2\u05dc \u05e8\u05e9\u05d9\u05de\u05ea \u05d4\u05d4\u05e9\u05e7\u05d4.</p></div><div class=\"session-homework\"><div class=\"homework-label\">\u05d0\u05ea\u05d2\u05e8 \u05d1\u05d9\u05ea</div><p>1. <strong>\u05e9\u05dc\u05d7\u05d9 \u05d0\u05ea \u05d4\u05dc\u05d9\u05e0\u05e7 \u05d4\u05d7\u05d9 \u05dc\u05de\u05d0\u05d9\u05e8</strong> \u05d1\u05d5\u05d5\u05d0\u05d8\u05e1\u05d0\u05e4.</p><p>2. <strong>\u05de\u05e9\u05d5\u05d1 \u05de-3 \u05d0\u05e0\u05e9\u05d9\u05dd:</strong> \u05e9\u05dc\u05d7\u05d9 \u05d0\u05ea \u05d4\u05dc\u05d9\u05e0\u05e7 \u05dc-3 \u05d1\u05e0\u05d9 \u05de\u05e9\u05e4\u05d7\u05d4 \u05d0\u05d5 \u05d7\u05d1\u05e8\u05d9\u05dd \u05d5\u05e9\u05d0\u05dc\u05d9: \u05de\u05d4 \u05d4\u05d1\u05e0\u05ea \u05ea\u05d5\u05da 5 \u05e9\u05e0\u05d9\u05d5\u05ea? \u05de\u05d4 \u05d0\u05d4\u05d1\u05ea? \u05de\u05d4 \u05d4\u05d9\u05d9\u05ea \u05de\u05e9\u05e0\u05d4? \u05e8\u05e9\u05de\u05d9 \u05d0\u05ea \u05d4\u05ea\u05e9\u05d5\u05d1\u05d5\u05ea.</p><p>3. <strong>\u05e9\u05e4\u05e8\u05d9 \u05d3\u05d1\u05e8 \u05d0\u05d5 \u05e9\u05e0\u05d9\u05d9\u05dd</strong> \u05de\u05d4\u05de\u05e9\u05d5\u05d1 &mdash; \u05d1\u05e7\u05e9\u05d9 \u05de-Claude \u05dc\u05d1\u05e6\u05e2 \u05d0\u05ea \u05d4\u05e9\u05d9\u05e0\u05d5\u05d9\u05d9\u05dd, \u05d5\u05d4\u05d0\u05ea\u05e8 \u05de\u05ea\u05e2\u05d3\u05db\u05df \u05dc\u05d1\u05d3.</p><p>4. <strong>\u05d4\u05ea\u05d7\u05d9\u05dc\u05d9 \u05d0\u05ea \u05de\u05e6\u05d2\u05ea \u05d4\u05e4\u05d9\u05e5\u05f3 (Pitch Deck):</strong> 5 \u05e9\u05e7\u05e4\u05d9\u05dd &mdash; \u05d4\u05d1\u05e2\u05d9\u05d4, \u05d4\u05e4\u05ea\u05e8\u05d5\u05df, \u05d4\u05d3\u05d2\u05de\u05d4 (\u05d4\u05dc\u05d9\u05e0\u05e7 \u05d4\u05d7\u05d9!), \u05de\u05d5\u05d3\u05dc \u05e2\u05e1\u05e7\u05d9 \u05d5\u05e1\u05d9\u05db\u05d5\u05dd. \u05ea\u05ea\u05d0\u05de\u05e0\u05d9 \u05e2\u05dc \u05d4\u05e4\u05d9\u05e5\u05f3 \u05e4\u05e2\u05dd \u05d0\u05d7\u05ea \u05d1\u05e7\u05d5\u05dc.</p><p>5. <strong>\u05d3\u05d5\u05de\u05d9\u05d9\u05df (\u05dc\u05d0 \u05d7\u05d5\u05d1\u05d4, \u05e2\u05dd \u05d4\u05d5\u05e8\u05d4):</strong> \u05d7\u05e4\u05e9\u05d9 \u05e9\u05dd \u05e9\u05de\u05d5\u05e6\u05d0 \u05d7\u05df \u05d1\u05e2\u05d9\u05e0\u05d9\u05d9\u05da. \u05d0\u05dd \u05ea\u05e7\u05e0\u05d5, \u05e0\u05d7\u05d1\u05e8 \u05d0\u05d5\u05ea\u05d5 \u05d1\u05d9\u05d7\u05d3.</p><div class=\"hw-connection\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05d1\u05d0 &mdash; \u05d9\u05d5\u05dd \u05d4\u05e4\u05d9\u05e5\u05f3 (Pitch Day)! \u05d4\u05dc\u05d9\u05e0\u05e7 \u05d4\u05d7\u05d9 \u05d9\u05d4\u05d9\u05d4 \u05db\u05d5\u05db\u05d1 \u05d4\u05d4\u05d3\u05d2\u05de\u05d4, \u05d5\u05d4\u05de\u05e9\u05d5\u05d1 \u05e9\u05d0\u05e1\u05e4\u05ea \u05d9\u05d7\u05d6\u05e7 \u05d0\u05ea \u05d4\u05e4\u05d9\u05e5\u05f3 \u05e9\u05dc\u05da.</div></div>"}, {"title": "\u05d9\u05d5\u05dd \u05d4\u05e4\u05d9\u05e5'", "subtitle": "\u05d4\u05e6\u05d2\u05d4", "goal": "\u05dc\u05d4\u05e6\u05d9\u05d2 \u05d0\u05ea \u05d4\u05e4\u05e8\u05d5\u05d9\u05e7\u05d8 \u05d1\u05e4\u05e0\u05d9 \u05e7\u05d4\u05dc \u2014 3 \u05d3\u05e7\u05d5\u05ea, \u05d1\u05e2\u05d9\u05d4, \u05e4\u05ea\u05e8\u05d5\u05df, \u05d3\u05de\u05d5 \u05d7\u05d9!", "html": "<div class=\"session-recap\"><div class=\"recap-label\">\u05d1\u05de\u05e4\u05d2\u05e9 \u05d4\u05e7\u05d5\u05d3\u05dd</div><p>\u05dc\u05de\u05d3\u05e0\u05d5 \u05de\u05d5\u05d3\u05dc\u05d9\u05dd \u05e2\u05e1\u05e7\u05d9\u05d9\u05dd \u05d5\u05d9\u05e6\u05e8\u05e0\u05d5 \u05ea\u05d5\u05db\u05df \u05e9\u05d9\u05d5\u05d5\u05e7\u05d9 \u05e2\u05dd AI. &bull; <strong>\u05d1\u05d3\u05d9\u05e7\u05ea \u05de\u05e9\u05d9\u05de\u05ea \u05d1\u05d9\u05ea:</strong> \u05de\u05d9 \u05d4\u05db\u05d9\u05df \u05de\u05e6\u05d2\u05ea? \u05de\u05d9 \u05d4\u05ea\u05d0\u05de\u05df \u05e2\u05dc \u05d4\u05e4\u05d9\u05e5'? \u05d1\u05d5\u05d0\u05d5 \u05e0\u05e8\u05d0\u05d4!</p></div><ul class=\"content-list\"><li><strong>\u05de\u05d1\u05e0\u05d4 \u05d4-Pitch (\u05e4\u05d9\u05e5\u05f3 &mdash; \u05d4\u05e6\u05d2\u05d4, 3 \u05d3\u05e7\u05d5\u05ea):</strong> Hook (\u05e4\u05ea\u05d9\u05d7 \u05de\u05d5\u05e9\u05da &mdash; 10 \u05e9\u05e0\u05d9\u05d5\u05ea) &mdash; \u05e2\u05d5\u05d1\u05d3\u05d4 \u05de\u05e4\u05ea\u05d9\u05e2\u05d4 \u05d0\u05d5 \u05e9\u05d0\u05dc\u05d4. Problem (\u05d4\u05d1\u05e2\u05d9\u05d4 &mdash; 30 \u05e9\u05e0\u05d9\u05d5\u05ea). Solution (\u05d4\u05e4\u05ea\u05e8\u05d5\u05df &mdash; 30 \u05e9\u05e0\u05d9\u05d5\u05ea). Live Demo (\u05d4\u05d3\u05d2\u05de\u05       {q:"איך תרוויחי כסף?", h:"מנוי חודשי? חינם עם פרימיום? פרסום?", ph:"למשל: גרסה בסיסית חינם, מנוי פרימיום..."},
      {q:"מה הדבר הראשון שתבני?", h:"הגרסה הכי פשוטה שעדיין שימושית (MVP).", ph:"למשל: דף נחיתה עם טופס הרשמה..."},
      {q:"איך תגיעי ללקוחות?", h:"רשתות חברתיות? מפה לאוזן? שיתופי פעולה?", ph:"למשל: אשתף בקבוצות של בית הספר, סרטון בטיקטוק..."},
      {q:"איך נראית הצלחה בשבילך?", h:"מה המטרה? כמה משתמשים? איזה שינוי?", ph:"למשל: 100 תלמידים ישתמשו בחודש הראשון..."},
      {q:"באיזו שפה ובאיזה סגנון יהיה האתר?", h:"אנגלית, עברית או שתיהן — ועוד סגנון וצבעים שאת אוהבת.", ph:"למשל: אנגלית, רקע כהה עם סגול בוהק, שובב ומודרני..."}
    ]
  };
  var proj = (function(){ try{ var d = JSON.parse(sget(K_PROJ) || "{}"); return {a:d.a||{}, step:d.step||0}; }catch(e){ return {a:{}, step:0}; } })();
  var savedTimer = null;
  function projSave(showTick){
    sset(K_PROJ, JSON.stringify(proj));
    if(showTick){ var el = document.getElementById("wzSaved"); if(el){ el.classList.add("show"); clearTimeout(savedTimer); savedTimer = setTimeout(function(){ el.classList.remove("show"); }, 1200); } }
  }
  function ans(i){ return (proj.a[i] || "").trim(); }
  function buildPrompt(){
    var Q = WZ[lang], v = function(i){ return ans(i) || "-"; };
    if(lang === "he"){
      return 'אני לומדת בקורס פרטי "בינה מלאכותית ויזמות" של AI Lab. סיימתי את מסמך האפיון של המיזם שלי — בני לי לפיו אתר. אם חסר לך פרט חשוב, שאלי אותי לפני שאת בונה.\n\n'+
        '# מסמך האפיון — '+(ans(0)||"המיזם שלי")+'\n'+
        '- שם המיזם: '+v(0)+'\n- הבעיה שאנחנו פותרים: '+v(1)+'\n- קהל היעד: '+v(2)+'\n- איך פותרים את זה היום (ולמה זה לא מספיק): '+v(3)+'\n- הפתרון שלנו: '+v(4)+'\n- היכולות המרכזיות: '+v(5)+'\n- איך נרוויח כסף: '+v(6)+'\n- הדבר הראשון שנבנה (MVP): '+v(7)+'\n- איך נגיע ללקוחות: '+v(8)+'\n- איך נראית הצלחה: '+v(9)+'\n- שפה וסגנון האתר: '+v(10)+'\n\n'+
        '# הוראות בנייה\nבני אתר נחיתה שלם למיזם, בקובץ index.html אחד:\n'+
        '1. שפה וסגנון: לפי מה שכתבתי בסעיף "שפה וסגנון האתר". אם האתר בעברית — כיוון RTL (dir="rtl").\n'+
        '2. הסקשנים: פתיח עם שם המיזם, משפט מכירה אחד וכפתור קריאה לפעולה גדול · הבעיה · הפתרון · היכולות ככרטיסים · איך זה עובד ב-3 צעדים · מחירים לפי המודל העסקי · טופס הרשמה או יצירת קשר (עיצובי בלבד, בלי שרת) · פוטר עם השורה "נבנה בקורס בינה מלאכותית ויזמות של AI Lab".\n'+
        '3. מותאם קודם כל למובייל ורספונסיבי מלא. בלי ספריות חיצוניות — כל ה-CSS בתוך הקובץ. נגיעות נעימות: אפקטי ריחוף, כרטיסים מעוגלים, פלטת צבעים שמתאימה לאופי המיזם.\n'+
        '4. השתמשי בתשובות מהאפיון כלשונן איפה שמתאים — זה המיזם שלי, שמרי על המילים שלי.\n'+
        '5. אחרי שתבני — הציעי לי שדרוג אחד שאוכל לבקש ממך בהמשך.';
    }
    return 'I\'m a student in AI Lab\'s private "AI & Entrepreneurship" course. I\'ve finished the brief for my startup idea — please build me a website based on it. If an important detail is missing, ask me before you build.\n\n'+
      '# Project brief — '+(ans(0)||"My project")+'\n'+
      '- Project name: '+v(0)+'\n- The problem we solve: '+v(1)+'\n- Target audience: '+v(2)+'\n- How people solve it today (and why that\'s not enough): '+v(3)+'\n- Our solution: '+v(4)+'\n- Main features: '+v(5)+'\n- How we\'ll make money: '+v(6)+'\n- First thing to build (MVP): '+v(7)+'\n- How we\'ll reach customers: '+v(8)+'\n- What success looks like: '+v(9)+'\n- Website language and look: '+v(10)+'\n\n'+
      '# Build instructions\nBuild a complete landing page for the project in a single index.html file:\n'+
      '1. Language and style: follow what I wrote under "Website language and look". If the site is in Hebrew, use right-to-left (dir="rtl").\n'+
      '2. Sections: a hero with the project name, one selling sentence and a big call-to-action button · the problem · our solution · the features as cards · how it works in 3 simple steps · pricing based on the business model · a sign-up or contact form (design only, no server) · a footer with the line "Built in the AI & Entrepreneurship course at AI Lab".\n'+
      '3. Mobile-first and fully responsive. No external libraries — all CSS inside the file. Add pleasant touches: hover effects, rounded cards, and a color palette that fits the project.\n'+
      '4. Use my answers word for word where it fits — it\'s my project, keep my words.\n'+
      '5. After you build it, suggest one upgrade I could ask you for next.';
  }
  function copyText(txt, okKey){
    var out = document.getElementById("wzCopied");
    function ok(){ if(out) out.textContent = t(okKey); }
    function fail(){
      var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.insetInlineStart = "0"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var done = false; try{ done = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      if(out) out.textContent = done ? t(okKey) : t("wzCopyFail");
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fail); else fail();
  }
  function renderProject(){
    var box = document.getElementById("wz"); if(!box) return;
    var Q = WZ[lang], n = Q.length, step = Math.min(proj.step, n);
    var back = lang === "he" ? "→ " : "← ", fwd = lang === "he" ? " ←" : " →";
    var pct = Math.round(step / n * 100);
    if(step < n){
      var q = Q[step];
      box.innerHTML = '<div class="wz-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="wz-step">'+esc(T[lang].wzStep(step+1, n))+'</div>'+
        '<h3 class="wz-q"><label for="wzArea">'+esc(q.q)+'</label></h3>'+
        '<p class="wz-hint">'+esc(q.h)+'</p>'+
        '<textarea class="wz-area" id="wzArea" placeholder="'+esc(q.ph)+'"></textarea>'+
        '<div class="wz-nav">'+
          '<button type="button" class="btn wz-ghost" data-wz="prev"'+(step===0?' disabled':'')+'>'+back+esc(t("wzPrev"))+'</button>'+
          '<span class="wz-saved" id="wzSaved">'+esc(t("wzSaved"))+'</span><span class="wz-grow"></span>'+
          '<button type="button" class="btn" data-wz="next">'+esc(step === n-1 ? t("wzFinish") : t("wzNext"))+(step === n-1 ? '' : fwd)+'</button>'+
        '</div>';
      var area = document.getElementById("wzArea");
      area.value = proj.a[step] || "";
      area.addEventListener("input", function(){ proj.a[step] = area.value; projSave(true); });
    } else {
      var filled = 0, items = "";
      for(var i=0;i<n;i++){ if(ans(i)) filled++;
        items += '<button type="button" data-wz-edit="'+i+'"><b>'+esc(Q[i].q)+'</b><span class="'+(ans(i)?'':'empty')+'">'+esc(ans(i) || t("wzEmpty"))+'</span></button>'; }
      box.innerHTML = '<div class="wz-bar"><i style="width:100%"></i></div>'+
        '<h3 class="wz-q">'+esc(t("wzDoneTitle"))+'</h3>'+
        '<p class="wz-hint">'+esc(T[lang].wzDoneSub(filled, n))+'</p>'+
        '<div class="wz-sum">'+items+'</div>'+
        '<div class="wz-nav">'+
          '<button type="button" class="btn wz-ghost" data-wz="restart">'+esc(t("wzRestart"))+'</button><span class="wz-grow"></span>'+
          '<button type="button" class="btn wz-ghost" data-wz="brief">'+esc(t("wzCopyBrief"))+'</button>'+
          '<button type="button" class="btn" data-wz="prompt">'+esc(t("wzCopyPrompt"))+'</button>'+
        '</div><div class="wz-copied" id="wzCopied" aria-live="polite"></div>';
    }
  }
  document.getElementById("wz").addEventListener("click", function(e){
    var b = e.target.closest("[data-wz],[data-wz-edit]"); if(!b) return;
    var n = WZ[lang].length, act = b.getAttribute("data-wz");
    if(b.hasAttribute("data-wz-edit")){ proj.step = +b.getAttribute("data-wz-edit"); }
    else if(act === "prev"){ proj.step = Math.max(0, proj.step-1); }
    else if(act === "next"){ proj.step = Math.min(n, proj.step+1); }
    else if(act === "restart"){ proj.step = 0; }
    else if(act === "prompt"){ copyText(buildPrompt(), "wzCopiedPrompt"); return; }
    else if(act === "brief"){
      var Q = WZ[lang], lines = [lang === "he" ? "תיק הפרויקט שלי — AI Lab" : "My project brief — AI Lab", ""];
      for(var i=0;i<n;i++){ lines.push(Q[i].q); lines.push(ans(i) || "-"); lines.push(""); }
      copyText(lines.join("\n"), "wzCopiedBrief"); return;
    }
    projSave(false); renderProject();
    var a = document.getElementById("wzArea"); if(a) a.focus({preventScroll:true});
    document.getElementById("project").scrollIntoView({block:"start", behavior:"smooth"});
  });

  // ---------- init ----------
  applyLang();
  showPortal(sget(K_AUTH) === "1");
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
