<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#FFF4E0">
<title>החנות של מיה · AI Lab</title>
<!--
  אזור אישי לקורס פרטי (AI Lab) — "החנות של מיה".
  שער הטלפון הוא שער נוחות בלבד, לא אבטחה: הדף סטטי. המספר לא נשמר בקוד —
  רק SHA-256 של 10 הספרות.
  קבצים:  lessons.js (תאריכים ושמות) · content/lesson-NN.js (תוכן כל שיעור).
  בדיקות: ?now=2026-11-08T09:30:00 (שעון ישראל) · (כל השיעורים פתוחים תמיד; ?open=all לא נדרש).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Heebo:wght@400;500;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF4E0; --paper:#FFFDF7; --ink:#2E2A44; --ink-soft:#5B5675;
  --coin:#FFC93C; --coin-d:#E8A400; --coin-l:#FFF0C2;
  --peach:#FFB49A; --peach-d:#F2805F; --peach-l:#FFE4D9;
  --teal:#20B8AA; --teal-d:#118C82; --teal-l:#D3F3EE;
  --pink:#FF5C8A; --green:#2DBE6C;
  --r:22px; --bw:3px; --sh:5px 6px 0 var(--ink);
  --f-head:"Rubik","Heebo",system-ui,sans-serif; --f-body:"Heebo","Rubik",system-ui,sans-serif; --f-fun:"Varela Round","Rubik",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--f-body); font-size:19px; line-height:1.6; color:var(--ink);
  background-color:var(--cream);
  background-image:radial-gradient(rgba(232,164,0,.16) 1.6px, transparent 1.8px);
  background-size:26px 26px;
  min-height:100vh;
}
h1,h2,h3{font-family:var(--f-head); line-height:1.2; margin:0}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:4px solid var(--pink); outline-offset:3px; border-radius:12px}
.hidden{display:none !important}
.wrap{max-width:1080px; margin:0 auto; padding:0 18px}
b,strong{font-weight:700}

/* ---------- awning ---------- */
.awning{
  height:34px; position:relative;
  background:repeating-linear-gradient(90deg, var(--peach) 0 44px, #FFF9EE 44px 88px);
  border-bottom:var(--bw) solid var(--ink);
}
.awning::after{
  content:""; position:absolute; left:0; right:0; top:100%; height:16px;
  background:
    radial-gradient(circle at 22px 0, var(--peach) 15px, transparent 16px) 0 0/88px 16px repeat-x,
    radial-gradient(circle at 66px 0, #FFF9EE 15px, transparent 16px) 0 0/88px 16px repeat-x;
  pointer-events:none;
}

/* ---------- gate ---------- */
.gate{min-height:100vh; display:flex; flex-direction:column}
.gate-main{flex:1; display:flex; align-items:center; justify-content:center; padding:56px 18px 40px}
.gate-card{
  width:100%; max-width:470px; background:var(--paper); border:var(--bw) solid var(--ink); border-radius:30px;
  box-shadow:8px 9px 0 var(--ink); padding:70px 26px 30px; text-align:center; position:relative;
}
.door-sign{
  position:absolute; top:-30px; left:50%; width:150px; height:62px; margin-left:-75px;
  perspective:600px;
}
.door-sign::before{ /* string */
  content:""; position:absolute; left:50%; top:-26px; width:56px; height:30px; margin-left:-28px;
  border:3px solid var(--ink); border-bottom:0; border-radius:28px 28px 0 0;
}
.ds-inner{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.door-sign.open .ds-inner{transform:rotateY(180deg)}
.ds-face{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; backface-visibility:hidden;
  border:var(--bw) solid var(--ink); border-radius:14px; font:900 28px var(--f-head); letter-spacing:.5px;
}
.ds-front{background:var(--peach); }
.ds-back{background:var(--coin); transform:rotateY(180deg)}
.gate-emoji{font-size:64px; line-height:1; margin-bottom:8px}
.gate h1{font-size:40px; margin-bottom:8px}
.gate-text{font-size:21px; margin-bottom:22px; color:var(--ink)}
.gate form{display:flex; flex-direction:column; gap:14px}
.gate input{
  width:100%; font:700 28px var(--f-head); letter-spacing:2px; text-align:center; padding:14px 12px;
  border:var(--bw) solid var(--ink); border-radius:18px; background:#fff; color:var(--ink);
}
.gate input:focus{outline:none; box-shadow:0 0 0 5px var(--coin)}
.gate-err{min-height:30px; color:#C2185B; font-weight:700; margin-top:12px; font-size:18px}
.gate-help{font-size:16px; color:var(--ink-soft)}
.gate.shake .gate-card{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
  font:800 21px var(--f-head); padding:14px 26px; border-radius:999px; border:var(--bw) solid var(--ink);
  background:var(--coin); color:var(--ink); box-shadow:4px 5px 0 var(--ink); transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-1px,-2px); box-shadow:5px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,4px); box-shadow:1px 1px 0 var(--ink)}
.btn.teal{background:var(--teal); color:#fff}
.btn.white{background:#fff}
.btn.big{font-size:24px; padding:18px 30px}
.btn:disabled{opacity:.55; cursor:default; transform:none}

/* ---------- header ---------- */
.shop-head{position:relative; z-index:5}
.head-row{display:flex; align-items:center; gap:16px; padding-top:26px; padding-bottom:6px}
.sign{
  text-decoration:none; display:flex; align-items:baseline; gap:8px; background:var(--paper);
  border:var(--bw) solid var(--ink); border-radius:16px; padding:6px 16px 8px; box-shadow:4px 5px 0 var(--ink);
  transform:rotate(-2deg); flex:none;
}
.sign small{font:500 16px var(--f-fun); color:var(--ink-soft)}
.sign span{font:900 30px var(--f-head); color:var(--peach-d)}
.tabs{display:flex; gap:8px; margin-inline-start:auto}
.tab{
  display:flex; align-items:center; gap:7px; text-decoration:none; font:700 18px var(--f-head);
  padding:9px 16px; border-radius:999px; border:var(--bw) solid transparent;
}
.tab .ti{font-size:22px; line-height:1}
.tab:hover{background:rgba(255,201,60,.35)}
.tab.on{background:#fff; border-color:var(--ink); box-shadow:3px 4px 0 var(--ink)}
.wallet-chip{
  display:flex; align-items:center; gap:8px; font:900 24px var(--f-head);
  background:var(--coin); border:var(--bw) solid var(--ink); border-radius:999px; padding:5px 16px 5px 10px;
  box-shadow:3px 4px 0 var(--ink); flex:none;
}
.wallet-chip.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}

/* ---------- coin (CSS drawn) ---------- */
.coin{
  --s:34px; width:var(--s); height:var(--s); border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%, #FFF3B8 0 18%, var(--coin) 42%, var(--coin-d) 100%);
  border:2.5px solid var(--ink); box-shadow:inset 0 0 0 calc(var(--s) * .1) rgba(255,255,255,.35);
  font:900 calc(var(--s) * .5) var(--f-head); color:#8A5A00;
}
.coin::after{content:"★"}
.coin.spin{animation:spinY 2.6s linear infinite}
@keyframes spinY{to{transform:rotateY(360deg)}}
.fly-coin{position:fixed; z-index:100; pointer-events:none; --s:54px; left:0; top:0}
.spark{position:fixed; z-index:99; pointer-events:none; font-size:22px; left:0; top:0}

/* ---------- views ---------- */
main{padding-top:26px; padding-bottom:60px}
.view-title{display:flex; align-items:center; gap:14px; margin-bottom:8px}
.view-title .vt-emoji{font-size:48px; line-height:1}
.view-title h1{font-size:clamp(30px,6vw,42px)}
.view-sub{font-size:20px; color:var(--ink-soft); margin-bottom:26px; max-width:640px}
.card{
  background:var(--paper); border:var(--bw) solid var(--ink); border-radius:var(--r); box-shadow:var(--sh);
}

/* hero */
.hero{display:grid; grid-template-columns:1.35fr 1fr; gap:22px; margin-bottom:26px}
.hello{padding:26px 26px 24px; position:relative; overflow:hidden}
.hello h1{font-size:clamp(36px,7vw,54px); margin-bottom:6px}
.hello p{font-size:20px; color:var(--ink-soft); max-width:460px}
.prog{margin-top:20px}
.prog-label{font:700 20px var(--f-head); margin-bottom:8px}
.prog-label b{color:var(--teal-d); font-size:26px}
.prog-bar{display:grid; grid-template-columns:repeat(20,1fr); gap:4px}
.prog-bar i{height:16px; border-radius:6px; background:#EFE6D3; border:2px solid rgba(46,42,68,.25)}
.prog-bar i.c.on{background:var(--teal); border-color:var(--ink)}
.prog-bar i.a.on{background:var(--peach-d); border-color:var(--ink)}
.prog-legend{display:flex; justify-content:space-between; font-size:15px; color:var(--ink-soft); margin-top:6px}
.jar{padding:22px; background:var(--coin-l); display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px}
.jar-label{font:700 19px var(--f-fun)}
.jar-row{display:flex; align-items:center; gap:14px}
.jar-row .coin{--s:72px}
.jar-num{font:900 64px var(--f-head); line-height:1}
.jar-next{font-size:17px; color:var(--ink-soft); max-width:300px}
.mini-bar{width:100%; max-width:280px; height:14px; border:2.5px solid var(--ink); border-radius:99px; background:#fff; overflow:hidden; margin-top:4px}
.mini-bar i{display:block; height:100%; background:var(--coin); width:0; transition:width .6s}

/* next lesson */
.next{
  background:var(--teal); color:#fff; padding:24px 26px; margin-bottom:34px; position:relative; overflow:hidden;
  display:grid; grid-template-columns:1fr auto; gap:18px 26px; align-items:center;
}
.next::before{ /* ticket notches */
  content:""; position:absolute; top:50%; right:-17px; width:30px; height:30px; margin-top:-15px; border-radius:50%;
  background:var(--cream); border:var(--bw) solid var(--ink);
}
.next::after{content:""; position:absolute; top:50%; left:-17px; width:30px; height:30px; margin-top:-15px; border-radius:50%; background:var(--cream); border:var(--bw) solid var(--ink)}
.next-label{font:700 18px var(--f-fun); opacity:.95; display:flex; align-items:center; gap:8px}
.next h2{font-size:clamp(24px,4.4vw,34px); margin:6px 0 4px; color:#fff}
.next-when{font-size:19px; font-weight:500}
.count{display:flex; gap:10px; margin-top:14px; direction:rtl}
.count div{
  background:#fff; color:var(--ink); border:var(--bw) solid var(--ink); border-radius:14px; min-width:70px; padding:6px 8px 4px; text-align:center;
}
.count b{display:block; font:900 32px var(--f-head); line-height:1.1}
.count span{font-size:14px; color:var(--ink-soft)}
.next-side{display:flex; flex-direction:column; gap:12px; align-items:stretch; min-width:240px}
.zoom-btn.live{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:4px 5px 0 var(--ink), 0 0 0 0 rgba(255,201,60,.9)}50%{box-shadow:4px 5px 0 var(--ink), 0 0 0 14px rgba(255,201,60,0)}}
.live-note{font:700 18px var(--f-head); min-height:0; text-align:center}
.next .btn.white{font-size:19px; padding:10px 18px}

/* shelves */
.shelf{margin-bottom:40px}
.shelf-head{display:flex; align-items:center; gap:14px; margin-bottom:18px}
.shelf-emoji{
  width:62px; height:62px; flex:none; border-radius:18px; border:var(--bw) solid var(--ink); display:flex; align-items:center; justify-content:center;
  font-size:34px; background:var(--pc-l); box-shadow:3px 4px 0 var(--ink);
}
.shelf-head h2{font-size:clamp(26px,4.6vw,34px)}
.shelf-head p{font-size:17px; color:var(--ink-soft)}
.shelf-count{margin-inline-start:auto; font:900 22px var(--f-head); background:#fff; border:var(--bw) solid var(--ink); border-radius:999px; padding:4px 14px; flex:none}
.p-computers{--pc:var(--teal); --pc-d:var(--teal-d); --pc-l:var(--teal-l)}
.p-ai{--pc:var(--peach-d); --pc-d:#D9603D; --pc-l:var(--peach-l)}
.tags{display:grid; grid-template-columns:repeat(auto-fill,minmax(186px,1fr)); gap:26px 18px; padding:16px 4px 26px; position:relative}
.plank{height:18px; border:var(--bw) solid var(--ink); border-radius:8px; background:linear-gradient(#E9B97A,#D69A55); box-shadow:0 6px 0 rgba(46,42,68,.18); margin-top:-6px}
.tag{
  position:relative; display:flex; flex-direction:column; gap:6px; text-align:start; text-decoration:none;
  background:#fff; border:var(--bw) solid var(--ink); border-radius:20px 20px 20px 20px; padding:30px 16px 16px;
  box-shadow:4px 5px 0 var(--ink); transition:transform .15s, box-shadow .15s; min-height:196px; width:100%;
}
.tags .tag:nth-child(odd){transform:rotate(-1.3deg)}
.tags .tag:nth-child(even){transform:rotate(1.1deg)}
.tags .tag:not(.locked):hover{transform:rotate(0) translateY(-4px); box-shadow:6px 9px 0 var(--ink)}
.tag::before{ /* top band */
  content:""; position:absolute; top:0; left:0; right:0; height:18px; background:var(--pc); border-bottom:var(--bw) solid var(--ink); border-radius:17px 17px 0 0;
}
.tag .hole{position:absolute; top:3px; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--cream); border:2.5px solid var(--ink); z-index:1}
.tag-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.tag-num{
  width:40px; height:40px; border-radius:50%; border:var(--bw) solid var(--ink); background:var(--pc-l);
  display:flex; align-items:center; justify-content:center; font:900 20px var(--f-head);
}
.tag-icon{font-size:38px; line-height:1}
.tag-title{font:800 19px var(--f-head); line-height:1.25; flex:1}
.tag-date{font-size:15px; color:var(--ink-soft)}
.chip{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; font:700 15px var(--f-head); padding:4px 11px; border-radius:999px; border:2.5px solid var(--ink); background:var(--coin-l)}
.tag.open .chip{background:var(--coin)}
.tag.prep .chip{background:#EDE7F6}
.tag.done .chip{background:#C9F2D9}
.tag.locked{background:#F6EFE1; border-style:dashed; box-shadow:none; cursor:not-allowed}
.tag.locked::before{background:#DCD3C2}
.tag.locked .tag-icon{filter:grayscale(1); opacity:.55}
.tag.locked .tag-title{color:var(--ink-soft)}
.tag.locked .chip{background:#fff; border-style:dashed}
.tag.next-up{box-shadow:4px 5px 0 var(--ink), 0 0 0 6px var(--coin)}
.stamp{
  position:absolute; bottom:52px; left:10px; transform:rotate(-14deg);
  font:900 22px var(--f-head); color:var(--pink); border:3px solid var(--pink); border-radius:10px; padding:0 10px; opacity:.85;
  background:rgba(255,255,255,.7); pointer-events:none;
}

/* certificates */
.certs{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px}
.cert{display:flex; align-items:center; gap:16px; padding:20px; text-align:start; width:100%}
.cert .medal{font-size:54px; line-height:1}
.cert .c-title{display:block; font:800 22px var(--f-head); line-height:1.25}
.cert .c-sub{display:block; font-size:16px; color:var(--ink-soft)}
.cert.got{background:linear-gradient(135deg,#FFF6D6,#FFE39A)}
.cert.no{background:#F6EFE1; border-style:dashed; box-shadow:none; cursor:default}
.cert.no .medal{filter:grayscale(1); opacity:.5}

/* lesson page */
.back{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font:700 19px var(--f-head); margin-bottom:16px; padding:6px 14px; border-radius:999px; border:2.5px solid var(--ink); background:#fff}
.l-hero{padding:24px; display:flex; gap:20px; align-items:center; margin-bottom:24px; background:var(--pc-l)}
.l-icon{width:96px; height:96px; flex:none; border-radius:26px; background:#fff; border:var(--bw) solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:54px; box-shadow:3px 4px 0 var(--ink)}
.l-kicker{font:700 17px var(--f-fun); color:var(--pc-d)}
.l-hero h1{font-size:clamp(28px,5.4vw,44px); margin:4px 0 8px}
.l-intro{font-size:21px}
.box{padding:22px 24px; margin-bottom:24px}
.box h2{font-size:26px; margin-bottom:14px; display:flex; align-items:center; gap:10px}
.goals ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.goals li{display:flex; gap:12px; align-items:flex-start; font-size:20px}
.goals li::before{content:"★"; flex:none; width:32px; height:32px; border-radius:50%; background:var(--coin); border:2.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:16px; margin-top:2px; color:#8A5A00}
.watch{display:inline-flex; gap:8px; align-items:center; font:700 18px var(--f-head); background:var(--peach-l); border:2.5px solid var(--ink); border-radius:999px; padding:4px 14px; margin-bottom:14px}
.frame{position:relative; width:100%; aspect-ratio:16/9; border:var(--bw) solid var(--ink); border-radius:16px; overflow:hidden; background:#000}
.frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.v-meta{margin-top:12px; font-size:18px}
.v-note{margin-top:6px; font-size:18px; color:var(--ink-soft)}
.slides-cta{display:flex; align-items:center; gap:18px; padding:18px 22px; margin-bottom:24px; background:var(--coin-l); flex-wrap:wrap}
.slides-cta p{flex:1; min-width:200px; font-size:19px}
.steps{list-style:none; margin:0; padding:0; display:grid; gap:14px; counter-reset:st}
.steps li{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; padding:14px; border-radius:18px; background:#fff; border:2.5px solid rgba(46,42,68,.18)}
.st-num{
  counter-increment:st; width:52px; height:52px; border-radius:16px; border:var(--bw) solid var(--ink); background:var(--pc-l);
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
}
.st-num::before{content:counter(st); font:900 15px var(--f-head); color:var(--pc-d)}
.st-num span{font-size:24px}
.steps h3{font-size:21px; margin-bottom:2px}
.steps p{font-size:19px}
.coupon{
  position:relative; margin-bottom:24px; padding:26px 26px 24px; background:var(--coin-l);
  border:var(--bw) dashed var(--ink); border-radius:24px; box-shadow:none; outline:var(--bw) solid var(--ink); outline-offset:7px;
  margin-inline:9px;
}
.coupon-head{display:inline-flex; align-items:center; gap:8px; font:900 20px var(--f-head); background:var(--ink); color:var(--coin); padding:5px 16px; border-radius:999px; margin-bottom:12px}
.coupon h3{font-size:clamp(24px,4.4vw,32px); margin-bottom:10px}
.coupon .m-text{font-size:20px; line-height:1.7}
.coupon .m-min{margin-top:12px; font:700 18px var(--f-head); color:var(--ink-soft)}
.m-actions{margin-top:18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.m-done{font:800 21px var(--f-head); color:#17804A; display:flex; align-items:center; gap:10px}
.linkish{background:none; border:0; padding:4px; font-size:16px; text-decoration:underline; color:var(--ink-soft)}
.l-two{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; margin-bottom:24px}
.sticky{
  position:relative; background:#FFF59A; padding:30px 24px 22px; border:var(--bw) solid var(--ink); border-radius:6px 6px 26px 6px;
  box-shadow:var(--sh); transform:rotate(-1.4deg);
}
.sticky .tape{position:absolute; top:-14px; left:50%; width:110px; height:28px; margin-left:-55px; background:rgba(32,184,170,.45); border:2px solid rgba(46,42,68,.35); transform:rotate(3deg)}
.sticky .lbl{font:700 17px var(--f-fun); color:var(--ink-soft)}
.sticky .term{font:900 38px var(--f-head); margin:2px 0 6px}
.sticky p{font-size:19px}
details.parents{padding:0; overflow:hidden}
details.parents summary{list-style:none; cursor:pointer; padding:18px 22px; font:800 22px var(--f-head); display:flex; align-items:center; gap:10px}
details.parents summary::-webkit-details-marker{display:none}
details.parents summary::after{content:"＋"; margin-inline-start:auto; font-size:24px}
details.parents[open] summary::after{content:"－"}
details.parents .p-body{padding:0 22px 20px; font-size:18px; line-height:1.7}
.l-nav{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:10px}
.prep-box{padding:34px 24px; text-align:center}
.prep-box .big{font-size:70px}
.prep-box h2{font-size:28px; margin:8px 0}

/* dictionary */
.words{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px}
.wcard{padding:18px; position:relative}
.wcard .w-from{font:700 14px var(--f-fun); color:var(--pc-d)}
.wcard .w-term{font:900 28px var(--f-head); margin:2px 0 6px}
.wcard p{font-size:18px}
.wcard.empty{background:#F6EFE1; border-style:dashed; box-shadow:none; text-align:center; color:var(--ink-soft)}
.wcard.empty .w-term{font-size:40px; color:#CBBFA8}

/* business */
.idea{padding:22px 24px; margin-bottom:26px; background:#2F6F5E; color:#fff; border-radius:24px; position:relative}
.idea::before{content:""; position:absolute; inset:8px; border:3px solid #C99A5B; border-radius:16px; pointer-events:none}
.idea label{display:block; font:800 24px var(--f-head); margin-bottom:10px; position:relative}
.idea textarea{
  position:relative; width:100%; min-height:96px; resize:vertical; font:400 24px var(--f-fun); line-height:1.5; color:#fff;
  background:rgba(255,255,255,.08); border:2px dashed rgba(255,255,255,.55); border-radius:14px; padding:12px 14px;
}
.idea textarea::placeholder{color:rgba(255,255,255,.65)}
.idea textarea:focus{outline:none; border-color:var(--coin)}
.idea .saved{position:relative; font-size:16px; min-height:24px; margin-top:6px; color:#C9F2D9}
.biz-prog{font:700 20px var(--f-head); margin-bottom:14px}
.biz{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px}
.bitem{display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer; position:relative}
.bitem input{position:absolute; opacity:0; width:1px; height:1px; pointer-events:none}
.bitem .b-icon{font-size:36px; flex:none; width:58px; height:58px; display:flex; align-items:center; justify-content:center; background:var(--peach-l); border-radius:16px; border:2.5px solid var(--ink)}
.bitem .b-txt{flex:1; min-width:0}
.bitem .b-title{display:block; font:800 20px var(--f-head); line-height:1.25}
.bitem .b-hint{display:block; font-size:15px; color:var(--ink-soft); line-height:1.4}
.bitem .b-check{
  width:40px; height:40px; flex:none; border:var(--bw) solid var(--ink); border-radius:12px; background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; color:#fff;
}
.bitem.on{background:#E7FAEF}
.bitem.on .b-check{background:var(--green)}
.bitem.on .b-check::after{content:"✓"}
.bitem input:focus-visible ~ .b-check{outline:4px solid var(--pink); outline-offset:3px}
.bitem.lock{background:#F6EFE1; border-style:dashed; box-shadow:none; cursor:not-allowed}
.bitem.lock .b-icon{filter:grayscale(1); opacity:.55; background:#fff}
.bitem.lock .b-check{border-style:dashed; color:var(--ink-soft); font-size:18px}
.bitem.lock .b-check::after{content:"🔒"}

/* footer */
.foot{padding:20px 0 40px; text-align:center; color:var(--ink-soft); font-size:16px}
.foot .linkish{font-size:15px}

/* slides player */
.pz{position:fixed; inset:0; z-index:60; background:var(--cream); display:flex; flex-direction:column}
.pz-top{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:var(--bw) solid var(--ink); background:var(--paper)}
.pz-crumb{flex:1; min-width:0; font:700 18px var(--f-head); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pz-count{font:800 18px var(--f-head); flex:none}
.pz-x{width:48px; height:48px; flex:none; border-radius:50%; border:var(--bw) solid var(--ink); background:#fff; font-size:24px; font-weight:900; line-height:1}
.pz-stage{flex:1; display:flex; align-items:center; justify-content:center; padding:20px 16px; overflow:auto}
.pz-card{
  width:100%; max-width:820px; background:#fff; border:var(--bw) solid var(--ink); border-radius:30px; box-shadow:8px 9px 0 var(--ink);
  padding:38px 28px; text-align:center; animation:pop .35s cubic-bezier(.3,1.4,.6,1);
}
@keyframes pop{from{transform:scale(.92); opacity:0}to{transform:scale(1); opacity:1}}
.pz-emoji{font-size:clamp(84px,18vw,140px); line-height:1.1; margin-bottom:12px}
.pz-card h2{font-size:clamp(30px,5.6vw,48px); margin-bottom:12px}
.pz-card p{font-size:clamp(21px,3.4vw,28px); line-height:1.5; max-width:640px; margin:0 auto}
.pz-bot{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px 18px; border-top:var(--bw) solid var(--ink); background:var(--paper)}
.pz-dots{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; flex:1}
.pz-dots i{width:13px; height:13px; border-radius:50%; border:2px solid var(--ink); background:#fff}
.pz-dots i.on{background:var(--coin); transform:scale(1.25)}
.pz-bot .btn{font-size:19px; padding:11px 18px}

/* modal / toast */
.modal{position:fixed; inset:0; z-index:70; background:rgba(46,42,68,.55); display:flex; align-items:center; justify-content:center; padding:18px}
.diploma{
  width:100%; max-width:560px; background:#FFFDF2; border:var(--bw) solid var(--ink); border-radius:24px; box-shadow:8px 9px 0 var(--ink);
  padding:34px 26px 26px; text-align:center; position:relative; outline:3px double var(--coin-d); outline-offset:-14px;
}
.diploma .medal{font-size:84px; line-height:1}
.diploma .d-kicker{font:700 18px var(--f-fun); color:var(--ink-soft); margin-top:6px}
.diploma h2{font-size:clamp(30px,6vw,42px); color:var(--peach-d); margin:6px 0 10px}
.diploma p{font-size:20px}
.diploma .d-sign{margin-top:16px; font:400 20px var(--f-fun)}
.diploma .btn{margin-top:20px}
.toast{
  position:fixed; z-index:80; bottom:24px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); width:max-content;
  background:var(--ink); color:#fff; font:700 18px var(--f-head); padding:12px 20px; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.25);
  text-align:center;
}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .next{grid-template-columns:1fr}
  .next-side{min-width:0}
  .l-two{grid-template-columns:1fr}
  .certs{grid-template-columns:1fr}
}
@media (max-width:700px){
  body{font-size:18px; padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .head-row{padding-top:24px}
  .sign span{font-size:26px}
  .tabs{
    position:fixed; z-index:40; left:0; right:0; bottom:0; margin:0; justify-content:space-around; gap:4px;
    background:var(--paper); border-top:var(--bw) solid var(--ink); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{flex-direction:column; gap:2px; font-size:14px; padding:6px 8px; flex:1; text-align:center; border-radius:16px}
  .tab .ti{font-size:26px}
  .tab.on{box-shadow:2px 3px 0 var(--ink)}
  .wallet-chip{margin-inline-start:auto}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
  .tags{grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px 14px}
  .tag{padding:28px 12px 14px; min-height:184px}
  .tag-title{font-size:17px}
  .tag-icon{font-size:32px}
  .tag-num{width:36px; height:36px; font-size:18px}
  .stamp{font-size:18px; bottom:48px}
  .hello,.jar,.next,.box{padding-left:18px; padding-right:18px}
  .count div{min-width:0; flex:1}
  .count b{font-size:26px}
  .l-hero{flex-direction:column; align-items:flex-start; padding:20px 18px}
  .l-icon{width:76px; height:76px; font-size:42px}
  .steps li{padding:12px; gap:12px}
  .st-num{width:46px; height:46px}
  .coupon{padding:22px 18px; margin-inline:7px}
  .pz-card{padding:28px 18px}
  .pz-bot .btn{padding:10px 14px; font-size:17px}
  .shelf-head{align-items:flex-start; gap:12px}
  .shelf-emoji{width:50px; height:50px; font-size:28px; border-radius:14px}
  .shelf-head h2{font-size:25px}
  .shelf-head p{font-size:15px; line-height:1.4}
  .shelf-count{font-size:18px; padding:2px 10px}
}
@media (max-width:380px){
  .tags{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px 10px}
  .tag-title{font-size:16px}
  .sign small{font-size:13px}
  .sign{padding:5px 12px 7px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>

<!-- ============ GATE ============ -->
<section class="gate" id="gate">
  <div class="awning" aria-hidden="true"></div>
  <div class="gate-main">
    <div class="gate-card">
      <div class="door-sign" id="doorSign" aria-hidden="true">
        <div class="ds-inner"><div class="ds-face ds-front">סגור</div><div class="ds-face ds-back">פתוח!</div></div>
      </div>
      <div class="gate-emoji" aria-hidden="true">🏪</div>
      <h1>היי מיה!</h1>
      <p class="gate-text">הקלידי את מספר הטלפון של אמא/אבא</p>
      <form id="gateForm" autocomplete="off" novalidate>
        <input id="phone" type="tel" inputmode="numeric" dir="ltr" maxlength="16" placeholder="05X-XXXXXXX" aria-label="מספר הטלפון של אמא או אבא">
        <button class="btn big" type="submit">פתיחת החנות 🔑</button>
      </form>
      <p class="gate-err" id="gateErr" role="alert"></p>
      <p class="gate-help">רק ספרות. משהו לא עובד? בקשי עזרה מאמא או מאבא.</p>
    </div>
  </div>
</section>

<!-- ============ PORTAL ============ -->
<div id="portal" class="hidden">
  <header class="shop-head">
    <div class="awning" aria-hidden="true"></div>
    <div class="wrap head-row">
      <a class="sign" href="#/"><small>החנות של</small><span>מיה</span></a>
      <nav class="tabs" aria-label="תפריט">
        <a class="tab" href="#/" data-r="home"><span class="ti" aria-hidden="true">🏪</span><span>החנות</span></a>
        <a class="tab" href="#/words" data-r="words"><span class="ti" aria-hidden="true">📖</span><span>המילון שלי</span></a>
        <a class="tab" href="#/business" data-r="business"><span class="ti" aria-hidden="true">💼</span><span>העסק של מיה</span></a>

      <a class="wallet-chip" id="walletChip" href="#/" aria-label="מטבעות בארנק" style="text-decoration:none"><span class="coin" style="--s:30px" aria-hidden="true"></span><b id="coinCount" aria-live="polite">0</b></a>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <footer class="foot wrap">
    <p>שאלות? אפשר תמיד לשאול את מאיר 💛 · AI Lab</p>
    <button type="button" class="linkish" id="logoutBtn">יציאה מהחנות</button>
  </footer>
</div>

<!-- slides player -->
<div class="pz hidden" id="pz" role="dialog" aria-modal="true" aria-labelledby="pzTitle">
  <div class="pz-top">
    <div class="pz-crumb" id="pzCrumb"></div>
    <div class="pz-count" id="pzCount"></div>
    <button type="button" class="pz-x" id="pzClose" aria-label="סגירת המצגת" title="סגירה (Esc)">✕</button>
  </div>
  <div class="pz-stage" id="pzStage"></div>
  <div class="pz-bot">
    <button type="button" class="btn white" id="pzPrev">→ הקודם</button>
    <div class="pz-dots" id="pzDots" aria-hidden="true"></div>
    <button type="button" class="btn" id="pzNext">הבא ←</button>
  </div>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true"></div>

<script>
(function(){
  "use strict";
  var META = window.MIA_META || {lessons:[], business:[]};
  function C(n){ var all = window.MIA_CONTENT || {}; var c = all[n]; return (c && typeof c === "object") ? c : null; }

  // sha256 of the 10-digit number (student's parent) + Meir's preview number (same as in s/52f39d0e)
  var HASHES = ["2bb4993c2713b23febe0db84f5bc6d4a80d11655156e14066cdd7a7f3b8c7b33", "9d36cde44e382cb931fde85dc4c4a13c8b8acec09b2dd6a015830f9a6da32f3d"];
  var K_AUTH = "mia_c6_ok", K_DONE = "mia_c6_done", K_BIZ = "mia_c6_biz", K_IDEA = "mia_c6_idea";
  var TZ = "Asia/Jerusalem";
  var TOTAL = 20;

  // ---------- storage ----------
  function sget(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function sset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function sdel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function jget(k, d){ try{ var v = JSON.parse(sget(k)); return v == null ? d : v; }catch(e){ return d; } }

  // ---------- time ----------
  function tzOffsetMs(ts, tz){
    var f = new Intl.DateTimeFormat("en-US",{timeZone:tz, hourCycle:"h23", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"});
    var p = {}; f.formatToParts(new Date(ts)).forEach(function(x){ p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute, +p.second) - (ts - ts%1000);
  }
  function zoned(y,mo,d,h,mi){
    var guess = Date.UTC(y,mo-1,d,h,mi), off = tzOffsetMs(guess, TZ), ts = guess - off, off2 = tzOffsetMs(ts, TZ);
    return off2 !== off ? guess - off2 : ts;
  }
  var qs = new URLSearchParams(location.search);
  var nowShift = 0;
  (function(){
    var q = qs.get("now"); if(!q) return;
    var m = q.match(/^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d)(?::(\d\d))?)?$/), t = NaN;
    if(m) t = zoned(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0)) + (+(m[6]||0))*1000; // no offset → Israel time
    else t = Date.parse(q);
    if(!isNaN(t)) nowShift = t - Date.now();
  })();
  var OPEN_ALL = qs.get("open") === "all";
  function now(){ return Date.now() + nowShift; }
  function hm(s){ var p = String(s||"").split(":"); return [+p[0]||0, +p[1]||0]; }
  var LT = hm(META.lessonTime || "10:00"), OT = hm(META.openTime || "09:00"), DUR = (META.durationMin || 60) * 60000;

  var LESSONS = (META.lessons || []).map(function(l){
    var d = String(l.date).split("-");
    var start = zoned(+d[0], +d[1], +d[2], LT[0], LT[1]);
    return { n:l.n, title:l.title, icon:l.icon || "⭐", part:l.part === "ai" ? "ai" : "computers",
             start:start, end:start + DUR, open:zoned(+d[0], +d[1], +d[2], OT[0], OT[1]) };
  });
  function lessonByN(n){ for(var i=0;i<LESSONS.length;i++) if(LESSONS[i].n === n) return LESSONS[i]; return null; }

  var fmtCache = {};
  function fmt(ts, opts, key){
    var f = fmtCache[key] || (fmtCache[key] = new Intl.DateTimeFormat("he-IL", Object.assign({timeZone:TZ}, opts)));
    return f.format(new Date(ts));
  }
  function longDate(ts){ return fmt(ts, {weekday:"long", day:"numeric", month:"long"}, "long"); }
  function shortDate(ts){ return fmt(ts, {day:"numeric", month:"numeric"}, "short"); }
  function hhmm(ts){ return fmt(ts, {hour:"2-digit", minute:"2-digit", hourCycle:"h23"}, "hm"); }

  // ---------- state ----------
  function doneList(){ var a = jget(K_DONE, []); return Array.isArray(a) ? a.filter(function(x){ return typeof x === "number"; }) : []; }
  function isDone(n){ return doneList().indexOf(n) !== -1; }
  function coins(){ return doneList().length; }
  function unlocked(L){ return true; } // מאיר 02.11: כל השיעורים פתוחים תמיד (לא נעילה לפי תאריך)
  function partName(p){ return p === "ai" ? "בינה מלאכותית" : "עולם המחשבים"; }
  function stateOf(L){
    if(!unlocked(L)) return "locked";
    if(isDone(L.n)) return "done";
    return C(L.n) ? "open" : "prep";
  }
  function nextLesson(){ var n = now(); for(var i=0;i<LESSONS.length;i++) if(n < LESSONS[i].end) return LESSONS[i]; return null; }

  // ---------- helpers ----------
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(https?:\/\/[^\s<)]+|www\.[^\s<)]+)/g, function(u){ var h = u.indexOf("http")===0 ? u : "https://"+u; return '<a href="'+h+'" target="_blank" rel="noopener" dir="ltr" style="word-break:break-all">'+u+"</a>"; }).replace(/\n/g, "<br>"); }
  function ytId(u){ var m = String(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : null; }
  function $(id){ return document.getElementById(id); }
  var toastT = null;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.add("hidden"); }, 3200);
  }
  function refreshWallet(){ $("coinCount").textContent = coins(); }

  // ---------- coin animation ----------
  function flyCoin(fromEl, done){
    var target = $("walletChip"), a = fromEl.getBoundingClientRect(), b = target.getBoundingClientRect();
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce || !document.body.animate){ done(); return; }
    var x0 = a.left + a.width/2 - 27, y0 = a.top + a.height/2 - 27, x1 = b.left + b.width/2 - 27, y1 = b.top + b.height/2 - 27;
    var c = document.createElement("span"); c.className = "coin fly-coin"; document.body.appendChild(c);
    var anim = c.animate([
      {transform:"translate("+x0+"px,"+y0+"px) scale(.4) rotateY(0deg)", opacity:0},
      {transform:"translate("+x0+"px,"+(y0-70)+"px) scale(1.5) rotateY(540deg)", opacity:1, offset:.45},
      {transform:"translate("+x1+"px,"+y1+"px) scale(.55) rotateY(1080deg)", opacity:1}
    ], {duration:1100, easing:"cubic-bezier(.45,.05,.4,1)"});
    var sp = ["✨","⭐","✨","💛","⭐","✨"];
    sp.forEach(function(s, i){
      var e = document.createElement("span"); e.className = "spark"; e.textContent = s; document.body.appendChild(e);
      var ang = (i/sp.length) * Math.PI * 2, dx = Math.cos(ang) * 70, dy = Math.sin(ang) * 60;
      var cx = a.left + a.width/2 - 11, cy = a.top + a.height/2 - 14;
      e.animate([{transform:"translate("+cx+"px,"+cy+"px) scale(.3)", opacity:1},{transform:"translate("+(cx+dx)+"px,"+(cy+dy)+"px) scale(1.2)", opacity:0}],
                {duration:800, easing:"ease-out"}).onfinish = function(){ e.remove(); };
    });
    anim.onfinish = function(){ c.remove(); target.classList.remove("bump"); void target.offsetWidth; target.classList.add("bump"); done(); };
  }

  // ---------- certificates ----------
  var CERTS = [
    {need:10, title:"תעודת מומחית מחשבים", medal:"🏅", text:"על 10 משימות שהושלמו בעולם המחשבים"},
    {need:20, title:"תעודת יזמית AI", medal:"🏆", text:"על 20 משימות — מחשבים, בינה מלאכותית ועסק משלך"}
  ];
  function showCert(c){
    var m = $("modal");
    m.innerHTML = '<div class="diploma"><div class="medal">'+c.medal+'</div><div class="d-kicker">החנות של מיה · AI Lab</div>'+
      '<h2>'+esc(c.title)+'</h2><p>מוענקת בגאווה ל<b>מיה</b><br>'+esc(c.text)+'</p>'+
      '<div class="d-sign">מאיר, המורה שלך ✍️</div><button type="button" class="btn" id="modalClose">איזה כיף! 🎉</button></div>';
    m.classList.remove("hidden"); $("modalClose").focus();

  // ---------- slides player ----------
  var pz = {open:false, n:0, i:0, opener:null};
  function pzList(){ var c = C(pz.n); return (c && c.slides) || []; }
  function renderSlide(){
    var list = pzList(), s = list[pz.i] || {}, L = lessonByN(pz.n);
    $("pzCrumb").textContent = "שיעור " + pz.n + " · " + (L ? L.title : "");

  function openSlides(n, opener){
    pz.open = true; pz.n = n; pz.i = 0; pz.opener = opener || null;

  function closeSlides(silent){
    pz.open = false; $("pz").classList.add("hidden"); document.body.style.overflow = "";
    if(!silent && pz.opener && document.body.contains(pz.opener)) pz.opener.focus();
  }
  function go(d){ var n = pzList().length, j = pz.i + d; if(j >= n){ closeSlides(); return; } if(j >= 0){ pz.i = j; renderSlide(); } }
  $("pzPrev").addEventListener("click", function(){ go(-1); });
  $("pzNext").addEventListener("click", function(){ go(1); });

    if(!pz.open) return;
    if(e.key === "Escape"){ closeSlides(); return; }
    if(e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); go(1); }   // RTL: left = forward
    else if(e.key === "ArrowRight" || e.key === "PageUp"){ e.preventDefault(); go(-1); }
  });
  var tx = null, ty = null;

    if(tx === null) return;

  function pad(x){ return x < 10 ? "0" + x : "" + x; }
  function tick(){
    if($("portal").classList.contains("hidden")) return;
    var s = sig();
    if(s !== lastSig && route.name !== "lesson" && !pz.open && !(document.activeElement && document.activeElement.id === "ideaBox")){ render(); return; }
    if(route.name !== "home") return;
    var nl = nextLesson(); if(!nl || !$("countBox")) return;
    var n = now(), diff = Math.max(0, nl.start - n);

    $("cH").textContent = pad(Math.floor(diff % 86400000 / 3600000));
    $("cM").textContent = pad(Math.floor(diff % 3600000 / 60000));
    $("cS").textContent = pad(Math.floor(diff % 60000 / 1000));
    var live = n >= nl.start - 60 * 60000, note = "";
    if(n >= nl.start){ note = "🔴 השיעור מתקיים עכשיו — היכנסי!"; $("nextLabel").textContent = "🔴 מתקיים עכשיו"; }
    else if(live){ note = "השיעור מתחיל בעוד " + Math.ceil((nl.start - n) / 60000) + " דקות ⏰"; }
    $("liveNote").textContent = note;
    $("zoomBtn").classList.toggle("live", live);
  }
  setInterval(tick, 1000);

  // ---------- gate ----------
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0" + b.toString(16)).slice(-2); }).join(""); }
  function showPortal(on){
    $("gate").classList.toggle("hidden", on); $("portal").classList.toggle("hidden", !on);
    if(on) render();
  }
  function gateErr(msg){
    $("gateErr").textContent = msg;
    if(msg){ var g = $("gate"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake"); }
  }
  $("gateForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var digits = ($("phone").value || "").replace(/\D/g, "");
    if(!digits){ gateErr("צריך להקליד מספר טלפון 🙂"); return; }
    if(!(window.crypto && crypto.subtle && window.TextEncoder)){ gateErr("הדפדפן לא מצליח לבדוק את המספר. בקשי מאמא או מאבא לפתוח את הקישור שוב."); return; }
    var cand = digits.indexOf("972") === 0 ? "0" + digits.slice(3) : (digits.length === 9 ? "0" + digits : digits.slice(-10));
    if(cand.length !== 10){ gateErr("המספר צריך להיות 10 ספרות. נסי שוב!"); return; }
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(cand)).then(function(buf){
      if(HASHES.indexOf(hex(buf)) === -1){ gateErr("אופס, המספר לא מתאים. בדקי ונסי שוב!"); return; }
      gateErr(""); sset(K_AUTH, "1"); $("phone").value = "";
      $("doorSign").classList.add("open");
      setTimeout(function(){ showPortal(true); window.scrollTo(0,0); }, 750);
    }, function(){ gateErr("משהו השתבש. נסי שוב."); });
  });
  $("logoutBtn").addEventListener("click", function(){ sdel(K_AUTH); $("doorSign").classList.remove("open"); showPortal(false); });

  showPortal(sget(K_AUTH) === "1");
})();
</script>
</body>
