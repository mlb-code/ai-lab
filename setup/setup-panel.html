<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SetUp — הפאנל שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--card:rgba(255,255,255,0.04);--card2:rgba(13,18,32,0.98);--border:rgba(255,255,255,0.08);--accent:#00d4ff;--accent2:#7c3aed;--accent3:#f59e0b;--text:#f0f4ff;--muted:#8896b0;--green:#22c55e;--red:#f87171}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Heebo',sans-serif;direction:rtl;text-align:right;min-height:100vh;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(130px);opacity:0.12;animation:drift 22s ease-in-out infinite alternate}
.orb1{width:500px;height:500px;background:#00d4ff;top:-150px;right:-100px}
.orb2{width:400px;height:400px;background:#7c3aed;bottom:-80px;left:-80px;animation-delay:-9s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(35px,55px)}}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 3rem;background:rgba(8,12,20,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-user{display:flex;align-items:center;gap:0.6rem;color:var(--muted);font-size:0.9rem}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:700;color:#fff;flex-shrink:0}
.btn-new{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:0.55rem 1.4rem;border-radius:100px;font-family:'Heebo',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-new:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,212,255,0.3)}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:3rem 2rem}
.page-header{margin-bottom:2.5rem}
.page-header h1{font-size:2rem;font-weight:900;margin-bottom:0.4rem}
.page-header h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-header p{color:var(--muted);font-size:1rem}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2.5rem}
.stat-card{background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.6rem;display:flex;align-items:center;gap:1rem}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.si-blue{background:rgba(0,212,255,0.12)}.si-purple{background:rgba(124,58,237,0.12)}.si-amber{background:rgba(245,158,11,0.12)}
.stat-info label{font-size:0.78rem;color:var(--muted);display:block;margin-bottom:0.2rem}
.stat-info strong{font-size:1.4rem;font-weight:900}
.empty-state{text-align:center;padding:5rem 2rem;background:var(--card2);border:1px dashed var(--border);border-radius:24px}
.empty-state .empty-icon{font-size:3.5rem;margin-bottom:1rem}
.empty-state h3{font-size:1.3rem;font-weight:700;margin-bottom:0.5rem}
.empty-state p{color:var(--muted);margin-bottom:2rem}
.setups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.preview-card{background:var(--card2);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:all 0.3s;position:relative}
.preview-card:hover{transform:translateY(-5px);border-color:rgba(0,212,255,0.3);box-shadow:0 0 40px rgba(0,212,255,0.08)}
.preview-card.expanded{border-color:rgba(0,212,255,0.35)}
.card-top{padding:1.6rem;background:linear-gradient(135deg,rgba(0,212,255,0.05),rgba(124,58,237,0.05));border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.card-tier-badge{display:inline-block;font-size:0.72rem;font-weight:700;padding:0.25rem 0.7rem;border-radius:100px;margin-bottom:0.5rem;letter-spacing:0.05em}
.tier-economy{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.2)}
.tier-recommended{background:rgba(0,212,255,0.12);color:var(--accent);border:1px solid rgba(0,212,255,0.2)}
.tier-premium{background:rgba(245,158,11,0.12);color:var(--accent3);border:1px solid rgba(245,158,11,0.2)}
.card-name{font-size:1.15rem;font-weight:900;margin-bottom:0.3rem}
.card-use{font-size:0.82rem;color:var(--muted)}
.card-price-block{text-align:left;flex-shrink:0}
.card-price{font-size:1.6rem;font-weight:900;color:var(--accent);line-height:1}
.card-price-label{font-size:0.75rem;color:var(--muted);margin-top:0.2rem}
.card-score{display:flex;align-items:center;gap:0.6rem;padding:0.9rem 1.6rem;border-bottom:1px solid var(--border);font-size:0.82rem;color:var(--muted)}
.score-track{flex:1;height:5px;background:var(--border);border-radius:100px;overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:100px;transition:width 0.8s ease}
.score-num{font-weight:700;color:var(--accent)}
.specs-preview{padding:1.2rem 1.6rem;display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.spec-chip{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.7rem;font-size:0.78rem;line-height:1.3}
.spec-chip .sc-label{color:var(--muted);display:block;font-size:0.7rem}
.spec-chip .sc-val{font-weight:600}
.specs-full{padding:0 1.6rem 1.2rem;display:none;flex-direction:column}
.preview-card.expanded .specs-full{display:flex}
.preview-card.expanded .specs-preview{display:none}
.spec-row{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--border);font-size:0.88rem}
.spec-row:last-child{border-bottom:none}
.spec-row .sr-label{color:var(--muted)}
.spec-row .sr-val{font-weight:600;text-align:left}
.card-footer{padding:1rem 1.6rem;display:flex;gap:0.7rem;border-top:1px solid var(--border);background:rgba(0,0,0,0.15)}
.btn-expand{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.55rem;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.2s}
.btn-expand:hover{border-color:var(--accent);color:var(--accent)}
.btn-delete{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.55rem 0.9rem;border-radius:10px;font-family:'Heebo',sans-serif;font-size:0.85rem;cursor:pointer;transition:all 0.2s}
.btn-delete:hover{border-color:var(--red);color:var(--red)}
.card-date{position:absolute;top:1rem;left:1rem;font-size:0.72rem;color:var(--muted)}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:700px){
  nav{padding:1rem 1.2rem}
  .stats-row{grid-template-columns:1fr}
  .setups-grid{grid-template-columns:1fr}
  .specs-preview{grid-template-columns:1fr}
  .page{padding:2rem 1rem}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<nav>
  <div class="nav-logo" onclick="goBack()">SetUp</div>
  <div class="nav-right">
    <div class="nav-user">
      <div class="avatar" id="userAvatar">L</div>
      <span id="userName">Liam</span>
    </div>
    <button class="btn-new" onclick="goBack()">+ Setup חדש</button>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1>הפאנל של <span id="headerName">Liam</span></h1>
    <p>כל ה-Setups השמורים שלך במקום אחד</p>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-icon si-blue">🖥️</div><div class="stat-info"><label>Setups שמורים</label><strong id="statCount">0</strong></div></div>
    <div class="stat-card"><div class="stat-icon si-amber">💰</div><div class="stat-info"><label>טווח מחירים</label><strong id="statRange">—</strong></div></div>
    <div class="stat-card"><div class="stat-icon si-purple">⭐</div><div class="stat-info"><label>ציון התאמה ממוצע</label><strong id="statScore">—</strong></div></div>
  </div>
  <div id="content"></div>
</div>

<script>
const urlParams=new URLSearchParams(window.location.search);
const currentUser=urlParams.get('user')||'Liam';
const storageKey=`setups_${currentUser}`;
document.getElementById('userName').textContent=currentUser;
document.getElementById('userAvatar').textContent=currentUser.charAt(0).toUpperCase();
document.getElementById('headerName').textContent=currentUser;

function goBack(){window.location.href=`setup-dashboard.html?user=${encodeURIComponent(currentUser)}`;}
function loadSetups(){return JSON.parse(localStorage.getItem(storageKey)||'[]');}
function saveSetups(arr){localStorage.setItem(storageKey,JSON.stringify(arr));}

function tierClass(tier){
  if(tier==='חסכוני')return 'tier-economy';
  if(tier==='מומלץ')return 'tier-recommended';
  return 'tier-premium';
}
function tierLabel(tier){
  if(tier==='חסכוני')return '💚 חסכוני';
  if(tier==='מומלץ')return '🏆 מומלץ';
  return '✨ פרמיום';
}

function deleteSetup(id){
  if(!confirm('למחוק את ה-Setup הזה?'))return;
  saveSetups(loadSetups().filter(s=>s.id!==id));
  render();showToast('🗑️ ה-Setup נמחק');
}

function toggleExpand(id){
  const card=document.getElementById(`card-${id}`);
  const btn=document.getElementById(`expand-${id}`);
  const exp=card.classList.toggle('expanded');
  btn.textContent=exp?'▲ הסתר מפרט מלא':'▼ מפרט מלא';
}

function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;padding:0.85rem 2rem;border-radius:100px;font-family:Heebo,sans-serif;font-weight:700;font-size:0.9rem;z-index:9999;box-shadow:0 8px 30px rgba(0,212,255,0.3);animation:fadeUp 0.3s ease both;white-space:nowrap';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.4s';setTimeout(()=>t.remove(),400);},2500);
}

function render(){
  const setups=loadSetups();
  document.getElementById('statCount').textContent=setups.length;
  if(setups.length>0){
    const prices=setups.map(s=>s.price);
    document.getElementById('statRange').textContent=prices.length>1?`₪${Math.min(...prices).toLocaleString()} – ₪${Math.max(...prices).toLocaleString()}`:`₪${prices[0].toLocaleString()}`;
    document.getElementById('statScore').textContent=`${Math.round(setups.reduce((a,s)=>a+s.score,0)/setups.length)}%`;
  } else {
    document.getElementById('statRange').textContent='—';
    document.getElementById('statScore').textContent='—';
  }
  const content=document.getElementById('content');
  if(setups.length===0){
    content.innerHTML=`<div class="empty-state"><div class="empty-icon">🖥️</div><h3>אין Setups שמורים עדיין</h3><p>עבור לשאלון, בחר Setup שמתאים לך ושמור אותו כאן</p><button class="btn-new" onclick="goBack()" style="padding:0.8rem 2rem;font-size:1rem">+ צור Setup חדש</button></div>`;
    return;
  }
  content.innerHTML=`<div class="setups-grid">${setups.map(s=>`
    <div class="preview-card" id="card-${s.id}">
      <div class="card-date">${s.savedAt}</div>
      <div class="card-top">
        <div>
          <div class="card-tier-badge ${tierClass(s.tier)}">${tierLabel(s.tier)}</div>
          <div class="card-name">${s.name}</div>
          <div class="card-use">שימוש: ${s.use}</div>
        </div>
        <div class="card-price-block">
          <div class="card-price">₪${s.price.toLocaleString()}</div>
          <div class="card-price-label">מחיר משוער</div>
        </div>
      </div>
      <div class="card-score">
        <span>התאמה</span>
        <div class="score-track"><div class="score-fill" style="width:${s.score}%"></div></div>
        <span class="score-num">${s.score}%</span>
      </div>
      <div class="specs-preview">
        ${s.parts.slice(0,4).map(p=>`<div class="spec-chip"><span class="sc-label">${p.label}</span><span class="sc-val">${p.value}</span></div>`).join('')}
      </div>
      <div class="specs-full">
        ${s.parts.map(p=>`<div class="spec-row"><span class="sr-label">${p.label}</span><span class="sr-val">${p.value}</span></div>`).join('')}
      </div>
      <div class="card-footer">
        <button class="btn-expand" id="expand-${s.id}" onclick="toggleExpand(${s.id})">▼ מפרט מלא</button>
        <button class="btn-delete" onclick="deleteSetup(${s.id})" title="מחק">🗑️</button>
      </div>
    </div>`).join('')}</div>`;
}
render();
</script>
</body>
</html>
