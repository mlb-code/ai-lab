name: gsc-queries

on:
  workflow_dispatch:
    inputs:
      days:
        description: "כמה ימים אחורה"
        required: false
        default: "90"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export queries
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          DAYS: ${{ github.event.inputs.days }}
        run: node agent/gsc-queries.mjs | tee gsc-queries.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-queries
          path: gsc-queries.md
