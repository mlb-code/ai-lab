name: marketing-daily
on:
  schedule:
    # 08:30 שעון ישראל, ואז כל 20 דקות עד 10:00 כגיבוי (קרון GitHub לא אמין). ריצה שמוצאת דוח של היום יוצאת מיד.
    - cron: '30 5 * * *'
    - cron: '50 5 * * *'
    - cron: '10,30,50 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch: {}
permissions:
  issues: write
  contents: write
concurrency:
  group: marketing-daily
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: כבר יש דוח היום?
        id: dup
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          TODAY=$(TZ=Asia/Jerusalem date +%d.%m.%Y)
          if [ "${{ github.event_name }}" = "schedule" ] && gh issue list --label marketing-daily --search "$TODAY in:title" --json number -q '.[0].number' | grep -q .; then echo "skip=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.dup.outputs.skip != 'true'
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        if: steps.dup.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - name: דוח GA4
        if: steps.dup.outputs.skip != 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          DAYS: "7"
        run: node agent/ga-report.mjs > ga.md || echo "## GA4 לא זמין" > ga.md
      - name: סוכן שיווק
        if: steps.dup.outputs.skip != 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pip install -q requests anthropic && python3 agent/marketing_daily.py > /dev/null
      - name: פתיחת Issue
        if: steps.dup.outputs.skip != 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          TODAY=$(TZ=Asia/Jerusalem date +%d.%m.%Y)
          gh label create marketing-daily --color 1d76db --description "דוח שיווק יומי" 2>/dev/null || true
          gh issue create --title "דוח שיווק יומי · $TODAY" --label marketing-daily --body-file report.md
      - name: שמירת מצב
        if: steps.dup.outputs.skip != 'true'
        run: |
          git config user.name "marketing-agent"; git config user.email "laviemb@gmail.com"
          git pull -q --rebase origin main || true
          git add agent/marketing-state.json && (git diff --cached --quiet || git commit -qm "marketing-agent: state $(date -u +%F)") && git push -q origin main || true
