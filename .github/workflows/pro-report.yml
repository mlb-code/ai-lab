name: pro-report
on:
  workflow_dispatch: {}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: AI Lab Pro GA4
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PRO_PROPERTY_ID: ${{ vars.GA4_PRO_PROPERTY_ID }}
        run: node agent/pro-daily.mjs | tee pro.html; cat pro.html >> $GITHUB_STEP_SUMMARY
