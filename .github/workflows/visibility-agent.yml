name: visibility-agent

on:
  schedule:
    - cron: '0 5 * * 5'   # כל יום שישי 08:00 שעון ישראל
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  weekly-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: הרצת סוכן הנראות
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agent/visibility-agent.mjs
